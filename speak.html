<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>雅思口语</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000308">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--fg:#e8eef4;--dim:#6b7590;--line:rgba(255,255,255,.14);--gold:#e9c46a;--blue:#8fb8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%;color:var(--fg);font-family:-apple-system,"PingFang SC",sans-serif;background:#000308}
body{background:radial-gradient(ellipse at 50% 0%,#0b1430 0%,#000308 60%) fixed}
#bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 10px;background:rgba(0,3,8,.92);backdrop-filter:blur(8px);z-index:5}
#bar b{font-size:14px;font-weight:600;letter-spacing:2px;margin-right:auto}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap}
.btn.on{border-color:var(--gold);color:var(--gold)}
#tabs{display:flex;gap:6px;padding:0 16px 10px;position:sticky;top:calc(max(12px,env(safe-area-inset-top)) + 46px);background:rgba(0,3,8,.92);z-index:4}
main{max-width:640px;width:100%;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.note{font-size:12.5px;color:var(--dim);line-height:1.7;margin:4px 0 12px}
.story{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.03);margin-bottom:12px}
.story h3{margin:0;font-size:16px;color:var(--gold)}
.story .who{font-size:12px;color:var(--dim);margin:2px 0 10px}
.story .cover{font-size:12px;color:var(--blue);margin:0 0 10px;line-height:1.6}
.ln{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;font-size:15px;line-height:1.65;margin-bottom:8px}
.ln i{font-style:normal;font-size:11px;color:var(--gold);padding-top:4px}
.sw{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:#c9d2e3;line-height:1.7}
.sw div{margin-bottom:4px}
.story.open .sw{display:block}
.story .tg{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
.row{display:grid;grid-template-columns:28px 1fr 44px 44px;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row .n{color:var(--dim);font-size:12px}.row .s{color:var(--gold);text-align:center;font-weight:600}.row .b{color:var(--blue);text-align:center;font-size:12px}
.row1{display:grid;grid-template-columns:1fr 36px;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row1 small{display:block;color:var(--dim);font-size:12px;line-height:1.5}
.row1 .b{color:var(--blue);text-align:center;font-size:12px;padding-top:4px}
h2{font-size:14px;color:var(--gold);margin:20px 0 8px;font-weight:600}
.blk{border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;background:rgba(255,255,255,.03);font-size:14.5px;line-height:1.65}
.blk b{color:var(--gold);display:block;font-size:13px;margin-bottom:3px}
</style></head><body>
<div id="bar"><a class="btn" href="index.html">←</a><b>雅 思 口 语</b><a class="btn" href="writing.html">写作</a></div>
<div id="tabs">
 <button class="btn on" data-t="st">4 个故事</button><button class="btn" data-t="map">哪题用哪个</button><button class="btn" data-t="bk">12 块</button>
</div>
<main id="main"></main>
<script src="speak-data.js"></script>
<script>
const S=window.S,M=document.getElementById('main');
const esc=s=>s.replace(/</g,'&lt;');
function st(){
 M.innerHTML='<div class="note">背熟这 4 段。考到什么题,换第一句和主角,中间不动。点卡片看「怎么改」。</div>'+
 S.stories.map(s=>`<div class="story" onclick="this.classList.toggle('open')">
  <h3>${s.id} · ${s.name}</h3><div class="who">${esc(s.who)}</div><div class="cover">${esc(s.cover)}</div>
  ${s.lines.map(l=>`<div class="ln"><i>${l[0]}</i><span>${esc(l[1])}</span></div>`).join('')}
  <div class="sw">${s.swap.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>
  <div class="tg">点开 · 怎么改</div></div>`).join('');
}
function map(){
 M.innerHTML='<div class="note">Part 2:题号 · 题 · 用哪个故事 · 加哪块。</div>'+
 S.p2.map(r=>`<div class="row"><span class="n">${r[0]}</span><span>${esc(r[1])}</span><span class="s">故事${r[2]}</span><span class="b">${r[3]}</span></div>`).join('')+
 '<h2>Part 1 · 一句真话 + 一块</h2>'+
 S.p1.map(r=>`<div class="row1"><span>${esc(r[0])}<small>${esc(r[2])}</small></span><span class="b">${r[1]}</span></div>`).join('')+
 '<h2>Part 3 · 四句</h2><div class="note">表态 → For one thing / For another → Back in the day, these days → That said, strike a balance。政府题用 H,科技题用 G。</div>';
}
function bk(){
 M.innerHTML='<div class="note">每块 3 句,顺着背。任何题 = 直答 1 句 + 2 块 + 1 个真细节。</div>'+
 S.blocks.map(b=>`<div class="blk"><b>${b[0]}</b>${esc(b[1])}</div>`).join('')+
 '<h2>粘合句</h2>'+S.glue.map(g=>`<div class="blk"><b>${g[0]}</b>${esc(g[1])}</div>`).join('');
}
const V={st,map,bk};
document.querySelectorAll('#tabs .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs .btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');V[b.dataset.t]();window.scrollTo(0,0)});
st();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
