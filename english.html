<style>

<div id="bar"><a class="btn" href="./" style="text-decoration:none;margin-right:10px">←</a><b>英 语 星 图</b>

 <div id="hudTip">点星球选中 · 再点一次炸开一圈 · 点空白收起</div></div>
<script>

/* ================= 数据 ================= */
var PERSON=[
 {cn:'我',en:'I',n:'1s'},{cn:'你',en:'you',n:'2'},
 {cn:'他',en:'he',n:'3s'},{cn:'我们',en:'we',n:'1p'}];

var VERB=[
 {cn:'吃',base:'eat',s:'eats',past:'ate',pp:'eaten',ing:'eating'},
 {cn:'去',base:'go',s:'goes',past:'went',pp:'gone',ing:'going'},
 {cn:'知道',base:'know',s:'knows',past:'knew',pp:'known',ing:'knowing'},
 {cn:'喜欢',base:'like',s:'likes',past:'liked',pp:'liked',ing:'liking'}];

var OBJ=[{cn:'面',en:'noodles'},{cn:'这个',en:'it'},
 {cn:'那儿',en:'there'},{cn:'咖啡',en:'coffee'}];

var TENSE=[
 {k:'now', cn:'现在',  hint:'…吗 / 平时'},
 {k:'past',cn:'过去',  hint:'…了(昨天)'},
 {k:'fut', cn:'将来',  hint:'回头…'},
 {k:'perf',cn:'已经…了',hint:'到现在为止'},
 {k:'prog',cn:'正…着', hint:'此刻正在'},
 {k:'pperf',cn:'早就…了',hint:'过去的过去'}];

var MODE=[
 {k:'say',cn:'说',  sub:'陈述'},
 {k:'ask',cn:'问',  sub:'…吗?'},
 {k:'no', cn:'否',  sub:'不 / 没'},
 {k:'wh', cn:'啥',  sub:'疑问词'}];

var WH=[{cn:'啥',en:'What'},{cn:'哪儿',en:'Where'},{cn:'为啥',en:'Why'},
 {cn:'咋',en:'How'},{cn:'啥时候',en:'When'}];

/* 助动词行：一整排,按时间+人称自动点亮 */
var MODAL=[
 {w:'can',   cn:'能不能',       neg:"can't",         z:'能',   q:'能不能'},
 {w:'should',cn:'该不该',       neg:"shouldn't",     z:'该',   q:'该不该'},
 {w:'must',  cn:'必须 / 得',    neg:"don't have to", z:'必须', q:'非得',    qm:1},
 {w:'may',   cn:'可不可以',     neg:"may not",       z:'可以', q:'可不可以'},
 {w:'would', cn:'会不会(客气)', neg:"wouldn't",      z:'会',   q:'会不会'}];
var AUXES=['do','does','did','will','have','has','had','am','is','are'];
var AUXCN={do:'…吗 / 不…',does:'他…吗',did:'…了吗(过去)',will:'会…吗',
 have:'已经…了',has:'他已经…了',had:'早就…了',
 am:'我是 / 我在',is:'他是 / 他在',are:'你们是 / 在'};
var ISMODAL={};
for(var _i=0;_i<MODAL.length;_i++){AUXES.push(MODAL[_i].w);AUXCN[MODAL[_i].w]=MODAL[_i].cn;ISMODAL[MODAL[_i].w]=1;}
function modalOf(){ if(!S.modal)return null;
 for(var i=0;i<MODAL.length;i++) if(MODAL[i].w===S.modal) return MODAL[i];
 return null;}

var CONN=[
 {cn:'但是',  en:'but',      ord:'AB',sep:', '},
 {cn:'所以',  en:'so',       ord:'AB',sep:', '},
 {cn:'因为',  en:'because',  ord:'AB',sep:' '},
 {cn:'而且',  en:'and',      ord:'AB',sep:' '},
 {cn:'虽然',  en:'although', ord:'BA',sep:', '},
 {cn:'如果',  en:'if',       ord:'BA',sep:', '},
 {cn:'当…时', en:'when',     ord:'BA',sep:', '},
 {cn:'除非',  en:'unless',   ord:'BA',sep:', '}];

var BLOCKB=[
 {cn:'我不饿',   en:"I'm not hungry"},
 {cn:'外面下雨', en:"it's raining"},
 {cn:'他走了',   en:'he left'},
 {cn:'我没钱',   en:"I don't have money"}];

var HOOK=[
 {cn:'(中文不说)',en:'that', use:'他走了',  ub:'he left'},
 {cn:'那个人…',   en:'who',  use:'那个人走了',ub:'the guy left'},
 {cn:'那个东西…', en:'which',use:'那个东西没了',ub:'the thing is gone'},
 {cn:'…啥',       en:'what', use:'你要啥',   ub:'you want'},
 {cn:'…啥时候',   en:'when', use:'他走的',   ub:'he left'}];

/* ================= 状态 ================= */
var S={mode:0,tense:0,person:0,verb:0,obj:0,wh:0,conn:0,bIdx:0,hook:0,ring:null,modal:null};

/* ================= 语法引擎 ================= */
function is3s(){return PERSON[S.person].n==='3s';}
function is1s(){return PERSON[S.person].n==='1s';}

function auxWord(){
 var md=modalOf(); if(md)return md.w;
 var t=TENSE[S.tense].k;
 if(t==='now') return is3s()?'does':'do';
 if(t==='past')return 'did';
 if(t==='fut') return 'will';
 if(t==='perf')return is3s()?'has':'have';
 if(t==='pperf')return 'had';
 return is1s()?'am':(is3s()?'is':'are');
}
/* 陈述句里 do/does/did 是藏在动词里的 */
function auxHidden(){
 if(S.modal)return false;
 var t=TENSE[S.tense].k;
 return S.mode===0 && (t==='now'||t==='past');
}
function auxNeg(){
 var md=modalOf(); if(md)return md.neg;
 var t=TENSE[S.tense].k;
 if(t==='now') return is3s()?"doesn't":"don't";
 if(t==='past')return "didn't";
 if(t==='fut') return "won't";
 if(t==='perf')return is3s()?"hasn't":"haven't";
 if(t==='pperf')return "hadn't";
 return is1s()?"'m not":(is3s()?"isn't":"aren't");
}
function verbForm(){
 var v=VERB[S.verb],t=TENSE[S.tense].k,m=MODE[S.mode].k;
 if(S.modal)return v.base;
 if(t==='perf'||t==='pperf')return v.pp;
 if(t==='prog')return v.ing;
 if(t==='fut') return v.base;
 if(m==='say') return t==='past'?v.past:(is3s()?v.s:v.base);
 return v.base;              /* 助动词出场了,动词退回原形 */
}
function verbFormKey(){
 var v=VERB[S.verb],f=verbForm();
 if(f===v.s)return 's'; if(f===v.past)return 'past';
 if(f===v.pp)return 'pp'; if(f===v.ing)return 'ing'; return 'base';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* 主句英文 */
function sentEN(){
 var p=PERSON[S.person].en,o=OBJ[S.obj].en,f=verbForm(),m=MODE[S.mode].k;
 if(m==='say'){
  if(auxHidden()) return cap(p)+' '+f+' '+o+'.';
  return cap(p)+' '+auxWord()+' '+f+' '+o+'.';
 }
 if(m==='ask') return cap(auxWord())+' '+p+' '+f+' '+o+'?';
 if(m==='no'){
  var a=auxNeg();
  if(a.charAt(0)==="'") return cap(p)+a+' '+f+' '+o+'.';
  return cap(p)+' '+a+' '+f+' '+o+'.';
 }
 return WH[S.wh].en+' '+auxWord()+' '+p+' '+f+'?';
}
/* 主句中文 */
function sentCN(){
 var p=PERSON[S.person].cn,v=VERB[S.verb].cn,o=OBJ[S.obj].cn,
     t=TENSE[S.tense].k,m=MODE[S.mode].k,w=WH[S.wh].cn;
 var core,tail='',md=modalOf();
 if(md){
  if(m==='say') return p+md.z+v+o;
  if(m==='ask') return p+md.q+v+o+(md.qm?'吗?':'?');
  if(m==='no')  return p+(md.w==='must'?'不用':'不'+md.z)+v+o;
  return p+md.z+v+w+'?';
 }
 if(t==='now') core=v+o;
 else if(t==='past'){core='昨天'+v+'了'+o;}
 else if(t==='fut'){core='回头'+v+o;}
 else if(t==='perf'){core='已经'+v+'过'+o+'了';}
 else if(t==='pperf'){core='早就'+v+'过'+o+'了';}
 else {core='正'+v+'着'+o;}
 if(m==='say') return p+core;
 if(m==='ask') return p+core+'吗?';
 if(m==='no'){
  if(t==='now') return p+'不'+v+o;
  if(t==='past')return p+'昨天没'+v+o;
  if(t==='fut') return p+'回头不'+v+o;
  if(t==='perf')return p+'没'+v+'过'+o;
  if(t==='pperf')return p+'那时还没'+v+'过'+o;
  return p+'没在'+v+o;
 }
 if(t==='past') return p+'昨天'+v+w+'?';
 if(t==='fut')  return p+'回头'+v+w+'?';
 if(t==='perf') return p+v+'过'+w+'了?';
 if(t==='pperf')return p+'早就'+v+'过'+w+'了?';
 if(t==='prog') return p+'正'+v+'着'+w+'?';
 return p+v+w+'?';
}

var CONN2=[{"rel": "转折", "word": "but", "zh": "但是", "tone": "口语转折的默认键", "spoken": 31133.2, "pos": "句中", "ord": "AB"}, {"rel": "因果", "word": "so", "zh": "所以", "tone": "口语因果默认键", "spoken": 26563.5, "pos": "句首/句中", "ord": "AB"}, {"rel": "条件", "word": "if", "zh": "如果", "tone": "默认键", "spoken": 23970.0, "pos": "句首", "ord": "BA"}, {"rel": "让步", "word": "anyway", "zh": "反正/不管怎样", "tone": "句尾=反正,句首=总之", "spoken": 1691.5, "pos": "句尾/句首", "ord": "AB"}, {"rel": "递进", "word": "also", "zh": "也/还", "tone": "中性", "spoken": 1737.0, "pos": "句中", "ord": "AB"}, {"rel": "对比", "word": "rather", "zh": "而是", "tone": "rather than", "spoken": 1024.5, "pos": "句中", "ord": "AB"}, {"rel": "补充", "word": "I mean", "zh": "我是说", "tone": "口语最高频补救", "spoken": 3418.2, "pos": "句首", "ord": "AB"}, {"rel": "举例", "word": "like", "zh": "比如", "tone": "口语举例(也是口头禅)", "spoken": 25517.0, "pos": "句中", "ord": "AB"}, {"rel": "总结", "word": "in the end", "zh": "到头来", "tone": "叙事收束", "spoken": 129.7, "pos": "句首", "ord": "AB"}];
/* ================= 布局 ================= */
var W=2600, H=3180, L=330, R=2270;
var Y={mode:120, packA:1900, conn:2180, packB:2450, hook:2840, out:3090};
var ROWY=[430,710,990,1270,1550];

var C={mode:'#f0a04b', tense:'#5ec8e5', person:'#9be37d', aux:'#ffd166',
       verb:'#ff8fa3', obj:'#c39bff', pack:'#8ab4ff', conn:'#f0783c', hook:'#5fe0b0'};

var RW=null;
function spread(n,i){ var l=RW?RW[0]:L, r=RW?RW[1]:R;
 if(n===1) return (l+r)/2; return l+(r-l)*i/(n-1); }

/* 当前模式的四行槽位 */
function order(){
 var m=MODE[S.mode].k, base;
 if(m==='ask')      base=['aux','person','verb','obj'];
 else if(m==='wh')  base=['wh','aux','person','verb'];
 else               base=['person','aux','verb','obj'];
 /* 时间由谁扛,就贴着谁:陈述的现在/过去藏在动词里,其余都由助动词扛 */
 var carrier = auxHidden() ? 'verb' : 'aux';
 var out=[];
 for(var i=0;i<base.length;i++){ if(base[i]===carrier) out.push('tense'); out.push(base[i]); }
 return out;
}
function rowOf(key){ var o=order(); for(var i=0;i<4;i++) if(o[i]===key) return i; return -1; }

/* 每一槽的星星列表 */
function stars(key){
 var a=[],i;
 if(key==='person'){for(i=0;i<PERSON.length;i++)a.push({en:PERSON[i].en,cn:PERSON[i].cn,on:i===S.person,i:i});}
 else if(key==='obj'){for(i=0;i<OBJ.length;i++)a.push({en:OBJ[i].en,cn:OBJ[i].cn,on:i===S.obj,i:i});}
 else if(key==='wh'){for(i=0;i<WH.length;i++)a.push({en:WH[i].en,cn:WH[i].cn,on:i===S.wh,i:i});}
 else if(key==='aux'){
  var w=(MODE[S.mode].k==='no')?auxNeg().replace(/^'/,"n'"):auxWord();
  var base=auxWord();
  for(i=0;i<AUXES.length;i++){
   var on=AUXES[i]===base;
   a.push({en:on?w:AUXES[i], cn:(on&&auxHidden())?'藏在动词里':AUXCN[AUXES[i]],
    on:on, i:i, lock:1, modal:ISMODAL[AUXES[i]]?AUXES[i]:0, ghost:on&&auxHidden()});
  }
 }
 else if(key==='verb'){
  var v=VERB[S.verb], k=verbFormKey();
  var fs=[['base',v.base,'原形·助动词后'],['s',v.s,'他/她/它'],['past',v.past,'昨天'],
          ['pp',v.pp,'配 have'],['ing',v.ing,'配 be']];
  for(i=0;i<fs.length;i++) a.push({en:fs[i][1],cn:fs[i][2],on:fs[i][0]===k,i:i,lock:1});
 }
 return a;
}

/* ================= SVG 画图 ================= */
var NS='http://www.w3.org/2000/svg';
function el(t,at){var e=document.createElementNS(NS,t);for(var k in at)e.setAttribute(k,at[k]);return e;}
var world;

function txt(x,y,s,size,fill,weight,anchor){
 return el('text',{x:x,y:y,'font-size':size,fill:fill,
  'font-weight':weight||400,'text-anchor':anchor||'middle',
  'font-family':'-apple-system,"PingFang SC",system-ui,sans-serif'});
}
function put(p,x,y,s,size,fill,weight){var t=txt(x,y,s,size,fill,weight);t.textContent=s;p.appendChild(t);return t;}

function railLine(y,label,color,rw){
 var g=el('g',{}), x1=(rw?rw[0]:L)-190, x2=(rw?rw[1]:R)+190;
 g.appendChild(el('line',{x1:x1,y1:y,x2:x2,y2:y,stroke:color,
  'stroke-width':1.2,opacity:.22}));
 var t=txt(L-215,y-26,label,20,color,600,'end');t.textContent=label;
 t.setAttribute('opacity','.75');g.appendChild(t);
 world.appendChild(g);
}

function star(x,y,r,main,sub,color,on,opt){
 opt=opt||{};
 if(opt.rid){POSMAP[opt.rid+':t']=[main,sub,r];}
 var g=el('g',{class:'node',transform:'translate('+x+','+y+')'});
 if(on&&!opt.ghost){
  g.appendChild(el('circle',{r:r+22,fill:color,opacity:.13,filter:'url(#gl)'}));
  g.appendChild(el('circle',{r:r,fill:color,opacity:.92}));
 }else{
  g.appendChild(el('circle',{r:r,fill:'#0a0e16',stroke:color,
   'stroke-width':opt.ghost?1.6:1.3,opacity:opt.ghost?.55:.42,
   'stroke-dasharray':opt.ghost?'5 5':''}));
 }
 var mc = on&&!opt.ghost ? '#06090f' : (opt.dim?'#5d6b7a':'#cfe0ee');
 var t=txt(0,(sub?-2:8),main,opt.fs||25,mc,on?700:500);t.textContent=main;g.appendChild(t);
 if(sub){var s=txt(0,20,sub,13,on&&!opt.ghost?'#0d1420':'#6f8296',500);
  s.textContent=sub;s.setAttribute('opacity',on?.85:.7);g.appendChild(s);}
 if(opt.click) g.addEventListener('click',function(e){e.stopPropagation();if(moved>6)return;opt.click();});
 world.appendChild(g);
 return g;
}

function pill(x,y,w,h,main,sub,color,click){
 var g=el('g',{class:click?'node':'',transform:'translate('+x+','+y+')'});
 g.appendChild(el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:h/2,
  fill:color,opacity:.16,filter:'url(#gl)'}));
 g.appendChild(el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:h/2,
  fill:'#070b12',stroke:color,'stroke-width':2,opacity:.95}));
 var t=txt(0,sub?-2:9,main,28,'#eaf3fb',600);t.textContent=main;g.appendChild(t);
 if(sub){var s=txt(0,26,sub,15,'#7f93a6',500);s.textContent=sub;g.appendChild(s);}
 if(click) g.addEventListener('click',function(e){e.stopPropagation();if(moved>6)return;click();});
 world.appendChild(g);
}

function curve(pts,color,wid,dash){
 if(pts.length<2) return;
 var d='M'+pts[0][0]+' '+pts[0][1];
 for(var i=1;i<pts.length;i++){
  var a=pts[i-1],b=pts[i],m=(a[1]+b[1])/2;
  d+=' C'+a[0]+' '+m+' '+b[0]+' '+m+' '+b[0]+' '+b[1];
 }
 var p=el('path',{d:d,fill:'none',stroke:color,'stroke-width':wid||3,
  'stroke-linecap':'round',opacity:.9});
 if(dash) p.setAttribute('stroke-dasharray',dash);
 p.setAttribute('filter','url(#gl)');
 world.insertBefore(p,world.firstChild);
 var p2=el('path',{d:d,fill:'none',stroke:color,'stroke-width':(wid||3)*.5,
  'stroke-linecap':'round',opacity:1});
 if(dash) p2.setAttribute('stroke-dasharray',dash);

  var x0=Math.floor((-ox)/T)-1, x1=Math.floor((w-ox)/T)+1;

  for(var gx=x0;gx<=x1;gx++)for(var gy=y0;gy<=y1;gy++){
   for(var s=0;s<Lz.n;s++){
    var px=(gx+hash(gx,gy,s*7+li))*T+ox;
    var py=(gy+hash(gx,gy,s*13+li+99))*T+oy;
    if(px<-4||px>w+4||py<-4||py>h+4) continue;
    var br=hash(gx,gy,s*31+li+7);
    ctx.globalAlpha=Lz.a*(.28+br*.72);
    ctx.fillStyle= br>.93?'#bcd8ff':(br>.82?'#ffe6c2':'#ffffff');
    ctx.beginPath();ctx.arc(px,py,Lz.r*(.5+br*.8),0,6.283);ctx.fill();
   }
  }
 }
 ctx.globalAlpha=1;
}

/* ================= 平移缩放 ================= */
var svg=document.getElementById('map'),tx=0,ty=0,k=.42,touched=false;
function apply(){
 world.setAttribute('transform','translate('+tx+','+ty+') scale('+k+')');
 drawSky();
}
function fit(){
 var m=26, top=54, bot=116;
 var w=innerWidth, h=innerHeight-top-bot;
 var bb; try{bb=world.getBBox();}catch(e){bb={x:0,y:0,width:W,height:H};}
 if(!bb.width){bb={x:0,y:0,width:W,height:H};}
 if(w<760){
  k=(w-20)/1500;
  var ax=0,ay=1e9;
  for(var i=0;i<PATH.length;i++){ ax+=PATH[i][0]; if(PATH[i][1]<ay)ay=PATH[i][1]; }
  ax = PATH.length ? ax/PATH.length : 1300;
  tx = w/2-ax*k;
  ty = top+24-(ay-140)*k;
 }else{
  k=Math.min((w-m*2)/bb.width,(h-m*2)/bb.height);
  tx=(w-bb.width*k)/2-bb.x*k;
  ty=top+(h-bb.height*k)/2-bb.y*k;
 }
 touched=false;
 apply();
}
var dragging=false,lx=0,ly=0;
svg.addEventListener('pointerdown',function(e){
 dragging=true;moved=0;lx=e.clientX;ly=e.clientY;
 svg.classList.add('drag');});
addEventListener('pointermove',function(e){
 if(!dragging)return;
 if(Object.keys(pts).length>=2)return;
 var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);
 if(moved>6)touched=true;
 tx+=dx;ty+=dy;lx=e.clientX;ly=e.clientY;apply();});
function endDrag(){ dragging=false;svg.classList.remove('drag');}
svg.addEventListener('click',function(){ if(moved<=6&&S.ring){S.ring=null;render();} });
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',function(e){
 e.preventDefault();
 var f=Math.pow(1.0016,-e.deltaY),nk=Math.max(.06,Math.min(6,k*f));
 var r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; touched=true; apply();
},{passive:false});
/* 双指捏合 */
var pts={},pd=0,pk=1;
svg.addEventListener('pointerdown',function(e){pts[e.pointerId]=e;});
svg.addEventListener('pointermove',function(e){
 if(!(e.pointerId in pts))return; pts[e.pointerId]=e;
 var ids=Object.keys(pts); if(ids.length!==2)return;
 var a=pts[ids[0]],b=pts[ids[1]];
 var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
 if(!pd){pd=d;pk=k;return;}
 var nk=Math.max(.06,Math.min(6,pk*d/pd));
 var cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;
 tx=cx-(cx-tx)*(nk/k);ty=cy-(cy-ty)*(nk/k);k=nk;touched=true;apply();});
function clr(e){delete pts[e.pointerId];pd=0;}
svg.addEventListener('pointerup',clr);svg.addEventListener('pointercancel',clr);
addEventListener('resize',function(){ if(touched)drawSky(); else fit(); });

/* ================= 启动 ================= */
function boot(){
 svg.textContent='';
 var defs=el('defs',{});
 var f=el('filter',{id:'gl',x:'-60%',y:'-60%',width:'220%',height:'220%'});
 f.appendChild(el('feGaussianBlur',{stdDeviation:'11'}));
 defs.appendChild(f);svg.appendChild(defs);
 world=el('g',{id:'world'});svg.appendChild(world);
 render(); fit();
}
addEventListener('keydown',function(e){if(e.key==='Escape'){S.ring=null;render();}});
document.getElementById('bFit').onclick=fit;
document.getElementById('bRand').onclick=function(){
 S.person=(Math.random()*PERSON.length)|0;
 S.verb=(Math.random()*VERB.length)|0;
 S.obj=(Math.random()*OBJ.length)|0;
 S.tense=(Math.random()*TENSE.length)|0;
 S.mode=(Math.random()*MODE.length)|0;
 S.ring=null;S.modal=null;
 render();};
boot();
