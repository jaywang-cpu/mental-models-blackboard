<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>免疫宇宙</title><link rel="stylesheet" href="base.css">
<style>
body{overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;
  touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
.rg-fill{opacity:.13}
.rg-ring{fill:none;stroke-width:1.2;opacity:.4;stroke-dasharray:5 7}
.rg-name{font:700 26px var(--sf);letter-spacing:.08em;text-anchor:middle;opacity:.95}
.rg-en{font:600 11px var(--sf);letter-spacing:.22em;text-anchor:middle;opacity:.5}
.rg-sub{font:400 13px var(--sf);text-anchor:middle;opacity:.42;fill:#93A4C4}
.nd{cursor:pointer}
.nd rect{fill:rgba(13,19,34,.9);stroke:rgba(126,178,255,.24);stroke-width:1;rx:14}
.nd rect.bar{stroke:none;opacity:.85;rx:3}
.nd g{pointer-events:none}
.nd:hover rect{stroke:rgba(59,232,255,.85);fill:rgba(20,32,52,.96)}
.nd.hit rect{stroke:#FFC46B;stroke-width:1.8;fill:rgba(46,36,14,.92)}
.nd.dim{opacity:.16}
.nd.ctx rect{fill:rgba(9,14,26,.72);stroke:rgba(126,178,255,.16);stroke-dasharray:5 5}
.nd.ctx{opacity:.72}
.nd.ctx .zh{fill:#B9C8E4;font-size:12.5px} .nd.ctx .en{fill:#5C6B8A}
.nd .pb{fill:rgba(139,108,255,.9);stroke:rgba(4,6,13,.9);stroke-width:1}
.nd .pbt{font:700 9px var(--sf);fill:#0b0713;text-anchor:middle}
.ctx-band{fill:rgba(126,178,255,.05);pointer-events:none}
.ctx-ring{fill:none;stroke:rgba(126,178,255,.22);stroke-dasharray:6 10;stroke-width:1.1}
.ctx-lab{font:600 12px var(--sf);fill:#7E90B4;text-anchor:middle;letter-spacing:.16em}
.nd .zh{font:600 13.5px var(--sf);fill:#E8EEFB;text-anchor:middle}
.nd .en{font:400 9.5px var(--sf);fill:#8093B4;text-anchor:middle;letter-spacing:.03em}
.ed{fill:none;stroke-width:1.1;opacity:.32}
.ed.on{opacity:.95;stroke-width:2}
.edlab{font:400 9.5px var(--sf);fill:#7d8ba6;text-anchor:middle;opacity:0}
.drill{cursor:pointer}
.drill circle{fill:rgba(59,232,255,.14);stroke:rgba(59,232,255,.55);stroke-width:1.2}
.drill:hover circle{fill:rgba(59,232,255,.3)}
.drill text{font:600 12px var(--sf);fill:#8ef4ff;text-anchor:middle}
.drill .cap{font:600 10.5px var(--sf);fill:#8ef4ff;letter-spacing:.1em;opacity:.85}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;background:linear-gradient(180deg,
  rgba(4,6,13,.92),rgba(4,6,13,.55) 70%,transparent);pointer-events:none}
#hud>*{pointer-events:auto}
#crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
#crumb b{font-size:15px;font-weight:660;color:var(--ink);letter-spacing:-.01em}
#crumb .bk{padding:5px 11px;border-radius:9px;border:.5px solid var(--hair);
  background:rgba(255,255,255,.05);font-size:12.5px}
#crumb .bk:hover{border-color:rgba(59,232,255,.45);color:var(--cy)}
#q{width:238px;flex:none}
#hud .sp{flex:1}
#lv{font-size:11px;color:var(--muted);font-family:var(--mono)}
#legend{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;
  border-radius:13px;padding:11px 13px;background:var(--panel);backdrop-filter:blur(22px);
  border:.5px solid var(--hair);font-size:11.5px;color:var(--ink2);line-height:1.9}
#legend i{display:inline-block;width:18px;height:2px;border-radius:2px;margin-right:7px;
  vertical-align:middle}
#legend .t{color:var(--muted);font-size:10.5px;letter-spacing:.1em;margin-top:7px}
#zoom{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;
  display:flex;flex-direction:column;gap:5px}
#zoom button{width:38px;height:38px;border-radius:11px;background:var(--panel);
  border:.5px solid var(--hair);color:var(--ink2);font-size:16px;backdrop-filter:blur(20px)}
#zoom button:hover{border-color:rgba(59,232,255,.45);color:var(--cy)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(468px,94vw);z-index:8;display:flex;
  flex-direction:column;background:var(--panel2);backdrop-filter:blur(30px);
  border-left:.5px solid var(--hair);transform:translateX(102%);transition:.34s var(--ease);
  box-shadow:-30px 0 80px rgba(0,0,0,.6)}
#dr.on{transform:none}
#dr .h{padding:calc(16px + env(safe-area-inset-top)) 22px 14px;border-bottom:.5px solid var(--hair)}
#dr .h h2{margin:8px 0 3px;font-size:23px;letter-spacing:-.02em}
#dr .h .en{color:var(--ink2);font-size:14px}
#dr .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;color:var(--muted);
  font-size:21px;padding:4px 8px}
#dr .b{flex:1;overflow:auto;padding:16px 22px 36px;font-size:15px;color:var(--ink2);line-height:1.7}
#dr .b b{color:var(--ink)}
#dr .lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
#dr .lk a{font-size:12.5px;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.05);
  border:.5px solid var(--hair2);color:var(--ink2);cursor:pointer}
#dr .lk a:hover{border-color:rgba(59,232,255,.45);color:var(--cy)}
#dr .fd.note{background:rgba(59,232,255,.05);border-color:rgba(59,232,255,.22);margin-top:16px}
#dr .fd.note .k{color:var(--cy)}
#dr textarea{margin-top:2px;min-height:130px;font-size:14px;line-height:1.65;
  background:rgba(0,0,0,.25);border-color:rgba(59,232,255,.2)}
#dr .fd{border-radius:13px;padding:13px 15px;margin-bottom:10px;
  background:rgba(255,255,255,.035);border:.5px solid var(--hair2)}
#dr .fd .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:680;margin-bottom:6px}
#dr .fd .v{font-size:15px;line-height:1.72;color:#C7D3E8}
#dr .fd.mp{background:rgba(255,196,107,.09);border-color:rgba(255,196,107,.3)}
#dr .fd.mp .k{color:#FFC46B}
#dr .fd.mp .v{color:#FFE3B4;font-size:16px;line-height:1.7}
#dr .fd.one{background:rgba(59,232,255,.08);border-color:rgba(59,232,255,.28)}
#dr .fd.one .k{color:var(--cy)}
#dr .fd.one .v{color:#DAF6FF;font-size:16.5px;font-weight:540;line-height:1.66}
#dr .mdp{margin:0 0 8px}
.mdp:last-child{margin-bottom:0}
.mdpre{margin:8px 0;padding:10px 12px;background:#0b1220;border:1px solid #1e2740;
  border-radius:8px;overflow-x:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#9FD8FF;white-space:pre}
.mdt{border-collapse:collapse;margin:8px 0;width:100%;font-size:12.5px}
.mdt th,.mdt td{border:1px solid #1e2740;padding:6px 9px;text-align:left;vertical-align:top}
.mdt th{background:#101a2c;color:#8ef4ff;font-weight:700;white-space:nowrap}
.mdt td:first-child{white-space:nowrap;color:#FFC46B;font-weight:700}
.fd .v code{background:#101a2c;border-radius:4px;padding:1px 5px;font-size:12px;color:#9FD8FF}
.fig3.fs{position:fixed;inset:0;z-index:9999;margin:0;border-radius:0;
  background:#04060c;display:flex;flex-direction:column}
.fig3.fs iframe{flex:1;height:auto!important;width:100%;border-radius:0}
.fig3.fs .cap{padding:10px 16px;font-size:12.5px}
.figbtn{color:var(--cy);font-size:11px;background:rgba(59,232,255,.10);
  border:1px solid rgba(59,232,255,.28);border-radius:6px;padding:2px 9px;margin-left:6px;cursor:pointer}
.figbtn:hover{background:rgba(59,232,255,.2)}
.fig3{border-radius:14px;overflow:hidden;margin-bottom:12px;
  border:.5px solid rgba(59,232,255,.28);background:#070a12}
#dr .fig3 .cap{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--cy);
  font-weight:680;padding:9px 12px 7px;background:rgba(59,232,255,.07)}
#dr .fig3 iframe{width:100%;border:0;display:block;background:#070a12}
#dr .fig{border-radius:14px;padding:12px 10px;margin-bottom:12px;
  background:rgba(0,0,0,.3);border:.5px solid var(--hair)}
#dr .fig .cap{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:680;margin:0 4px 8px}
#dr .fd.fp{background:rgba(92,232,168,.08);border-color:rgba(92,232,168,.3)}
#dr .fd.fp .k{color:#5CE8A8}
#dr .fd.fp .v{color:#C8F5E0;font-size:15.5px;line-height:1.72}
#dr .fd.trap{background:rgba(139,108,255,.09);border-color:rgba(139,108,255,.3)}
#dr .fd.trap .k{color:#B9A6FF}
/* 三级：关系网 */
.ego-c rect{fill:rgba(16,26,46,.95);stroke:rgba(59,232,255,.7);stroke-width:1.6;rx:16}
.ego-c .zh{font:700 24px var(--sf);fill:#DAF6FF;text-anchor:middle}
.ego-c .en{font:500 12px var(--sf);fill:#7FD9F0;text-anchor:middle;letter-spacing:.06em}
.ego-c .mp{font:400 12.5px var(--sf);fill:#FFD9A3;text-anchor:middle}
.ego-r{fill:none;stroke:rgba(126,178,255,.1);stroke-dasharray:3 9}
.ego-lab{font:500 9.5px var(--sf);fill:#8fa3c4;text-anchor:middle;opacity:.75}
#pl{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);z-index:7;display:none;
  flex-direction:column;background:var(--panel2);backdrop-filter:blur(30px);
  border-left:.5px solid var(--hair);box-shadow:-30px 0 80px rgba(0,0,0,.6)}
#pl.on{display:flex}
#pl .h{padding:calc(13px + env(safe-area-inset-top)) 16px 10px;border-bottom:.5px solid var(--hair)}
#pl .h .r{display:flex;align-items:center;gap:8px}
#pl .h h3{font-size:16px;font-weight:660;flex:1;letter-spacing:-.01em}
#pl .tabs{display:flex;gap:4px;margin-top:9px}
#pl .tabs button{padding:5px 11px;border-radius:8px;font-size:12px;color:var(--muted);font-weight:560}
#pl .tabs button.on{background:rgba(59,232,255,.13);color:#CFF6FF}
#pl .ls{flex:1;overflow:auto;padding:9px 12px 26px}
.pp{padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.035);
  border:.5px solid var(--hair2);margin-bottom:6px;cursor:pointer}
.pp:hover{border-color:rgba(59,232,255,.4);background:rgba(59,232,255,.06)}
.pp .t{font-size:12.6px;line-height:1.42;font-weight:540}
.pp .m{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap}
.pp .m .cy{color:var(--cy)} .pp .m .st{color:var(--am)}
.pp .m .go{margin-left:auto;color:var(--cy);opacity:0;transition:.18s}
.pp:hover .m .go{opacity:1}
.mine{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;vertical-align:1px;
  background:rgba(255,196,107,.16);color:#FFC46B;border:.5px solid rgba(255,196,107,.35);margin-right:2px}
/* 场景巡游 */
#tourbtn{padding:7px 14px;border-radius:10px;border:.5px solid rgba(59,232,255,.4);
  background:rgba(59,232,255,.13);color:#CFF6FF;font-size:13px;font-weight:580;flex:none}
#tourbtn:hover{background:rgba(59,232,255,.22)}
#tl{position:fixed;top:0;left:0;bottom:0;width:min(360px,92vw);z-index:9;display:none;
  flex-direction:column;background:var(--panel2);backdrop-filter:blur(30px);
  border-right:.5px solid var(--hair);box-shadow:30px 0 80px rgba(0,0,0,.6)}
#tl.on{display:flex}
#tl .h{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:.5px solid var(--hair);
  display:flex;align-items:center;gap:8px}
#tl .h h3{font-size:17px;font-weight:660;flex:1}
#tl .ls{flex:1;overflow:auto;padding:10px 12px 26px}
#tlscope{padding:9px 16px;border-bottom:.5px solid var(--hair2);font-size:12px;color:var(--ink2);
  display:flex;align-items:center;gap:8px;line-height:1.45}
#tlscope b{color:var(--cy);font-weight:620}
#tlscope button{margin-left:auto;flex:none;padding:4px 10px;border-radius:8px;font-size:11.5px;
  border:.5px solid var(--hair);background:rgba(255,255,255,.05);color:var(--ink2)}
#tlscope button:hover{border-color:rgba(59,232,255,.45);color:var(--cy)}
#tlcats{display:flex;gap:4px;flex-wrap:wrap;padding:9px 14px;border-bottom:.5px solid var(--hair2)}
#tlcats.off{display:none}
#tlcats button{padding:4px 10px;border-radius:8px;font-size:11.5px;color:var(--muted);font-weight:560}
#tlcats button.on{background:rgba(59,232,255,.13);color:#CFF6FF}
#tl .cat{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:680;margin:14px 4px 7px}
#tl .cat:first-child{margin-top:2px}
.tr{padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.035);
  border:.5px solid var(--hair2);margin-bottom:7px;cursor:pointer;transition:.2s var(--ease)}
.tr:hover{border-color:rgba(59,232,255,.45);background:rgba(59,232,255,.07)}
.tr .t{font-size:14px;font-weight:600;line-height:1.35}
.tr .s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.tr .n{font-size:10.5px;color:var(--cy);margin-top:6px}
.tr{position:relative}
.tr .del{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;color:var(--muted);font-size:13px;opacity:0;
  border:.5px solid transparent;transition:.18s var(--ease)}
.tr:hover .del{opacity:.8}
.tr .del:hover{opacity:1;color:#FF6B8A;background:rgba(255,107,138,.14);
  border-color:rgba(255,107,138,.4)}
.once{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:6px;margin-right:6px;
  vertical-align:1px;background:rgba(255,196,107,.16);color:#FFC46B;
  border:.5px solid rgba(255,196,107,.35)}
#qz{position:fixed;inset:0;z-index:16;display:none;background:rgba(4,6,13,.95);
  backdrop-filter:blur(14px);align-items:center;justify-content:center;flex-direction:column;gap:16px;
  padding:40px 20px}
#qz.on{display:flex}
#qz .card{width:min(760px,94vw);border-radius:18px;padding:30px 34px;background:var(--panel);
  border:.5px solid var(--hair)}
#qz .qh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:680}
#qz .q{font-size:23px;font-weight:660;line-height:1.5;margin-top:12px;letter-spacing:-.01em}
#qz .a{margin-top:18px;padding:16px 18px;border-radius:13px;font-size:15.5px;line-height:1.75;
  background:rgba(92,232,168,.08);border:.5px solid rgba(92,232,168,.3);color:#C8F5E0;display:none}
#qz .a.on{display:block}
#qz .btns{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
#qz .btns button{padding:9px 18px;border-radius:11px;font-size:13.5px;font-weight:570;
  border:.5px solid var(--hair);background:rgba(255,255,255,.06);color:var(--ink2)}
#qz .btns button.pri{background:rgba(59,232,255,.16);color:#CFF6FF;border-color:rgba(59,232,255,.4)}
#qz .sc{font-size:12px;color:var(--muted);font-family:var(--mono)}
/* 底部巡游条 */
#tb{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:11;width:min(760px,94vw);
  border-radius:16px;padding:14px 16px 12px;background:var(--panel2);backdrop-filter:blur(28px);
  border:.5px solid rgba(59,232,255,.3);box-shadow:0 24px 70px rgba(0,0,0,.6);
  transition:.36s var(--ease)}
#tb.on{transform:translateX(-50%) translateY(0)}
#tb .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#tb .top .nm{font-size:12px;color:var(--cy);font-weight:600;letter-spacing:.04em}
#tb .top .ct{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--mono)}
#tb .say{font-size:16px;line-height:1.6;color:#E8EEFB;min-height:52px}
#tb .say b{color:var(--cy)}
#tb .bar{display:flex;align-items:center;gap:7px;margin-top:11px}
#tb .btn{padding:7px 15px}
#tb .prog{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;
  margin:0 6px}
#tb .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));
  box-shadow:0 0 12px rgba(59,232,255,.5);transition:.3s var(--ease)}
.nd.spot rect{stroke:#3BE8FF;stroke-width:2.6;fill:rgba(20,44,64,.98)}
.nd.spot{filter:drop-shadow(0 0 22px rgba(59,232,255,.65))}
/* 术语表 */
#gl{position:fixed;inset:0;z-index:14;display:none;background:rgba(4,6,13,.93);
  backdrop-filter:blur(14px);flex-direction:column}
#gl.on{display:flex}
#gl .h{padding:calc(16px + env(safe-area-inset-top)) 22px 12px;border-bottom:.5px solid var(--hair);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#gl .h h3{font-size:20px;font-weight:680;letter-spacing:-.02em}
#gl .h .sub{font-size:12px;color:var(--muted)}
#gl .h .sp{flex:1}
#gl #glq{width:280px}
#glcats{display:flex;gap:5px;padding:9px 22px;flex-wrap:wrap;border-bottom:.5px solid var(--hair2)}
#glcats button{padding:5px 12px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:560;
  border:.5px solid transparent}
#glcats button.on{background:rgba(59,232,255,.13);color:#CFF6FF;border-color:rgba(59,232,255,.35)}
#glls{flex:1;overflow:auto;padding:0 0 40px}
table.gtab{width:100%;border-collapse:collapse;font-size:13.5px}
table.gtab thead th{position:sticky;top:0;z-index:2;background:#0a0f1c;
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:680;padding:10px 14px;border-bottom:.5px solid var(--hair)}
table.gtab td{padding:11px 14px;border-bottom:.5px solid var(--hair2);vertical-align:top;
  line-height:1.6}
table.gtab tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
table.gtab tbody tr:hover{background:rgba(59,232,255,.07)}
td.tm b{font-size:14.5px;font-weight:640;display:block;letter-spacing:-.01em}
td.tm i{font-style:normal;font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
td.tm .c{display:inline-block;margin-top:5px;font-size:10px;padding:1px 7px;border-radius:6px;
  background:rgba(126,178,255,.1);color:var(--ink2);border:.5px solid var(--hair2)}
td.mp{color:#FFE3B4;background:rgba(255,196,107,.05)}
td.ac{color:#C2D0E6}
td.ac b{color:#DAF6FF}
td.lk a{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;margin:0 4px 4px 0;
  background:rgba(255,255,255,.05);border:.5px solid var(--hair2);color:var(--ink2);cursor:pointer;
  white-space:nowrap}
td.lk a:hover{border-color:rgba(59,232,255,.45);color:var(--cy)}
tr.grp td{background:rgba(139,108,255,.09);font-size:11px;letter-spacing:.14em;font-weight:700;
  color:#CDB9FF;padding:7px 14px;text-transform:uppercase}
@media(max-width:900px){table.gtab td.ac{display:none}}
@media(max-width:640px){table.gtab td.lk{display:none}}
#glbtn{padding:7px 14px;border-radius:10px;border:.5px solid rgba(139,108,255,.4);
  background:rgba(139,108,255,.14);color:#CDB9FF;font-size:13px;font-weight:580;flex:none}
#glbtn:hover{background:rgba(139,108,255,.24)}
@media(max-width:760px){#glls{grid-template-columns:1fr;padding:12px 14px 40px}#gl #glq{width:100%}}
#tip{position:fixed;z-index:6;pointer-events:none;padding:8px 12px;border-radius:10px;
  background:rgba(8,12,22,.95);border:.5px solid var(--hair);font-size:13.5px;color:var(--ink2);
  opacity:0;transition:.15s;max-width:260px}
</style></head><body>
<canvas id="sky"></canvas><div id="neb"></div>
<svg id="stage"><g id="cam">
  <g id="gRg"></g><g id="gEd"></g><g id="gNd"></g><g id="gDrill"></g>
</g></svg>
<div id="hud">
  <div id="crumb"></div>
  <button id="tourbtn">▶ 场景巡游</button>

const $=i=>document.getElementById(i);
const EC={activates:'#5CE8A8',makes:'#FFC46B',presents:'#8B6CFF',kills:'#FF6B8A',

const svg=$('stage'), cam=$('cam');
let NS=[],RG=[],CN=[],LEVEL='world',V={x:0,y:0,k:.42},SEL=null,HIT=new Set();
let BACK='world', EGO=null, EGOTAB='paper', NM={}, PC={};

/* ---------- 载入 ---------- */
(async function boot(){
  NS=await API.nodes(true);
  RG=NS.filter(n=>n.type==='region');
  CN=NS.filter(n=>n.type==='concept'&&n.region&&n.xy);
  NM=Object.fromEntries(NS.map(n=>[n.id,n]));
  TOURS=NS.filter(n=>n.type==='tour');
  /* 每个概念挂了多少篇论文（含 same 桥过来的），画在节点右上角 */
  const bridge={};
  for(const n of NS) for(const l of (n.links||[]))
    if(l.rel==='same'){ (bridge[n.id] ||= []).push(l.to); (bridge[l.to] ||= []).push(n.id); }
  const direct={};
  for(const p of NS.filter(n=>n.type==='paper'))
    for(const l of (p.links||[])) if(l.rel==='about'){ (direct[l.to] ||= new Set()).add(p.id); }
  for(const id of Object.keys(NM)){
    const s0=new Set(direct[id]||[]);
    for(const t of (bridge[id]||[])) for(const q of (direct[t]||[])) s0.add(q);
    if(s0.size) PC[id]=s0.size;
  }
  goWorld(true);
})();

const kids=pid=>RG.filter(r=>r.parent===pid);
const G0=id=>RG.find(r=>r.id===id).geo;
function bboxPts(pts){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return {x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)};
}
/* 下钻时父区自己的概念不能消失，否则跨层的连线全断 —— 把它们排到外圈当锚点 */
function layoutFor(){
  if(LEVEL==='world'||LEVEL.startsWith('node:')){
    const rs=RG.filter(r=>r.level===1);
    const ns=CN.filter(n=>rs.some(r=>r.id===n.region));
    return {regions:rs,nodes:ns,pos:Object.fromEntries(ns.map(n=>[n.id,n.xy])),ctx:new Set()};
  }
  const ks=kids(LEVEL);
  const inner=CN.filter(n=>ks.some(r=>r.id===n.region));
  const own=CN.filter(n=>n.region===LEVEL);
  const pos={}; inner.forEach(n=>pos[n.id]=n.xy);
  const b=bboxPts(inner.map(n=>n.xy));
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  const CW=124, CH=100, GAP=26;
  /* 环带内径：必须把所有子区椭圆整个包在里面，卡片才不会压到子区上 */
  /* 环带贴着子区的形状走：子区横着铺开，环就是横椭圆，不浪费上下空间 */
  let RX=b.w/2+CW*0.95, RY=b.h/2+CH*1.45;
  const perim=(a,c)=>Math.PI*(3*(a+c)-Math.sqrt((3*a+c)*(a+3*c)));
  const wantLen=own.length*(CW+GAP);
  if(own.length){ let guard=0;
    while(perim(RX,RY)<wantLen && guard++<200){ RX*=1.04; RY*=1.04; } }
  /* 再确认环上任何一点都在所有子区之外 */
  for(let guard=0;guard<200;guard++){
    let clash=false;
    for(let a=0;a<Math.PI*2 && !clash;a+=Math.PI/36){
      const x=cx+Math.cos(a)*RX, y=cy+Math.sin(a)*RY;
      for(const r of ks){const g=G0(r.id);
        if(((x-g.cx)/(g.rx+CW*0.6))**2+((y-g.cy)/(g.ry+CH*0.6))**2<1){clash=true;break}}
    }
    if(!clash)break;
    RX*=1.05; RY*=1.05;
  }
  const p=RG.find(r=>r.id===LEVEL);
  const sorted=own.slice().sort((a,c)=>
    Math.atan2(a.xy[1]-p.geo.cy,a.xy[0]-p.geo.cx)-Math.atan2(c.xy[1]-p.geo.cy,c.xy[0]-p.geo.cx));
  const a0=sorted.length? Math.atan2(sorted[0].xy[1]-p.geo.cy,sorted[0].xy[0]-p.geo.cx) : 0;
  sorted.forEach((n,i)=>{
    const a=a0+(i/sorted.length)*Math.PI*2;
    pos[n.id]=[cx+Math.cos(a)*RX, cy+Math.sin(a)*RY];
  });
  /* 兜底：谁要是还压到子区椭圆或内层卡片，沿半径继续外推 */
  const hitsChild=(x,y)=>ks.some(r=>{const g=G0(r.id);
    for(const dx of [-CW/2,CW/2])for(const dy of [-CH/2,CH/2])
      if(((x+dx-g.cx)/(g.rx+8))**2+((y+dy-g.cy)/(g.ry+8))**2 < 1) return true;
    return false;});
  for(let it=0;it<120;it++){
    let fix=0;
    for(const n of sorted){
      const [x,y]=pos[n.id];
      let bad=hitsChild(x,y);
      if(!bad) for(const m of inner){
        if(Math.abs(x-pos[m.id][0])<CW+14 && Math.abs(y-pos[m.id][1])<CH+12){bad=true;break}
      }
      if(!bad) for(const m of sorted){
        if(m===n)continue;
        if(Math.abs(x-pos[m.id][0])<CW+10 && Math.abs(y-pos[m.id][1])<CH+8){bad=true;break}
      }
      if(bad){ const ang=Math.atan2((y-cy)/(RY/RX),x-cx);
        pos[n.id]=[x+Math.cos(ang)*12, y+Math.sin(ang)*12*(RY/RX)]; fix++; }
    }
    if(!fix)break;
  }
  /* 环带的内外边界，用来画那个"上一层"的圈 */
  const ratio=RY/RX;
  const rr=sorted.map(n=>Math.hypot((pos[n.id][0]-cx),(pos[n.id][1]-cy)/ratio));
  const band=sorted.length?{cx,cy,
    inRx:Math.min(...rr)-CW*0.62, inRy:(Math.min(...rr)-CW*0.62)*ratio,
    outRx:Math.max(...rr)+CW*0.62, outRy:(Math.max(...rr)+CW*0.62)*ratio}:null;
  return {regions:ks,nodes:[...inner,...own],pos,ctx:new Set(own.map(n=>n.id)),ring:band};
}
const inView=()=>{

function fit(box,pad=90){

function bbox(rs){

  const y0=Math.min(...rs.map(r=>r.geo.cy-r.geo.ry)), y1=Math.max(...rs.map(r=>r.geo.cy+r.geo.ry));
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};

let anim=null,flyTmr=null,flyDone=null;
function fly(to,ms=560,after){
  cancelAnimationFrame(anim); clearTimeout(flyTmr);
  const f={...V}, t0=performance.now(); let done=false;
  const land=()=>{ if(done)return; done=true; V={...to}; apply(); after&&after(); };
  (function step(t){
    if(done)return;
    const p=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-p,3);
    V={x:f.x+(to.x-f.x)*e, y:f.y+(to.y-f.y)*e, k:f.k+(to.k-f.k)*e};
    apply(); if(p<1) anim=requestAnimationFrame(step); else land();
  })(t0);
  /* 标签页在后台时 rAF 会被冻住，兜底直接落位 */
  flyTmr=setTimeout(land, ms+140);

const pts=new Map(); let pan=null,pinch=null,moved=0,down=null,downEl=null,captured=false,lastTap=0,lastTapId='';
svg.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,e); moved=0; downEl=e.target;   /* 先不捕获，否则 click 目标会被改成整张 svg */
  if(pts.size===2){const[a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
      cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2,...V}; pan=null; return;}
  pan={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y}; down={x:e.clientX,y:e.clientY};
  svg.classList.add('drag');
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
  if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
    const k=Math.min(4,Math.max(.12,pinch.k*d/pinch.d));
    V.x=mx-(pinch.cx-pinch.x)*(k/pinch.k); V.y=my-(pinch.cy-pinch.y)*(k/pinch.k); V.k=k;
    apply(); autoLevel(); return;}
  if(pan){ if(down) moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
    if(!captured&&moved>4){ try{svg.setPointerCapture(e.pointerId)}catch(_){}; captured=true; }
    V.x=pan.vx+e.clientX-pan.x; V.y=pan.vy+e.clientY-pan.y; apply();}
});
const up=e=>{
  const wasPan=!!pan;
  pts.delete(e.pointerId); if(pts.size<2)pinch=null;
  if(!pts.size){pan=null;captured=false;svg.classList.remove('drag')}
  if(wasPan&&moved<=9) activate(downEl,e.clientX,e.clientY);
  downEl=null;
};
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>Math.abs(e.deltaX)*2){
    const k=Math.min(4,Math.max(.12,V.k*(1-e.deltaY*.0016)));
    V.x=e.clientX-(e.clientX-V.x)*(k/V.k); V.y=e.clientY-(e.clientY-V.y)*(k/V.k); V.k=k;
  } else {V.x-=e.deltaX; V.y-=e.deltaY;}

function atPoint(x,y){

let lastAct=0;
function activate(t,x,y){

$('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  HIT=new Set(); if(!q){applyHit();return}
  for(const n of CN) if((n.title+n.en+(n.body||'')).toLowerCase().includes(q)) HIT.add(n.id);
  applyHit();
  /* 命中不在当前层时，跳到命中最多的那一层 */
  const {nodes}=inView();
  if(HIT.size&&!nodes.some(n=>HIT.has(n.id))){
    const cnt={};
    for(const id of HIT){const n=CN.find(x=>x.id===id);
      const r=RG.find(x=>x.id===n.region); const key=r.level===1?'world':r.parent;
      cnt[key]=(cnt[key]||0)+1;}
    const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
    lock=performance.now()+1400;
    best==='world'?goWorld():drillInto(best);
  }
};
function applyHit(){
  document.querySelectorAll('.nd').forEach(g=>{
    g.classList.toggle('hit',HIT.has(g.dataset.id));
    g.classList.toggle('dim',HIT.size>0&&!HIT.has(g.dataset.id));
  });
}

  let n=NM[id]; if(!n)return 'world';
  if(!n.region) n=(n.links||[]).map(l=>NM[l.to]).find(x=>x&&x.region)||n;
  if(!n.region)return 'world';

              .sort((a,b)=>b.n-a.n).map(x=>x.t);

      <div class="s">${API.esc(t.body||'')}</div>

    }).join('')).join('');
  /* 自测区，排在巡游下面 */
  const qs=NS.filter(n=>n.type==='quiz');

  $('qza').textContent=it.a; $('qza').classList.remove('on');
  $('qzsc').textContent='先自己答一遍，再点显示答案。答不上就点「去图上看这一站」。';
  $('qzgo').style.display=it.ref&&NM[it.ref]?'':'none';
  $('qzprev').disabled=QI===0;
  $('qznext').textContent=QI===QZ.items.length-1?'做完了 ✓':'下一题 →';
}
$('qzshow').onclick=()=>$('qza').classList.add('on');
$('qznext').onclick=()=>{ if(QI>=QZ.items.length-1){quizExit();return} QI++; quizStep(); };
$('qzprev').onclick=()=>{ if(QI>0){QI--; quizStep();} };
$('qzx').onclick=quizExit;
$('qzgo').onclick=()=>{ const it=QZ.items[QI]; quizExit();
  const t=NM[it.ref]; if(!t)return;
  const anchor=t.region?t:(t.links||[]).map(l=>NM[l.to]).find(x=>x&&x.region);
  if(!anchor)return openNode(t.id);
  const r=RG.find(x=>x.id===anchor.region);
  const want=r?(r.level===1?'world':r.parent):'world';
  if(want!==LEVEL){lock=performance.now()+1400; want==='world'?goWorld():drillInto(want);
    setTimeout(()=>openNode(t.id),900);} else openNode(t.id);
};
function quizExit(){ QZ=null; $('qz').classList.remove('on'); }

addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();parent.postMessage({lab:'search'},'*');return}
  if(QZ){ if(e.key==='ArrowRight'){e.preventDefault();$('qznext').click()}
          if(e.key==='ArrowLeft'){e.preventDefault();$('qzprev').click()}
          if(e.key===' '){e.preventDefault();$('qzshow').click()} }
  if(e.key==='Escape'){ if($('qz').classList.contains('on')){quizExit();return}
    if($('gl').classList.contains('on')){$('gl').classList.remove('on');return}
    if($('tl').classList.contains('on')){$('tl').classList.remove('on');return}
    if(TR){tourExit();return}
    if($('dr').classList.contains('on'))$('dr').classList.remove('on');
    else if(LEVEL.startsWith('node:')){const b=BACK; b==='world'?goWorld():drillInto(b)}
    else if(LEVEL!=='world')goWorld(); }
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
  if(TR){ if(e.key==='ArrowRight'){e.preventDefault();tourGo(1)}
          if(e.key==='ArrowLeft'){e.preventDefault();tourGo(-1)} }
});
addEventListener('resize',()=>{
  if(LEVEL.startsWith('node:'))return draw();
  const {nodes,pos}=layoutFor();
  if(nodes.length){V=fit(bboxPts(nodes.map(n=>pos[n.id])),70); apply();}
});
</script></body></html>
