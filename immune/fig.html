<meta charset="utf-8"><title>动图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#070a12;color:#E8EEFB;font:13px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none}
#w{position:relative;width:100%;height:100vh;min-height:300px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
#cap{position:absolute;left:10px;right:10px;bottom:8px;z-index:3;padding:9px 13px 11px;
  border-radius:12px;background:rgba(10,15,28,.94);border:.5px solid rgba(126,178,255,.22);
  font-size:13px;line-height:1.6}
#cap .bar{display:flex;align-items:center;gap:9px;margin-bottom:7px}
#cap .ttl{color:#8ef4ff;font-weight:660}
#cap .now{color:#E8EEFB;margin-top:3px}
#cap .now i{font-style:normal;color:#FFC46B;font-weight:650;margin-right:6px}
#cap .sub{color:#7E90B4;font-size:11.5px;margin-top:3px}
#dots{display:flex;gap:5px}
#dots i{width:24px;height:5px;border-radius:3px;background:#2b3550;display:block;cursor:pointer}
#dots i:hover{background:#4a5a7e}
#dots i.on{background:#3BE8FF}
#nav{display:flex;gap:6px;align-items:center;margin-left:auto}
#nav button{padding:5px 12px;border-radius:9px;border:.5px solid rgba(59,232,255,.35);
  background:rgba(59,232,255,.12);color:#CFF6FF;font:inherit;font-size:12.5px;font-weight:580;
  cursor:pointer}
#nav button:hover{background:rgba(59,232,255,.22)}
#nav button:disabled{opacity:.35;cursor:default;border-color:rgba(126,178,255,.2);
  background:rgba(255,255,255,.04);color:#5C6B8A}
#ncnt{font-size:11.5px;color:#7E90B4;font-family:ui-monospace,Menlo,monospace;min-width:36px;
  text-align:center}
#ctl{position:absolute;top:9px;right:10px;z-index:2;display:flex;gap:6px}
#ctl button{padding:5px 11px;border-radius:8px;border:.5px solid rgba(126,178,255,.25);
  background:rgba(10,15,28,.8);color:#93A4C4;font:inherit;font-size:11.5px;cursor:pointer}
#ctl button:hover{color:#E8EEFB}
</style>
<div id="w"><canvas id="c"></canvas>
  <div id="ctl"><button id="bl">放大镜 开</button><button id="bs">自转 开</button><button id="bh">正视</button>
    <button id="bp">暂停</button><button id="br">重放</button></div>
    <div id="cap">
    <div class="bar"><div id="dots"></div>
      <div id="nav"><button id="np">← 上一步</button><span id="ncnt"></span>
        <button id="nn">下一步 →</button></div></div>
    <div id="capbody"></div>
  </div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,DPR,t=0,playing=true;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',fit);fit();

/* ===== 调色 ===== */
const CY='#3BE8FF',AM='#FFC46B',GR='#5CE8A8',VI='#8B6CFF',RD='#FF6B8A',MUT='#93A4C4',INK='#E8EEFB';
const sh=(hex,d)=>{const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,v+d));
  return '#'+((f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).padStart(6,'0');};
const ease=p=>p<0?0:p>1?1:1-Math.pow(1-p,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ===== 画笔 ===== */
function box(cx,cy,w,h,d,fill,label,lc,fs){
  const dx=d*.62,dy=-d*.45;
  x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,Math.min(8,h/3));
  const g=x.createLinearGradient(cx-w/2,cy-h/2,cx+w/2,cy+h/2);
  g.addColorStop(0,fill);g.addColorStop(1,sh(fill,-30));x.fillStyle=g;x.fill();
  x.beginPath();x.moveTo(cx-w/2,cy-h/2);x.lineTo(cx-w/2+dx,cy-h/2+dy);
  x.lineTo(cx+w/2+dx,cy-h/2+dy);x.lineTo(cx+w/2,cy-h/2);x.closePath();x.fillStyle=sh(fill,28);x.fill();
  x.beginPath();x.moveTo(cx+w/2,cy-h/2);x.lineTo(cx+w/2+dx,cy-h/2+dy);
  x.lineTo(cx+w/2+dx,cy+h/2+dy);x.lineTo(cx+w/2,cy+h/2);x.closePath();x.fillStyle=sh(fill,-42);x.fill();
  if(label){x.fillStyle=lc||'#0b1020';x.font='700 '+(fs||11)+'px -apple-system,system-ui';
    x.textAlign='center';x.textBaseline='middle';x.fillText(label,cx,cy);}
}
function T(s,px,py,c,size,w,align){x.fillStyle=c||MUT;
  x.font=(w||500)+' '+(size||11)+'px -apple-system,system-ui';
  x.textAlign=align||'center';x.textBaseline='middle';x.fillText(s,px,py);}
function dot(px,py,r,c,glow){if(glow){x.save();x.shadowColor=c;x.shadowBlur=glow;}
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=c;x.fill();if(glow)x.restore();}
function line(x1,y1,x2,y2,c,w,a,dash){x.save();x.globalAlpha=a==null?1:a;x.strokeStyle=c;
  x.lineWidth=w||2;if(dash)x.setLineDash(dash);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);
  x.stroke();x.restore();}
function glow(x1,y1,x2,y2,c,w,a){x.save();x.globalAlpha=a==null?1:a;x.strokeStyle=c;x.lineWidth=w||2;
  x.shadowColor=c;x.shadowBlur=12;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.restore();}
function memb(cy,w,cx,flip,label){const d=14,dx=d*.62,dy=-d*.45*(flip?-1:1);
  x.beginPath();x.moveTo(cx-w/2,cy);x.lineTo(cx-w/2+dx,cy+dy);x.lineTo(cx+w/2+dx,cy+dy);
  x.lineTo(cx+w/2,cy);x.closePath();x.fillStyle='#33405e';x.fill();
  x.fillStyle='#1a2338';x.fillRect(cx-w/2,cy,w,flip?-11:11);
  if(label)T(label,cx-w/2+2,cy+(flip?-20:23),'#5C6B8A',10,600,'left');}
function cellArc(cy,label){x.beginPath();x.moveTo(20,cy);x.quadraticCurveTo(320,cy-26,620,cy);
  x.lineTo(620,cy+46);x.quadraticCurveTo(320,cy+20,20,cy+46);x.closePath();
  x.fillStyle='#2b3550';x.fill();
  if(label)T(label,320,cy+66,'#5C6B8A',10.5,600);}
function frameIcon(cx,cy,s,c,pep){x.save();x.translate(cx,cy);x.scale(s,s);
  x.fillStyle=c;x.beginPath();x.moveTo(-7,-4);x.quadraticCurveTo(0,-11,7,-4);x.lineTo(7,-1);
  x.quadraticCurveTo(0,-7,-7,-1);x.closePath();x.fill();
  x.globalAlpha=.5;x.fillRect(-2.2,-4,4.4,11);x.globalAlpha=1;
  if(pep!==false)dot(0,-9,2.6,'#DCE9FF');x.restore();}
/* 时间轴：返回 [第几步, 该步进度] */
function stage(dur){let a=0;for(let i=0;i<dur.length;i++){if(t<a+dur[i])return[i,(t-a)/dur[i]];a+=dur[i];}
  return [dur.length-1,1];}
const total=d=>d.reduce((a,b)=>a+b,0);

/* ===== 迷你 3D 引擎：可拖转 · 可缩放 · 画家算法排序 ===== */
let yaw=-0.55, pitch=-0.32, dist=760, autoSpin=true;
const CAM={fov:620};
/* 镜头平移：大图太宽，得让镜头跟着步骤走 */
let PAN=[0,0,0];
let USERPAN=[0,0,0], userCam=false;   /* 用户自己拖出来的视角，优先于场景镜头 */
function rot(p){                       /* 世界坐标 → 相机坐标 */
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const px=p[0]-PAN[0], py=p[1]-PAN[1], pz=p[2]-PAN[2];
  let X=px*cy - pz*sy, Z=px*sy + pz*cy, Y=py;
  const Y2=Y*cp - Z*sp, Z2=Y*sp + Z*cp;
  return [X,Y2,Z2+dist];
}
function proj(p){const c=rot(p);const k=CAM.fov/Math.max(60,c[2]);
  return [c[0]*k, c[1]*k, c[2], k];}
const QUE=[];                          /* 本帧要画的东西，按深度排 */
const push=(z,fn)=>QUE.push({z,fn});
function flush(){QUE.sort((a,b)=>b.z-a.z);for(const q of QUE)q.fn();QUE.length=0;}

const shade3=(hex,f)=>{const n=parseInt(hex.slice(1),16);
  const g=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return 'rgb('+g(n>>16)+','+g((n>>8)&255)+','+g(n&255)+')';};
const LIGHT=[0.4,-0.75,-0.5];
function faceShade(nrm,col){
  const c=rot([nrm[0],nrm[1],nrm[2]]), o=rot([0,0,0]);
  const v=[c[0]-o[0],c[1]-o[1],c[2]-o[2]];
  const L=Math.hypot(...v)||1;
  const d=(v[0]*LIGHT[0]+v[1]*LIGHT[1]+v[2]*LIGHT[2])/L;
  return shade3(col,0.55+0.55*Math.max(0,-d));
}
/* 长方体 */
function box3(cx,cy,cz,w,h,d,col,label,lc){
  const hx=w/2,hy=h/2,hz=d/2;
  const V=[[-hx,-hy,-hz],[hx,-hy,-hz],[hx,hy,-hz],[-hx,hy,-hz],
           [-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz]]
    .map(v=>[v[0]+cx,v[1]+cy,v[2]+cz]);
  const F=[[[0,1,2,3],[0,0,-1]],[[4,5,6,7],[0,0,1]],[[0,1,5,4],[0,-1,0]],
           [[3,2,6,7],[0,1,0]],[[0,3,7,4],[-1,0,0]],[[1,2,6,5],[1,0,0]]];
  for(const [idx,nrm] of F){
    const ps=idx.map(i=>proj(V[i]));
    const zc=ps.reduce((a,p)=>a+p[2],0)/4;
    /* 背面剔除 */
    const ax=ps[1][0]-ps[0][0], ay=ps[1][1]-ps[0][1];
    const bx=ps[2][0]-ps[1][0], by=ps[2][1]-ps[1][1];
    if(ax*by-ay*bx<=0) continue;
    const fill=faceShade(nrm,col);
    push(zc,()=>{x.beginPath();x.moveTo(ps[0][0],ps[0][1]);
      for(let i=1;i<4;i++)x.lineTo(ps[i][0],ps[i][1]);x.closePath();
      x.fillStyle=fill;x.fill();
      x.strokeStyle='rgba(0,0,0,.28)';x.lineWidth=.8;x.stroke();});
  }
  if(label){const p=proj([cx,cy,cz-hz-1]);
    push(p[2]-1,()=>{x.fillStyle=lc||'#0b1020';
      x.font='700 '+Math.max(8,12*p[3])+'px -apple-system,system-ui';
      x.textAlign='center';x.textBaseline='middle';x.fillText(label,p[0],p[1]);});}
}
/* 球 */
function ball3(cx,cy,cz,r,col,glowR){
  const p=proj([cx,cy,cz]), rr=r*p[3];
  push(p[2],()=>{
    if(glowR){x.save();x.shadowColor=col;x.shadowBlur=glowR;}
    const g=x.createRadialGradient(p[0]-rr*.35,p[1]-rr*.4,rr*.1,p[0],p[1],rr);
    g.addColorStop(0,shade3(col,1.5));g.addColorStop(1,shade3(col,.55));
    x.beginPath();x.arc(p[0],p[1],rr,0,7);x.fillStyle=g;x.fill();
    if(glowR)x.restore();});
}
/* 圆柱（用来做杆/链） */
function rod3(a,b,r,col){
  const pa=proj(a),pb=proj(b);
  push((pa[2]+pb[2])/2,()=>{
    x.strokeStyle=shade3(col,.9);x.lineWidth=Math.max(1.4,r*2*((pa[3]+pb[3])/2));
    x.lineCap='round';x.beginPath();x.moveTo(pa[0],pa[1]);x.lineTo(pb[0],pb[1]);x.stroke();});
}
/* 膜：一大块薄板 */
function slab3(cy,w,d,col,thick){
  box3(0,cy,0,w,thick||10,d,col);
}
/* 三维空间里的文字（始终面向相机） */
function lab3(px,py,pz,s,col,size,weight){
  const p=proj([px,py,pz]);
  push(p[2]-2,()=>{x.fillStyle=col||'#C7D3E8';
    x.font=(weight||600)+' '+Math.max(8,(size||12)*p[3])+'px -apple-system,system-ui';
    x.textAlign='center';x.textBaseline='middle';x.fillText(s,p[0],p[1]);});
}
/* 发光连线 */
function beam3(a,b,col,w,alpha){
  const pa=proj(a),pb=proj(b);
  push(-1e6,()=>{x.save();x.globalAlpha=alpha==null?1:alpha;
    x.strokeStyle=col;x.lineWidth=w||2;x.shadowColor=col;x.shadowBlur=12;
    x.beginPath();x.moveTo(pa[0],pa[1]);x.lineTo(pb[0],pb[1]);x.stroke();x.restore();});
}

/* 球冠状的细胞膜：让人一眼看出这是个细胞，不是一块板 */
function cellCap3(cy,R,half,col,flip,step){
  const st=step||70, sign=flip?-1:1;
  const h=(x,z)=>{const d2=x*x+z*z; const q=Math.max(0,R*R-d2);
    return cy+sign*(R-Math.sqrt(q));};
  for(let x0=-half;x0<=half;x0+=st){
    let prev=null;
    for(let z0=-half;z0<=half;z0+=st/2){
      const p=[x0,h(x0,z0),z0];
      if(prev)rod3(prev,p,2.2,col); prev=p;}}
  for(let z0=-half;z0<=half;z0+=st){
    let prev=null;
    for(let x0=-half;x0<=half;x0+=st/2){
      const p=[x0,h(x0,z0),z0];
      if(prev)rod3(prev,p,2.2,col); prev=p;}}
}
/* 角落小地图：两个细胞 + 当前视野框 */
function minimap(cx,cy,r,spot,tip){
  x.save();
  x.beginPath(); x.roundRect(cx-r*1.5,cy-r*1.9,r*3,r*3.8,12);
  x.fillStyle='rgba(6,10,18,.9)'; x.fill();
  x.strokeStyle='rgba(126,178,255,.25)'; x.lineWidth=1; x.stroke();
  x.beginPath(); x.arc(cx,cy-r*0.95,r*0.92,0,7);
  x.fillStyle='rgba(59,232,255,.16)'; x.fill();
  x.strokeStyle='rgba(59,232,255,.5)'; x.stroke();
  x.beginPath(); x.arc(cx,cy+r*0.95,r*1.02,0,7);
  x.fillStyle='rgba(196,160,255,.14)'; x.fill();
  x.strokeStyle='rgba(196,160,255,.5)'; x.stroke();
  const sx=cx+(spot?spot[0]*r:0), sy=cy+(spot?spot[1]*r:0);
  x.strokeStyle='#FFC46B'; x.lineWidth=1.6;
  x.strokeRect(sx-r*0.30,sy-r*0.30,r*0.60,r*0.60);
  x.fillStyle='#8ef4ff'; x.font='700 10px -apple-system,system-ui';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText('T 细胞',cx,cy-r*0.95);
  x.fillStyle='#C4A0FF'; x.fillText('APC',cx,cy+r*0.95);
  x.fillStyle='#FFC46B'; x.font='600 9.5px -apple-system,system-ui';
  x.fillText(tip||'你在这',sx,sy+r*0.02);
  x.restore();
}
/* ===== 可拖动的放大镜 ===== */
let LENS={x:170,y:-40,r:130,m:3.0,on:true};
/* 真放大镜：以镜心为中心，把同一幅画放大重画一遍 */
function lensDraw(drawFn,detailFn){
  if(!LENS.on)return;
  const {x:cx,y:cy,r,m}=LENS;
  x.save();
  x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();
  x.fillStyle='#05080f'; x.fillRect(cx-r,cy-r,r*2,r*2);
  x.translate(cx,cy); x.scale(m,m); x.translate(-cx,-cy);
  QUE.length=0; (detailFn||drawFn)(); flush();
  x.restore();
  /* 镜框 */
  x.save();
  x.beginPath(); x.arc(cx,cy,r,0,7);
  x.strokeStyle='rgba(59,232,255,.65)'; x.lineWidth=2.4; x.stroke();
  x.beginPath(); x.arc(cx,cy,r+5,0,7);
  x.strokeStyle='rgba(59,232,255,.18)'; x.lineWidth=1.2; x.stroke();
  /* 手柄 */
  const a=Math.PI*0.25;
  x.strokeStyle='rgba(59,232,255,.5)'; x.lineWidth=7; x.lineCap='round';
  x.beginPath(); x.moveTo(cx+Math.cos(a)*(r+4),cy+Math.sin(a)*(r+4));
  x.lineTo(cx+Math.cos(a)*(r+42),cy+Math.sin(a)*(r+42)); x.stroke();
  x.fillStyle='#3BE8FF'; x.font='700 11px -apple-system,system-ui';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(m.toFixed(1)+'×  拖我', cx, cy-r+16);
  x.restore();
}
/* 旧的固定小窗，保留给别的场景用 */
function magnifier(cx,cy,w,h,near,drawFn,title){
  x.save();
  x.beginPath(); x.roundRect(cx-w/2,cy-h/2,w,h,14); x.clip();
  x.fillStyle='rgba(6,10,18,.94)'; x.fillRect(cx-w/2,cy-h/2,w,h);
  x.translate(cx,cy+h*0.06);
  const d0=dist,y0=yaw,p0=pitch;
  dist=near; QUE.length=0; drawFn(); flush();
  dist=d0; yaw=y0; pitch=p0;
  x.restore();
  x.save();
  x.beginPath(); x.roundRect(cx-w/2,cy-h/2,w,h,14);
  x.strokeStyle='rgba(59,232,255,.45)'; x.lineWidth=1.4; x.stroke();
  x.fillStyle='#3BE8FF'; x.font='700 11px -apple-system,system-ui';
  x.textAlign='left'; x.textBaseline='middle';
  x.fillText(title||'放大镜', cx-w/2+10, cy-h/2+14);
  x.restore();
}
/* ===== 更像分子的几何：螺旋 / 折叠片 / 骨架 / 侧链 ===== */
const V3={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm(a){const l=this.len(a)||1;return this.mul(a,1/l)},
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]
};
/* α 螺旋：沿轴缠一条管 */
function helix3(p0,p1,r,turns,col,thick){
  const d=V3.sub(p1,p0), L=V3.len(d), ax=V3.norm(d);
  let up=Math.abs(ax[1])>0.9?[1,0,0]:[0,1,0];
  const u=V3.norm(V3.cross(ax,up)), v=V3.cross(ax,u);
  const N=Math.max(24,Math.round(turns*14));
  let prev=null;
  for(let i=0;i<=N;i++){
    const s=i/N, ang=s*turns*Math.PI*2;
    const c=V3.add(V3.add(p0,V3.mul(ax,L*s)),
      V3.add(V3.mul(u,Math.cos(ang)*r),V3.mul(v,Math.sin(ang)*r)));
    if(prev)rod3(prev,c,thick||3.2,col);
    prev=c;
  }
}
/* β 折叠片：几条并排的扁带 */
function sheet3(cx,cy,cz,w,d,n,col,thick){
  for(let i=0;i<n;i++){
    const z=cz-d/2+d*(i/(n-1||1));
    rod3([cx-w/2,cy,z],[cx+w/2,cy,z],thick||4.5,i%2?sh(col,-14):col);
  }
}
/* 肽骨架 + 侧链。res = [{aa,size,col,anchor}] */
function peptide3(cx,cy,cz,len,res,glowAnchor){
  const step=len/(res.length-1||1);
  let prev=null;
  res.forEach((r,i)=>{
    const px=cx-len/2+step*i;
    const py=cy+Math.sin(i*1.1)*3.5;          // 骨架微微起伏
    const p=[px,py,cz];
    if(prev)rod3(prev,p,3.4,'#9fb4d8');       // 主链
    prev=p;
    ball3(px,py,cz,3.4,'#c8d6ef');            // Cα
    const up=r.anchor?-1:1;                   // 锚定残基朝下插口袋
    const sy=py+(r.anchor?16:-13);
    rod3([px,py,cz],[px,sy,cz],2.4,r.col);
    ball3(px,sy,cz,r.size,r.col,(r.anchor&&glowAnchor)?14:0);
  });
}
/* Ig 折叠结构域：画成一个桶（两片 β 夹心） */
function igfold3(cx,cy,cz,w,h,d,col,label,lc){
  for(const dz of [-d/2,d/2])
    sheet3(cx,cy,cz+dz,w,h*0.8,4,col,3.4);
  rod3([cx-w/2,cy-h*0.42,cz-d/2],[cx-w/2,cy-h*0.42,cz+d/2],3,sh(col,-20));

/* CDR 环：一条弯曲的小环 */
function loop3(cx,cy,cz,r,col,phase,thick){
  const N=16; let prev=null;
  for(let i=0;i<=N;i++){
    const a=Math.PI*(i/N)+(phase||0);
    const p=[cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.75, cz+Math.sin(a*2)*r*0.35];
    if(prev)rod3(prev,p,thick||2.6,col);
    prev=p;
  }
}

/* 一个完整的 pMHC（真螺旋 + 折叠底板 + 肽 + 支柱） */
function pmhc3(cx,cy,cz,col,res,scale,showAnchor,pocket,noSub){
  const S=scale||1;
  helix3([cx-130*S,cy,cz-34*S],[cx+130*S,cy,cz-34*S],13*S,5.5,'#d9a24e',3.4*S);
  helix3([cx-130*S,cy,cz+34*S],[cx+130*S,cy,cz+34*S],13*S,5.5,'#c08f3f',3.4*S);
  sheet3(cx,cy+26*S,cz,262*S,64*S,7,'#8a6a33',4*S);
  if(pocket){ pocket.forEach(([px,dep])=>{
      box3(cx+px*S,cy+18*S+dep*S/2,cz,15*S,dep*S,17*S,'#6b5326'); }); }
  peptide3(cx,cy-12*S,cz,200*S,res,showAnchor);
  igfold3(cx-24*S,cy+92*S,cz,60*S,66*S,46*S,'#5C6B8A',noSub?'':'α3','#E8EEFB');
  igfold3(cx+54*S,cy+96*S,cz+6*S,46*S,52*S,40*S,'#465577',noSub?'':'β2m','#C7D3E8');
}
/* 一个完整的 TCR。约定：+y 朝下（朝 APC），所以环朝下垂、C 区在上。 */
function tcr3full(cx,cy,cz,S,D){
  /* V 区（认脸的那一头，最靠近 pMHC） */
  igfold3(cx-34*S,cy,cz,58*S,60*S,50*S,'#2f6b4f','Vα','#DCFFEE');
  igfold3(cx+34*S,cy,cz,58*S,60*S,50*S,'#33507f','Vβ','#DCE9FF');
  /* C 区在上（远离 pMHC） */
  igfold3(cx-34*S,cy-68*S,cz,58*S,62*S,50*S,'#265843','Cα','#9DFFD0');
  igfold3(cx+34*S,cy-68*S,cz,58*S,62*S,50*S,'#2a4269','Cβ','#7FA6E8');
  return CDR6.map(([nm,c,dx,dz,grp])=>{
    const lx=cx+dx*S, ly=cy+40*S, lz=cz+dz*S;
    loop3(lx,ly,lz,11*S,c,0,3.2*S);
    rod3([lx,ly-10*S,lz],[cx+dx*0.45*S,cy+24*S,cz+dz*0.45*S],1.8*S,c);
    if(D>1) lab3(lx,ly-26*S,lz,nm,c,10.5,800);
    return [nm,c,lx,ly,lz,grp];
  });
}

const MEM='#28324c', APC='#1e2a44';

/* MHC-I 分子（3D）：α1/α2 平台 + 肽 + α3 + β2m */
function mhc3(cx,cz,y,cls,pepN,hi){
  box3(cx,y-6,cz,120,14,58,'#d9a24e');                 // α1/α2 平台
  for(let i=0;i<pepN;i++){
    const px=cx-((pepN-1)/2-i)*(96/(pepN-1||1));
    const an=cls===1&&(i===1||i===pepN-1);
    ball3(px,y-16,cz,an?7:5,an?'#ffd27a':'#3BE8FF',an&&hi?14:0);}
  box3(cx-16,y+30,cz,44,52,40,'#5C6B8A',cls===1?'α3':'β2','#E8EEFB');
  if(cls===1)box3(cx+38,y+34,cz+4,36,40,34,'#465577','β2m','#C7D3E8');
  rod3([cx,y+56,cz],[cx,y+92,cz],5,'#3a4a70');
}
/* T 细胞侧：TCR + 两个 CD3 */
function tcr3(cx,cz,y,glowITAM){
  box3(cx,y,cz,66,34,52,'#33507f','TCR','#DCE9FF');
  rod3([cx-14,y+17,cz],[cx-14,y+70,cz],4,'#3a4a70');
  rod3([cx+14,y+17,cz],[cx+14,y+70,cz],4,'#3a4a70');
  [-52,52].forEach(dx=>{
    box3(cx+dx,y+34,cz,36,26,34,'#3a4a70','CD3','#C7D3E8');
    if(glowITAM)for(let j=0;j<2;j++)
      ball3(cx+dx,y+56+j*16,cz,5,'#3BE8FF',14);});
}

/* ===== 第二批 3D 场景 ===== */
function cellBall(cx,cy,cz,r,col,dead,glowR){
  ball3(cx,cy,cz,r,dead?'#3a4356':col,glowR);
  if(!dead)ball3(cx-r*.35,cy-r*.35,cz+r*.5,r*.22,'#0b1020');
}
/* 一条染色体：底杆 + 一排片段方块 */
function locus3(y,z,x0,x1,segs){
  rod3([x0-20,y,z],[x1+20,y,z],3,'#2b3550');
  segs.forEach(s=>box3(s.x,y,z,s.w,16,22,s.c,s.lab,'#0b1020'));
}

S['cdr6']={is3d:true,view:[-0.22,-0.52,760,false],
 cap:['六个环 · 两道关','握得住吗（CDR1/2 对螺旋）· 认得出吗（CDR3 对肽）'],
 steps:[

 draw(){

  lab3(0,58,0, badPEP?'换了一个肽':'肽 · 9 个氨基酸', badPEP?'#FF8FA3':'#5CE8A8',12.5,700);
  for(let i=-4;i<=4;i++) rod3([i*48,-8,-hz],[i*48,-8,hz],0.8,'#1c2438');

    const focus = (k<3)||(k===3&&grp<3)||(k===4&&grp===3)||k>=5;
    const fail  = (badHLA&&grp<3)||(badPEP&&grp===3);
    const col = fail?'#5C6B8A':(focus?base:'#26304a');
    const ly = -46 + (1-grow)*40 + (badHLA?-34:0);
    const lzz = lz*(badHLA?1.38:1);
    loop3(lx,ly,lzz,22,col,0,focus?3.4:2);
    rod3([lx,ly-4,lzz],[lx*0.62,by+34,lzz*0.62],2.2,fail?'#1e2740':col);

    if(focus&&!fail&&k>=4&&grp===3) ball3(lx,-14,0,5,base,12);

  if(k===2) lab3(0,124,0,'3 + 3 = 6 个环','#C7D3E8',13,700);
  if(k===3) lab3(0,124,0,'CDR1/2 → 落在螺旋上 · V 基因编码 · 出厂就定了','#6BA8FF',12,700);

  if(k>=5){
    const rows=[['握得住吗','CDR1/2 ←→ 两条螺旋',gripOK,C1],
                ['认得出吗','CDR3 ←→ 凹槽里的肽',seeOK,C3]];
    rows.forEach(([t,sub,ok,c],i)=>{
      const ry=-70+i*92, rx=372;
      box3(rx,ry,0,270,74,10, ok?'#12321f':'#3a1622');
      lab3(rx-96,ry-16,6,t,'#E8EEFB',13,800);
      lab3(rx-96,ry+10,6,sub,'#8FA0BE',10.5,600);
      lab3(rx+104,ry-2,6, ok?'✓':'✕', ok?'#5CE8A8':'#FF6B8A',26,800);
    });
    const pass=gripOK&&seeOK;
    lab3(372,66,0, pass?'两关都过 → 激活':'有一关没过 → 松手走人',
         pass?'#5CE8A8':'#FF6B8A',13,800);
  }

  if(k>=8){
    lab3(0,150,0,'CDR1/2：从 V 基因里选，约 45 TRAV / 48 TRBV —— 种类有限','#6BA8FF',12,700);
    lab3(0,178,0,'CDR3：现场随机拼接 —— 种类近乎无限','#FF6B8A',12,700);

 }};

S['immunomap']={is3d:true,view:[-0.30,-0.16,760,false],
 cap:['ImmunoMap · 什么是"加权序列距离"','两条只差一个字母的 CDR3，凭什么一个近一个远'],
 steps:[
  '每个字母 = 一个氨基酸的缩写。CASS 是 CDR3β 几乎人人都有的固定开头（C 来自 V 段末端，ASS 是保守 motif），后面那几位才是真正变的。三条克隆，长度一样，肉眼几乎看不出区别。',
  '对齐，逐位比。三条都只在第 5 位不同：I / L / D。',
  '朴素做法是数错配个数（Hamming）。A-B 错 1 个，A-C 也错 1 个 —— 两根柱子一样高，距离相同。这就丢信息了。',
  '看侧链：I 和 L 都是疏水的枝杈，换了几乎不改环的形状；D 带负电，把那个位置的化学性质整个换掉了。',
  '于是查替换矩阵给每一列一个罚分：I→L 罚 0.4，I→D 罚 3.2。加起来就是"加权距离"。柱子分开了。',
  '所有序列两两算完，按这个距离聚类 —— 浮现出三个 motif 簇。这就是 ImmunoMap。'],
 dur:[1.4,1.6,1.7,1.8,1.9,2.0],
 draw(){
  const [k,p]=stage(this.dur);
  const SEQ=[['C','A','S','S','I','R','S','S','Y'],
             ['C','A','S','S','L','R','S','S','Y'],
             ['C','A','S','S','D','R','S','S','Y']];
  const NAME=['克隆 A','克隆 B','克隆 C'], CC=['#3BE8FF','#5CE8A8','#FF6B8A'];
  const HYD={I:1,L:1,A:1,Y:1}, NEG={D:1,E:1}, POL={S:1,C:1}, POS={R:1,K:1};
  const rcol=r=>NEG[r]?'#6BA8FF':POS[r]?'#FF8FA3':HYD[r]?'#FFC46B':POL[r]?'#5CE8A8':'#8B6CFF';
  const DIF=4;

  if(k<5){
    /* 三条序列 */
    for(let s=0;s<3;s++){
      const ry=(s-1)*118;
      for(let i=0;i<9;i++){
        const r=SEQ[s][i], hot=(k>=1&&i===DIF);
        const dim=(k>=1&&i!==DIF);
        const c=hot?rcol(r):(dim?'#26304a':rcol(r));
        box3((i-4)*60,ry,0,50,38,40,c,r,hot?'#04060c':(dim?'#4a5670':'#04060c'));
        if(hot&&k>=3) lab3((i-4)*60,ry+40,0,
          NEG[r]?'带负电':'疏水枝杈', NEG[r]?'#6BA8FF':'#FFC46B',11,700);
      }
      lab3(-350,ry,0,NAME[s],CC[s],13,700,'left');
    }
    if(k>=1) lab3(0,-198,0,'第 5 位','#FFC46B',12.5,700);

    /* 右边两根柱子 */
    if(k>=2){
      const t=k>=4?ease(k===4?p:1):0;
      const bars=[['A · B',0,1,1,0.4,'#5CE8A8'],['A · C',1,0,2,3.2,'#FF6B8A']];
      bars.forEach(([lab,ix,_,__,w,col])=>{
        const bx=300+ix*95;
        const h=(1*(1-t)+w*t)*44;
        const c=t<.15?'#5C6B8A':col;
        box3(bx,150-h/2,0,58,h,50,c);
        lab3(bx,178,0,lab,'#C7D3E8',11.5,700);
        lab3(bx,150-h-16,0,(t<.15?'1':(w).toFixed(1)),c,13,800);
      });
      lab3(348,214,0,k>=4?'加权距离':'错配个数',k>=4?'#FFC46B':'#7E90B4',12,700);
      if(k===2) lab3(348,-176,0,'一样高 = 分不出来','#FF6B8A',11.5,700);
      if(k>=4) lab3(348,-176,0,'分开了','#5CE8A8',11.5,700);
    }
    if(k>=4) lab3(-350,206,0,'d = Σ 每一列的罚分','#FFC46B',12.5,700,'left');
  } else {
    /* 最后一步：聚类 */
    const q=ease(p);
    const cols=['#5CE8A8','#8B6CFF','#FFC46B'];
    for(let i=0;i<36;i++){
      const a=i*2.399, g=i%3, r0=170+((i*31)%70);
      const x0=Math.cos(a)*r0, y0=Math.sin(a*1.3)*70, z0=Math.sin(a)*r0;
      const cx=(g-1)*170, cy=((i*17)%60)-30, cz=((i*23)%80)-40;
      ball3(x0+(cx-x0)*q,y0+(cy-y0)*q,z0+(cz-z0)*q,8,q>.4?cols[g]:'#3BE8FF',q>.6?10:0);}
    if(q>.6)['motif 1','motif 2','motif 3'].forEach((s,i)=>
      lab3((i-1)*170,-118,0,s,cols[i],12,700));
    if(q>.8) lab3(0,168,0,'距离近的自动抱团 —— 序列不同也能聚到一起','#C7D3E8',12,650);
  }
 }};

S['bigmap']={is3d:true,lens:true,view:[-0.10,-0.13,1400,false],px:[900,620],
 /* 每一步镜头落在哪：[x, y, dist]。dist 越小越近 */

 cap:['一整条路 · 从两个细胞贴上到细胞核开工','上面是 APC，下面是 T 细胞。所有分子都在它们该在的位置'],
 steps:[
  '先看清楚这是两个细胞。上面弯的紫网是 APC 的膜，下面弯的蓝网是 T 细胞的膜。中间那条缝，接下来所有事情都发生在这条缝里，以及下面那片胞浆里。',
  '第一件事不是识别，是粘住。LFA-1（T 细胞上）抓住 ICAM-1（APC 上），像两只手先扣在一起。这不提供任何特异性 —— 它只提供时间。没有它，两个细胞擦一下就分开，根本来不及扫描。',
  '粘住之后，接触面自动分层，叫免疫突触。中心 cSMAC 是 TCR 和 CD28；外面一圈 pSMAC 是 LFA-1／ICAM-1 那道封条；最外面 dSMAC，个子最大的 CD45 被挤到这里 —— 它离 ITAM 越远，信号越攒得住。',
  '信号一 · 中心。APC 举着 pMHC，TCR 六个环压下来，红色的 CDR3 压在肽上。CD8 抓住 MHC 的 α3，顺手把 Lck 拖到现场。',
  'TCR 自己胞内尾巴只有 3 个氨基酸，喊不出去。旁边的 CD3（γε／δε／ζζ）才有长尾巴，一共 10 个 ITAM。',
  'Lck 是那把枪。Csk 磷酸化 Y505 给它上锁，CD45 拆掉那个磷酸给它开锁。默认是锁着的 —— 不然贴着 CD3 会走火。',

    if(autoSpin&&playing) yaw+=0.0035;
    PAN=USERPAN.slice();               /* 用户拖到哪就是哪，场景镜头再叠加 */
    x.save(); x.translate(W/2,H/2-14);
    /* 场景可以声明自己有多大（世界单位），大图就别被放大 */
    const fw=(sc.px&&sc.px[0])||680, fh=(sc.px&&sc.px[1])||440;
    const s=Math.min(W/fw,H/fh); x.scale(s,s);
    sc.draw(); flush(); x.restore();
  }else{
    const s=Math.min(W/660,H/420);
    x.save(); x.translate(W/2,H/2); x.scale(s,s); x.translate(-320,-210);
    sc.draw(); x.restore();
  }
  let k, now;
  if(sc.lod){ k=Math.max(0,Math.min(sc.steps.length-1,Math.round(sc.lodLevel())));
              now=sc.steps[k]; }
  else { k=stage(sc.dur)[0]; now=(sc.steps&&sc.steps[k])||sc.cap[1]; }
  const NST=sc.lod?sc.steps.length:sc.dur.length;
  document.getElementById('capbody').innerHTML=
    '<div class="ttl">'+sc.cap[0]+'</div>'+
    '<div class="now"><i>'+(k+1)+'/'+NST+'</i>'+now+'</div>'+
    (sc.steps?'<div class="sub">'+sc.cap[1]+'</div>':'');
  const arr=sc.lod?sc.steps:sc.dur;
  document.getElementById('dots').innerHTML=
    arr.map((_,i)=>'<i class="'+(i===k?'on':'')+'" title="第 '+(i+1)+' 层"></i>').join('');
  document.getElementById('np').disabled = k===0;
  document.getElementById('nn').disabled = k===arr.length-1;
  document.getElementById('ncnt').textContent=(k+1)+'/'+arr.length;
}
let last=performance.now();
(function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(playing&&sc){ t+=dt; if(t>total(sc.dur)+1.4) t=0; }
  draw(); requestAnimationFrame(loop);
})(last);

/* 拖动旋转 / 滚轮缩放 / 双指 */
let pts=new Map(),drag=null,pin=null,panDrag=null;
let lensDrag=null;
function sceneScale(){
  const fw=(sc&&sc.px&&sc.px[0])||680, fh=(sc&&sc.px&&sc.px[1])||440;
  return Math.min(W/fw,H/fh);
}
function toScene(e){
  const s=sceneScale();
  return [ (e.clientX-W/2)/s, (e.clientY-(H/2-14))/s ];
}
function inLens(e){
  if(!sc||!sc.lens||!LENS.on)return false;
  const [sx,sy]=toScene(e);
  return Math.hypot(sx-LENS.x,sy-LENS.y)<=LENS.r+8;
}
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);
  if(pts.size===2){const[a,b]=[...pts.values()];
    pin={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:dist};drag=null;lensDrag=null;return;}
  if(inLens(e)){const [sx,sy]=toScene(e);
    lensDrag={dx:LENS.x-sx,dy:LENS.y-sy}; cv.classList.add('drag'); return;}
  if(e.shiftKey||e.button===2||e.button===1){
    panDrag={x:e.clientX,y:e.clientY,p:USERPAN.slice()};
    userCam=true; cv.classList.add('drag'); return;
  }
  drag={x:e.clientX,y:e.clientY,yaw,pitch};autoSpin=false;
  document.getElementById('bs').textContent='自转 关';cv.classList.add('drag');});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
  if(panDrag){const sc2=sceneScale();
    USERPAN[0]=panDrag.p[0]-(e.clientX-panDrag.x)/sc2;
    USERPAN[1]=panDrag.p[1]-(e.clientY-panDrag.y)/sc2;
    return;}
  if(lensDrag){const [sx,sy]=toScene(e);
    LENS.x=sx+lensDrag.dx; LENS.y=sy+lensDrag.dy; return;}
  if(pin&&pts.size>=2){const[a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    dist=Math.max(120,Math.min(9000,pin.z*pin.d/d)); userCam=true; return;}
  if(drag){yaw=drag.yaw+(e.clientX-drag.x)*0.008;
    pitch=Math.max(-1.2,Math.min(1.0,drag.pitch+(e.clientY-drag.y)*0.006));}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pin=null;
  if(!pts.size){drag=null;lensDrag=null;panDrag=null;cv.classList.remove('drag');}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();
  if(inLens(e)){ LENS.m=Math.max(1.5,Math.min(9,LENS.m*(1-e.deltaY*0.0016))); return; }
  if(e.shiftKey){                       /* Shift+滚轮 = 横向平移 */
    USERPAN[0]+=e.deltaY*0.9/sceneScale(); userCam=true; return; }
  dist=Math.max(120,Math.min(9000,dist*(1+e.deltaY*0.0014))); userCam=true;},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('bl').onclick=e=>{ if(!sc||!sc.lens){e.target.textContent='此图无放大镜';return;}
  LENS.on=!LENS.on; e.target.textContent=LENS.on?'放大镜 开':'放大镜 关'; };
document.getElementById('bs').onclick=e=>{autoSpin=!autoSpin;
  e.target.textContent=autoSpin?'自转 开':'自转 关';};
document.getElementById('bh').onclick=()=>{yaw=HOME[0];pitch=HOME[1];dist=HOME[2];
  USERPAN=[0,0,0]; userCam=false;};
/* ---- 手动翻步 ---- */
function stepStart(i){let a=0;for(let j=0;j<i;j++)a+=sc.dur[j];return a+0.001;}
function gotoStep(i){
  if(!sc)return;
  if(sc.lod){ i=Math.max(0,Math.min(sc.steps.length-1,i)); dist=sc.lodDist(i); return; }
  i=Math.max(0,Math.min(sc.dur.length-1,i));
  t=stepStart(i); playing=false;
  document.getElementById('bp').textContent='继续';
}
function curStep(){ if(!sc)return 0;
  return sc.lod?Math.round(sc.lodLevel()):stage(sc.dur)[0]; }
document.getElementById('np').onclick=()=>gotoStep(curStep()-1);
document.getElementById('nn').onclick=()=>gotoStep(curStep()+1);
document.getElementById('dots').onclick=e=>{
  const i=[...e.currentTarget.children].indexOf(e.target);
  if(i>=0)gotoStep(i);};
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();gotoStep(curStep()-1);}
  if(e.key==='ArrowRight'){e.preventDefault();gotoStep(curStep()+1);}
  if(e.key===' '){e.preventDefault();document.getElementById('bp').click();}});

document.getElementById('bp').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'继续';};
document.getElementById('br').onclick=()=>{t=0;playing=true;document.getElementById('bp').textContent='暂停';};
</script>
