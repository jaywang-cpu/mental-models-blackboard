function nodeCol(n){return (n&&n.col)||((KINDS[n.k]||KINDS.idea).c)}
function drawNode(n){
  const b=nodeBox(n);
  const zf=1+.09*(n.z||0);                              /* 深度：越靠前越大 */
  const S=w2s(b.x,b.y);
  const sw=b.w*cam.z*zf, sh=b.h*cam.z*zf;
  if(S.x+sw<-80||S.x-sw>Wd+80||S.y+sh<-80||S.y-sh>Hd+80)return;
  const K=KINDS[n.k]||KINDS.idea, C=nodeCol(n);
  const isSel=sel.has(n.id), isHov=hov===n;
  const pulse=.5+.5*Math.sin(T*.0016+n.id*1.7);
  let alpha=n.cut?.26:(n.w<=1?.66:1);
  if((n.z||0)<0)alpha*=1+(n.z*.22);                     /* 压到后面：变小变暗，但还在 */
  if(FSET&&!FSET.has(n.id))alpha*=.16;                  /* 焦平面：其余全部退远 */
  if(SSET&&!SSET.has(n.id))alpha*=.18;
  if(DEAD.has(n.id))alpha*=.34;                         /* 已经和目标断开的一簇 */
  if(n.cand)alpha*=.55;                                 /* 还没定类型的候选星 */
  alpha=Math.max(.05,alpha);

  /* 有笔记：右上角一个小点 */
  if(n.note&&n.note.trim()&&cam.z>.34){
    const bx=S.x+sw/2-3, by=S.y-sh/2+3;
    ctx.save();ctx.globalAlpha=alpha*.9;
    ctx.fillStyle=`rgba(${lighten(C)},.95)`;
    ctx.shadowColor=`rgba(${C},.9)`;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(bx,by,3.1,0,6.2832);ctx.fill();
    ctx.restore();
  }

  /* 光晕 —— 所有反馈都走发光，不用一条直角线 */
  const gr=Math.max(sw,sh)*(n.k==='unknown'?1.15:.92);
  const g=ctx.createRadialGradient(S.x,S.y,0,S.x,S.y,gr);
  const ga=(n.k==='unknown'?.20:.13)*alpha*(isSel?2.3:isHov?1.7:1)
           *(n.k==='unknown'?(.75+.25*pulse):1);
  g.addColorStop(0,`rgba(${C},${ga})`);
  g.addColorStop(.55,`rgba(${C},${ga*.35})`);
  g.addColorStop(1,`rgba(${C},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(S.x,S.y,gr,0,6.2832);ctx.fill();

  /* 未知量：脉冲环 */
  if((n.k==='unknown'||n.k==='concl')&&!n.cut){
    const rings=Math.max(1,Math.min(4,n.dof||1));       /* 环数 = 自由度，欠定超定看得见 */
    for(let i=0;i<rings;i++){
      const u=((T/2600)+i/rings)%1;
      ctx.strokeStyle=`rgba(${C},${(1-u)*.32*alpha})`;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(S.x,S.y,(Math.max(sw,sh)*.5)+u*70*cam.z,0,6.2832);ctx.stroke();
    }
  }
  /* 轨迹：一圈虚线椭圆，表示"它能跑到哪儿" */
  if(n.k==='locus'&&!n.cut){
    ctx.strokeStyle=`rgba(${C},${.5*alpha})`;ctx.lineWidth=1.4;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.ellipse(S.x,S.y,sw*.78,sh*.9,0,0,6.2832);ctx.stroke();ctx.setLineDash([]);
  }
  /* 选中 / 悬停：底部一道弧，不是方框 */
  if(isSel||isHov){
    const R=Math.max(sw,sh)*.56;
    ctx.strokeStyle=`rgba(${C},${isSel?.85:.42})`;ctx.lineWidth=isSel?1.8:1.2;
    ctx.beginPath();ctx.arc(S.x,S.y,R,Math.PI*.18,Math.PI*.82);ctx.stroke();
    if(isSel){ctx.beginPath();ctx.arc(S.x,S.y,R,Math.PI*1.18,Math.PI*1.82);ctx.stroke()}
  }
  /* 悬停：边缘一圈提示"从这里可以拉线出去" */
  if(isHov&&!editing){
    /* 照着文字框描一圈：这一圈就是拉线区，和 onRim 判的完全同一块 */
    ctx.strokeStyle=`rgba(${C},${.18+.12*Math.sin(T*.005)})`;ctx.lineWidth=RIM;
    rrect(S.x-sw/2-RIM/2, S.y-sh/2-RIM/2, sw+RIM, sh+RIM, Math.min(14,(sh+RIM)/2));
    ctx.stroke();
  }
  /* 有卫星：画一圈极淡的轨道 */
  if(HOSTS.has(n.id)){
    ctx.strokeStyle=`rgba(${C},${.13*alpha})`;ctx.lineWidth=1;ctx.setLineDash([2,7]);
    ctx.beginPath();ctx.arc(S.x,S.y,ORB*cam.z,0,6.2832);ctx.stroke();ctx.setLineDash([]);
  }

  /* 条件：底下一个小方块 —— 写了式子就填实 */
  if(n.k==='cond'&&!n.cut&&cam.z>.5){
    const q=3.2*cam.z, qy=S.y+sh*.5+q*2.4;
    ctx.strokeStyle=`rgba(${C},${.55*alpha})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(S.x,qy,q,0,6.2832);ctx.stroke();
    if(n.eq&&n.eq.trim()){ctx.fillStyle=`rgba(${lighten(C)},${.85*alpha})`;
      ctx.beginPath();ctx.arc(S.x,qy,q*.62,0,6.2832);ctx.fill()}
  }
  /* 文字 */
  const zt=cam.z>1.8?1.8+(cam.z-1.8)*.25:cam.z;      /* 拉近时字号不再线性放大 */
  const fs=b.fs*zt*zf, lh=b.lh*zt*zf;
  ctx.font=`${fs}px -apple-system,"PingFang SC",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const extra=(n.ms&&n.ms.length?1:0)+(n.dof?1:0)+(n.eq?1:0);
  let y=S.y-((b.lines.length-1)*lh)/2 - extra*fs*.55;
  ctx.shadowColor=`rgba(${C},${(isSel||isHov?.85:.45)*alpha})`;
  ctx.shadowBlur=(isSel||isHov?22:12)*Math.min(1.4,cam.z);
  ctx.fillStyle=n.cut?`rgba(${C},${.42*alpha})`:`rgba(${lighten(C)},${alpha})`;
  b.lines.forEach(l=>{ctx.fillText(l,S.x,y);y+=lh});
  ctx.shadowBlur=0;
  if(n.cut){
    ctx.strokeStyle=`rgba(240,142,142,${.55*alpha})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(S.x-sw*.42,S.y);ctx.lineTo(S.x+sw*.42,S.y);ctx.stroke();
  }
  if(n.eq&&cam.z>.45){
    ctx.font=`${11*cam.z*zf}px ui-monospace,monospace`;
    ctx.fillStyle=`rgba(${lighten(C)},${.9*alpha})`;
    ctx.fillText(n.eq, S.x, y+lh*.25); y+=lh*.8;
  }
  if(n.dof&&cam.z>.45){
    ctx.font=`${10*cam.z*zf}px ui-monospace,monospace`;
    ctx.fillStyle=`rgba(${lighten(C)},${.72*alpha})`;
    ctx.fillText('⚖ 自由度 '+n.dof, S.x, y+lh*.2); y+=lh*.75;
  }
  if(n.ms&&n.ms.length&&cam.z>.45){
    ctx.font=`${10*cam.z*zf}px -apple-system,sans-serif`;
    ctx.fillStyle=`rgba(199,142,240,${.9*alpha})`;
    ctx.fillText('◈ '+n.ms.map(x=>(MI(x)||{}).zh).filter(Boolean).join(' · '), S.x, y+lh*.2);
    y+=lh*.7;
  }
  /* 语义放大：拉近到 180% 以上，星体自己吐出内部信息 */
  if(cam.z>1.8){
    const deep=[];
    if(n.utype)deep.push('类型：'+n.utype);
    if(n.reason)deep.push('引入的理由：'+n.reason);
    (n.ms||[]).forEach(id=>{const m=MI(id);if(m)deep.push('◈ '+m.zh+'：'+m.core)});
    ctx.font=`${11*cam.z*.8}px -apple-system,sans-serif`;
    ctx.fillStyle=`rgba(147,160,189,${Math.min(1,(cam.z-1.8)*2)*alpha})`;
    deep.forEach(d=>{
      wrapText(d,11*cam.z*.8,MAXW[n.w]*cam.z*1.4).forEach(l=>{
        ctx.fillText(l,S.x,y+lh*.5); y+=lh*.62;
      });
    });
  }
  /* 没连上任何东西的已知数据：一圈呼吸的虚线圆（你用到所有的已知数据了吗？） */
  if((n.k==='data'||n.k==='given')&&!n.cut&&!n.spare&&STUCK&&!LINKED.has(n.id)){
    const a=(.3+.3*Math.sin(T*.004))*alpha;
    ctx.strokeStyle=`rgba(240,142,142,${a})`;ctx.lineWidth=1.2;ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.arc(S.x,S.y,Math.max(sw,sh)*.62,0,6.2832);ctx.stroke();ctx.setLineDash([]);
  }
}

/* 共享符号但没连线 —— "你用到所有的已知数据了吗"的图形版 */
let GHOST=[],ghostDirty=true,ghostAt=0,deadAt=0;
function findGhosts(){
  const ns=N().filter(n=>!n.cut&&n.t), out=[];
  const key=n=>{
    if(n._kt===n.t&&n._k)return n._k;
    const m=[];
    (n.t.match(/[a-zA-Zα-ωΑ-Ω]/g)||[]).forEach(x=>m.push(x));   /* 只认符号，不认通用词 */
    n._kt=n.t;n._k=m;return m;
  };
  const has=new Set();E().forEach(e=>{has.add(e.a+'_'+e.b);has.add(e.b+'_'+e.a)});
  /* 出现在四颗星以上的字母太常见，当噪音丢掉 */
  const freq={};ns.forEach(n=>{new Set(key(n)).forEach(x=>freq[x]=(freq[x]||0)+1)});
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const a=ns[i],b=ns[j];
    if(has.has(a.id+'_'+b.id))continue;
    const ka=key(a),kb=key(b);
    const sh=ka.find(x=>kb.includes(x)&&freq[x]<=3);
    if(sh)out.push({a,b,k:sh});
    if(out.length>=3)return out;
  }
  return out;
}
/* 和目标断开的死枝 */
function deadSet(){
  const goal=N().find(n=>n.k==='unknown'||n.k==='concl'); if(!goal)return new Set();
  const adj={};E().forEach(e=>{(adj[e.a]=adj[e.a]||[]).push(e.b);(adj[e.b]=adj[e.b]||[]).push(e.a)});
  const seen=new Set([goal.id]),q=[goal.id];
  while(q.length){const x=q.pop();(adj[x]||[]).forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}
  const dead=new Set();
  N().forEach(n=>{if(!seen.has(n.id)&&E().some(e=>e.a===n.id||e.b===n.id))dead.add(n.id)});
  return dead;
}

/* ---- 拉远：小星并成星团，重要的保留名字 ---- */
function drawFarClusters(order){
  const cells=new Map(), keep=[];
  order.forEach(n=>{
    const S=w2s(n.x,n.y);
    if(S.x<-60||S.x>Wd+60||S.y<-60||S.y>Hd+60)return;
    if(n.w>=4){keep.push({n,S});return}
    const k=Math.round(S.x/34)+'_'+Math.round(S.y/34);
    if(!cells.has(k))cells.set(k,{x:0,y:0,c:0,top:n});
    const g=cells.get(k);g.x+=S.x;g.y+=S.y;g.c++;
    if(n.w>(g.top.w||0))g.top=n;
  });
  cells.forEach(g=>{
    const C=(KINDS[g.top.k]||KINDS.idea).c, x=g.x/g.c, y=g.y/g.c;
    const r=3+Math.min(9,g.c*2.2);
    const gd=ctx.createRadialGradient(x,y,0,x,y,r*3);
    gd.addColorStop(0,`rgba(${C},.5)`);gd.addColorStop(1,`rgba(${C},0)`);
    ctx.fillStyle=gd;ctx.beginPath();ctx.arc(x,y,r*3,0,6.2832);ctx.fill();
    ctx.fillStyle=`rgba(${lighten(C)},.9)`;
    ctx.beginPath();ctx.arc(x,y,r*.55,0,6.2832);ctx.fill();
    if(g.c>1){
      ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(${C},.85)`;ctx.fillText('×'+g.c,x,y+r*1.9);
    }
  });
  keep.forEach(({n,S})=>{
    const C=nodeCol(n);
    const gd=ctx.createRadialGradient(S.x,S.y,0,S.x,S.y,34);
    gd.addColorStop(0,`rgba(${C},.42)`);gd.addColorStop(1,`rgba(${C},0)`);
    ctx.fillStyle=gd;ctx.beginPath();ctx.arc(S.x,S.y,34,0,6.2832);ctx.fill();
    ctx.font='11px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=`rgba(${C},.8)`;ctx.shadowBlur=14;
    ctx.fillStyle=`rgba(${lighten(C)},.96)`;
    ctx.fillText(n.t.length>12?n.t.slice(0,12)+'…':n.t,S.x,S.y);
    ctx.shadowBlur=0;
  });
}

/* ---- 卫星群的星云：一团雾说明"这几颗是一伙的" ---- */
function drawHostNebula(){
  HOSTS.forEach(hid=>{
    const h=byId(hid); if(!h)return;
    const S=w2s(h.x,h.y), C=(KINDS[h.k]||KINDS.idea).c;
    const r=(ORB+90)*cam.z;
    const g=ctx.createRadialGradient(S.x,S.y,0,S.x,S.y,r);
    g.addColorStop(0,`rgba(${C},.055)`);g.addColorStop(1,`rgba(${C},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(S.x,S.y,r,0,6.2832);ctx.fill();
  });
}

/* ---- 墨迹：随手圈画，不参与任何逻辑 ---- */
function drawInk(){
  (P().ink||[]).forEach(st=>{
    if(st.length<2)return;
    ctx.strokeStyle='rgba(232,237,249,.34)';
    ctx.lineWidth=1.6*cam.z;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    st.forEach((pt,i)=>{const S=w2s(pt[0],pt[1]);i?ctx.lineTo(S.x,S.y):ctx.moveTo(S.x,S.y)});
    ctx.stroke();
  });
  if(inking&&inking.length>1){
    ctx.strokeStyle='rgba(95,201,232,.75)';ctx.lineWidth=1.8*cam.z;
    ctx.beginPath();
    inking.forEach((pt,i)=>{const S=w2s(pt[0],pt[1]);i?ctx.lineTo(S.x,S.y):ctx.moveTo(S.x,S.y)});
    ctx.stroke();
  }
}
function rrect(x,y,w,h,r){ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lighten(c){return c.map(v=>Math.min(255,Math.round(v*.45+150))).join(',')}
</script>
<script>
/* ══════════ 交互 ══════════ */
let MS={x:0,y:0}, mode='idle', dragOff=null, marq=null, spaceDown=false, panFrom=null;
let selE=new Set();
let FOCUS=false, SPOT=null, DEG={}, RELAX=false, returning=0, inking=null, inkMode=false,
    DEAD=new Set(), HOSTS=new Set(), LINKED=new Set(), FSET=null, SSET=null;
const RIM=14;      /* 星体边缘这一圈是"拉线区" */
const ORB=132;     /* 卫星轨道半径 */

/* 点到线上：把曲线采样成折线，量最近距离（屏幕坐标，阈值 10px） */
function hitEdge(sx,sy){
  let best=null,bd=10;
  for(const e of E()){
    const p=edgePts(e); if(!p)continue;
    for(let i=0;i<=14;i++){
      const q=qpt(p.A,{x:p.cx,y:p.cy},p.B,i/14);
      const d=Math.hypot(q.x-sx,q.y-sy);
      if(d<bd){bd=d;best=e}
    }
  }
  return best;
}
function zOrder(){return N().slice().sort((a,b)=>(a.z||0)-(b.z||0))}
function inFocus(n){
  if(sel.has(n.id))return true;
  return E().some(e=>(e.a===n.id&&sel.has(e.b))||(e.b===n.id&&sel.has(e.a)));
}
function touchesSpot(n){return E().some(e=>e.k===SPOT&&(e.a===n.id||e.b===n.id))}
function pushZ(d){selNodes().forEach(n=>n.z=Math.max(-3,Math.min(3,(n.z||0)+d)));save();
  toast(d>0?'拉到前面来了':'压到后面去了','越靠后越小越暗 —— 但它还在，随时能捞回来')}
function toggleFocus(){FOCUS=!FOCUS;
  toast(FOCUS?'焦平面：只剩选中的和直接连着它的':'全深度','按 \\ 切回来')}
function cycleSpot(){
  const ks=[null].concat(Object.keys(RELS));
  const i=ks.indexOf(SPOT);
  SPOT=ks[(i+1)%ks.length];
  toast(SPOT?('只看【'+RELS[SPOT].t+'】这一类关系'):'恢复全部关系',
        SPOT?'哪个条件直接碰到未知量？换一个当主角试试':'');
}
function setSpot(k){SPOT=(SPOT===k)?null:k;
  toast(SPOT?('只看【'+RELS[SPOT].t+'】这一类关系'):'恢复全部关系',
        SPOT?'哪个条件直接碰到未知量？换一个当主角试试':'')}

/* ---- 力导向"呼吸"：按住 G 让图自己长开，松手回到你手摆的位置 ---- */
function relaxStep(){
  const ns=N().filter(n=>!n.cut);
  const fx={},fy={};
  ns.forEach(a=>{fx[a.id]=0;fy[a.id]=0});
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const a=ns[i],b=ns[j];
    let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
    const rep=Math.min(2.2,46000/d2);
    fx[a.id]-=dx/d*rep;fy[a.id]-=dy/d*rep;
    fx[b.id]+=dx/d*rep;fy[b.id]+=dy/d*rep;
  }
  E().forEach(e=>{
    const a=byId(e.a),b=byId(e.b); if(!a||!b||a.cut||b.cut)return;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const f=(d-240)*.006;
    fx[a.id]+=dx/d*f;fy[a.id]+=dy/d*f;
    fx[b.id]-=dx/d*f;fy[b.id]-=dy/d*f;
  });
  const LIM=6000;
  ns.forEach(n=>{
    if(mode==='drag'&&sel.has(n.id))return;
    n.x+=Math.max(-9,Math.min(9,fx[n.id]||0));
    n.y+=Math.max(-9,Math.min(9,fy[n.id]||0));
    n.x=Math.max(-LIM,Math.min(LIM,n.x));      /* 硬边界，永远不许跑飞 */
    n.y=Math.max(-LIM,Math.min(LIM,n.y));
  });
}
function goHome(){
  let moved=false;
  N().forEach(n=>{
    if(n.hx==null)return;
    const dx=n.hx-n.x, dy=n.hy-n.y;
    if(Math.abs(dx)>.4||Math.abs(dy)>.4){n.x+=dx*.18;n.y+=dy*.18;moved=true}
    else{n.x=n.hx;n.y=n.hy}
  });
  if(!moved)returning=0;
}
/* ---- 卫星：把选中的收成第一颗的一圈轨道 ---- */
function orbit(){
  const ns=selNodes(); if(ns.length<2)return toast('选中两个以上：第一个当中心，其余变成它的卫星');
  snap();
  const h=ns[0], sats=ns.slice(1);
  const already=sats.every(n=>n.host===h.id);
  if(already){sats.forEach(n=>{n.host=null});save();return toast('散开了')}
  sats.forEach((n,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/sats.length;
    n.host=h.id; n.x=n.hx=h.x+Math.cos(a)*ORB; n.y=n.hy=h.y+Math.sin(a)*ORB;
    n.z=Math.max(-3,(h.z||0)-1);
  });
  save();toast('收成卫星了','拖动中心，整簇跟着走；再按一次 O 散开');
}

cv.addEventListener('pointermove',e=>{
  MS={x:e.clientX,y:e.clientY};
  const w=s2w(e.clientX,e.clientY);
  if(mode==='pan'&&panFrom){
    camT.x=panFrom.cx-(e.clientX-panFrom.sx)/cam.z;
    camT.y=panFrom.cy-(e.clientY-panFrom.sy)/cam.z;
    cam.x=camT.x;cam.y=camT.y;return;
  }
  if(mode==='ink'&&inking){inking.push([w.x,w.y]);return}
  if(mode==='drag'&&dragOff){
    dragOff.list.forEach(d=>{
      const n=byId(d.id);if(!n)return;
      const nx=w.x+d.dx, ny=w.y+d.dy, ddx=nx-n.x, ddy=ny-n.y;
      n.x=nx;n.y=ny;n.hx=nx;n.hy=ny;                       /* 手摆的位置 = 家 */
      N().forEach(m=>{if(m.host===n.id&&!sel.has(m.id)){   /* 卫星跟着中心走 */
        m.x+=ddx;m.y+=ddy;m.hx=m.x;m.hy=m.y}});
    });
    save();return;
  }
  if(mode==='marq'&&marq){marq.x1=e.clientX;marq.y1=e.clientY;return}
  if(mode==='link'){const t=hit(w.x,w.y);linkTo=(t&&t.id!==linkFrom.id)?t:null;hov=linkTo;
    cv.style.cursor='crosshair';return}
  plusHot=!!hitPlus(e.clientX,e.clientY);
  hov=plusHot?hov:hit(w.x,w.y);
  cv.style.cursor= inkMode?'crosshair' : (hov? (onRim(hov,w)?'crosshair':'grab')
                 : (spaceDown?'grabbing':'default'));
});

let MS0={x:0,y:0};
cv.addEventListener('pointerdown',e=>{
  MS0={x:e.clientX,y:e.clientY};
  if(e.button===2)return;
  if(e.button===1||spaceDown||e.altKey){
    hideRing();
    mode='pan';panFrom={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};
    cv.setPointerCapture(e.pointerId);return;
  }
  const pn=hitPlus(e.clientX,e.clientY);          /* ＋ 优先 */
  if(pn){hideRing();growChild(pn);return}
  const w=s2w(e.clientX,e.clientY), n=hit(w.x,w.y);
  hideRing();
  if(!N().length&&Math.hypot(e.clientX-Wd/2,e.clientY-Hd/2)<150&&!inkMode){
    const m=addNode('',P().mode2==='prove'?'concl':'unknown',w.x,w.y,{w:5,dof:1});
    sel.clear();sel.add(m.id);startEdit(m);
    setTimeout(()=>teach('目标立住了。接下来：双击空白 = 再来一颗；从星体边缘拖出去 = 拉一条线',
      '拉出去松在空白处，会直接长出一颗连好的新星'),900);
    return;
  }
  if(inkMode){mode='ink';inking=[[w.x,w.y]];cv.setPointerCapture(e.pointerId);return}
  if(mode==='link'){                     /* 已经在连线：点谁就连谁 */
    if(n&&n.id!==linkFrom.id)makeEdge(linkFrom.id,n.id,pendingRel||'bind');
    linkFrom=null;linkTo=null;pendingRel=null;mode='idle';return;
  }
  if(n&&onRim(n,w)&&!e.shiftKey){        /* 从星体边缘直接拖出一条线 —— 一个手势 */
    linkFrom=n;linkTo=null;pendingRel=pendingRel||'bind';mode='link';
    cv.setPointerCapture(e.pointerId);return;
  }
  if(n){
    if(e.shiftKey){sel.has(n.id)?sel.delete(n.id):sel.add(n.id)}
    else if(!sel.has(n.id)){sel.clear();sel.add(n.id)}
    mode='drag';
    dragOff={list:[...sel].map(id=>{const m=byId(id);return{id,dx:m.x-w.x,dy:m.y-w.y}})};
    cv.setPointerCapture(e.pointerId);
  }else{
    const ed=hitEdge(e.clientX,e.clientY);
    if(ed){                                   /* 点到了一条线 */
      if(!e.shiftKey){sel.clear();selE.clear()}
      selE.has(ed.id)?selE.delete(ed.id):selE.add(ed.id);
      diag();return;
    }
    if(!e.shiftKey){sel.clear();selE.clear()}
    mode='marq';marq={x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};
    cv.setPointerCapture(e.pointerId);
  }
  diag();
});

cv.addEventListener('pointerup',e=>{
  if(mode==='ink'){
    if(inking&&inking.length>2){P().ink=P().ink||[];P().ink.push(inking);save()}
    inking=null;mode='idle';return;
  }
  if(mode==='link'&&linkFrom){
    const w=s2w(e.clientX,e.clientY), t=hit(w.x,w.y);
    if(t&&t.id!==linkFrom.id){makeEdge(linkFrom.id,t.id,pendingRel||'bind');linkFrom=null;pendingRel=null;mode='idle';return}
    if(!t&&Math.hypot(e.clientX-MS0.x,e.clientY-MS0.y)>26){   /* 松在空白 = 顺着关系往外长一颗 */
      const m=addNode('',curKind==='unknown'?'idea':curKind,w.x,w.y);
      makeEdge(linkFrom.id,m.id,pendingRel||'bind');
      linkFrom=null;pendingRel=null;mode='idle';sel.clear();sel.add(m.id);startEdit(m);return;
    }
    toast('还在连线中 —— 点一个目标完成，Esc 取消','从边缘拖到另一颗星上松手最快');
    return;
  }
  if(mode==='marq'&&marq){
    const a=s2w(Math.min(marq.x0,marq.x1),Math.min(marq.y0,marq.y1));
    const b=s2w(Math.max(marq.x0,marq.x1),Math.max(marq.y0,marq.y1));
    if(Math.abs(marq.x1-marq.x0)>4||Math.abs(marq.y1-marq.y0)>4)
      N().forEach(n=>{const r=nodeBox(n);
        if(r.x+r.w/2>a.x&&r.x-r.w/2<b.x&&r.y+r.h/2>a.y&&r.y-r.h/2<b.y)sel.add(n.id)});
    marq=null;
  }
  if(mode==='drag')save();
  if(mode!=='link')mode='idle';
  diag();
});

cv.addEventListener('dblclick',e=>{
  const w=s2w(e.clientX,e.clientY), n=hit(w.x,w.y);
  if(n)startEdit(n);
  else{
    const k=N().length===0?(P().mode2==='prove'?'concl':'unknown'):curKind;
    const m=addNode('',k,w.x,w.y);sel.clear();sel.add(m.id);startEdit(m);
  }
});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const w=s2w(e.clientX,e.clientY), n=hit(w.x,w.y);
  if(n){if(!sel.has(n.id)){sel.clear();sel.add(n.id)}}else sel.clear();
  showRing(e.clientX,e.clientY);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const unit=e.deltaMode===1?16:(e.deltaMode===2?innerHeight:1);
  if(e.ctrlKey||e.metaKey){                 /* 触控板捏合 / ⌘+滚轮 = 缩放 */
    zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*unit*0.0022));
  }else{                                    /* 其余一律平移 —— 在宇宙里漂 */
    const dx=(e.shiftKey?e.deltaY:e.deltaX)*unit, dy=(e.shiftKey?0:e.deltaY)*unit;
    cam.x+=dx/cam.z; cam.y+=dy/cam.z; camT.x=cam.x; camT.y=cam.y;
  }
},{passive:false});

/* ---------- 就地编辑 ---------- */
const ED=document.getElementById('edit');
let editing=null;
function startEdit(n){
  editing=n;
  const b=nodeBox(n),S=w2s(n.x,n.y);
  ED.value=n.t;
  ED.style.width=Math.max(160,b.w*cam.z)+'px';
  ED.style.height=Math.max(44,b.h*cam.z)+'px';
  ED.style.left=(S.x-Math.max(160,b.w*cam.z)/2)+'px';
  ED.style.top=(S.y-Math.max(44,b.h*cam.z)/2)+'px';
  ED.style.fontSize=Math.max(12,Math.min(22,FS[n.w]*cam.z))+'px';
  ED.classList.add('on');ED.focus();ED.select();
}
function endEdit(keep){
  if(!editing)return;
  if(keep===false&&!editing.t){removeNode(editing.id)}
  if(keep!==false){
    const v=ED.value.trim();
    if(v)editing.t=v;
    else if(!editing.t){removeNode(editing.id)}
  }
  editing=null;ED.classList.remove('on');ghostDirty=true;save();diag();cv.focus();
}
ED.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();endEdit(true)}
  if(e.key==='Escape'){e.preventDefault();endEdit(false)}
});
ED.addEventListener('blur',()=>endEdit(true));

/* ---------- 节点 / 连线 ---------- */
let curKind='cond', pendingRel=null;
function addNode(t,k,x,y,extra){
  const n=Object.assign({id:P().seq++,t:t||'',k:k||'idea',w:k==='unknown'?4:3,
    x:x,y:y,hx:x,hy:y,z:0,cut:false,ms:[]},extra||{});
  N().push(n);
  if(!(extra&&extra.noNudge))nudge(n);      /* 别落在别人身上 */
  mutated();save();return n;
}
function makeEdge(a,b,k,label){
  if(a===b)return;
  if(E().some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return;
  E().push({id:P().seq++,a,b,k:k||'bind',label:label||''});mutated();save();diag();sigDirty=true;
}
function startLink(rel){
  const s=selNodes(); if(!s.length){toast('先选一个星体');return}
  linkFrom=s[0];pendingRel=rel||'bind';mode='link';
  toast('从「'+linkFrom.t+'」拉一条【'+(RELS[pendingRel].t)+'】线 —— 点另一个星体完成，Esc 取消');
}
function delSel(){
  if(!sel.size&&!selE.size)return;
  snap();
  [...selE].forEach(id=>{const i=E().findIndex(x=>x.id===id);if(i>=0)E().splice(i,1)});
  selE.clear();
  [...sel].forEach(removeNode); sel.clear();
  ghostDirty=true; save(); diag();
}
function removeNode(id){
  const i=N().findIndex(n=>n.id===id); if(i>=0)N().splice(i,1);
  for(let j=E().length-1;j>=0;j--)if(E()[j].a===id||E()[j].b===id)E().splice(j,1);
  sel.delete(id); boxCache.delete(id); ghostDirty=true;
  if(linkFrom&&linkFrom.id===id){linkFrom=null;linkTo=null;if(mode==='link')mode='idle'}
  if(dragOff)dragOff.list=dragOff.list.filter(d=>d.id!==id);
}
function rimW(){return RIM/Math.max(.25,cam.z)}   /* 屏幕上恒定 14px，换算回世界坐标 */
function onRim(n,w){
  /* 文字框以内 = 拖动；框外那一圈（就是画出来的那个提示环）= 拉线 */
  const b=nodeBox(n), zf=1+.09*(n.z||0);
  const dx=Math.abs(w.x-b.x)/(b.w*zf/2), dy=Math.abs(w.y-b.y)/(b.h*zf/2);
  return Math.max(dx,dy)>1;
}
function selNodes(){return [...sel].map(byId).filter(Boolean)}
function around(n,i,tot,r){const a=-Math.PI/2+i*2*Math.PI/Math.max(1,tot);
  return{x:n.x+Math.cos(a)*r, y:n.y+Math.sin(a)*r}}
</script>
<script>
/* ══════════ 波利亚动作 —— 每一条都对应书里的原文 ══════════ */

/* ⑥ 只保留条件的一部分：砍 */
function cutSel(){
  const ns=selNodes(); if(!ns.length)return toast('先选中要砍的条件');
  snap();
  ns.forEach(n=>{
    n.cut=!n.cut;
    if(n.cut){
      /* 它约束的未知量自由度回升 —— 未知量被松开了 */
      E().filter(e=>e.k==='bind'&&(e.a===n.id||e.b===n.id)).forEach(e=>{
        const other=byId(e.a===n.id?e.b:e.a);
        if(other&&other.k==='unknown')other.loose=(other.loose||0)+1;
      });
    }else{
      E().filter(e=>e.k==='bind'&&(e.a===n.id||e.b===n.id)).forEach(e=>{
        const other=byId(e.a===n.id?e.b:e.a);
        if(other&&other.loose)other.loose--;
      });
    }
  });
  save();diag();
  const loose=N().find(n=>n.k==='unknown'&&n.loose>0);
  if(loose&&ns.some(n=>n.cut)){
    /* 分解和重组 7：只保留一部分条件，我们事实上"建立了一个新的题目" */
    const nw=addNode('弱化后的新题目：只剩下的那部分条件，把未知量限制成什么？',
      'aux',loose.x+330,loose.y-180,{w:3});
    makeEdge(nw.id,loose.id,'reduce','弱化');
    toast('你刚刚建立了一道新的题目。','按 T 把未知量的活动范围（轨迹）画出来；两条轨迹的交点就是答案');
  }
}
/* ⑥ 轨迹：未知量被松开后能跑到哪儿去 */
function makeLocus(){
  const ns=selNodes().filter(n=>n.k==='unknown');
  const tgt=ns[0]||N().find(n=>n.k==='unknown');
  if(!tgt)return toast('先要有一个未知量');
  const l=addNode('轨迹：它能跑到…','locus',tgt.x+230,tgt.y+120);
  l.k='locus';
  makeEdge(l.id,tgt.id,'locusof','它只能落在这条线上');
  startEdit(l);
  toast('写下：只剩下的那部分条件，把未知量限制在什么范围里？（一条直线？一段圆弧？）');
}
/* ④ 将条件的不同部分分开 */
function splitSel(){
  const ns=selNodes(); if(!ns.length)return toast('先选中一个条件');
  snap();
  let first=null;
  ns.forEach(n=>{
    const a=addNode('第一部分：'+(n.t.slice(0,10)||'…'),n.k,n.x-140,n.y+150);
    const b=addNode('第二部分：'+(n.t.slice(0,10)||'…'),n.k,n.x+140,n.y+150);
    a.w=b.w=Math.max(1,n.w-1);
    makeEdge(n.id,a.id,'part','第一部分');
    makeEdge(n.id,b.id,'part','第二部分');
    n.w=Math.max(1,n.w-1);
    first=first||a;
  });
  ensureNoOverlap();save();
  if(first){sel.clear();sel.add(first.id);startEdit(first)}
  toast('条件的不同部分分开了。分别研究每一部分本身。（分解和重组 2）');
}
/* ⑦ 重组成一道辅助题目 */
function recombine(){
  const ns=selNodes(); if(ns.length<2)return toast('选中两个以上元素再重组');
  snap();
  const cx=ns.reduce((s,n)=>s+n.x,0)/ns.length, cy=ns.reduce((s,n)=>s+n.y,0)/ns.length;
  const a=addNode('辅助题目：…','aux',cx,cy-260); a.w=4;
  ns.forEach(n=>makeEdge(n.id,a.id,'imply'));
  ensureNoOverlap();save();
  startEdit(a);
  toast('新的辅助题目。它必须比原题更容易入手 —— 不然就白造了。（分解和重组 3）');
}
/* ⑦ 踏脚石：在已知和未知之间造桥 */
function bridge(){
  const ns=selNodes();
  const u=ns.find(n=>n.k==='unknown')||N().find(n=>n.k==='unknown');
  const d=ns.find(n=>n.k==='data')||N().find(n=>n.k==='data');
  if(!u||!d)return toast('需要一个未知量和一个已知数据');
  const s=addNode('踏脚石：…','aux',(u.x+d.x)/2,(u.y+d.y)/2-140);
  makeEdge(d.id,s.id,'reduce','容易着手？');
  makeEdge(s.id,u.id,'reduce','有用？');
  startEdit(s);
  toast('两件事我们都想要：容易着手、而且有用 —— 但现实中常常只能得其一。',
    '分解和重组 5：也有理由去试一个与原未知量关系密切的新未知量，即使它初看起来并不容易着手');
}
/* ⑤ 倒着干 / 帕普斯分析 */
function backwards(){
  /* 从选中的那颗继续往回退 —— 连按 W 就是一条分析链（帕普斯：从前提过渡到前提） */
  const seed=selNodes()[0]||N().find(n=>n.k==='unknown');
  if(!seed)return toast('先要有一个目标 —— 倒着干必须从"要求的东西"出发');
  const chain=E().filter(e=>e.k==='back').length;
  const b=addNode('再往前一步：从什么状态可以得到它？','idea',seed.x-300,seed.y+70+chain*30);
  const e=makeEdgeR(seed.id,b.id,'back','从什么前提？');
  sel.clear();sel.add(b.id);
  const go=()=>startEdit(b);
  openList('这一步的推导可逆吗？（辅助题目 6：可逆约简 / 单向约简）',[
    {nm:'可逆 —— 由它成立就能倒推回目标',de:'最安全：分析完可以原路综合回去',
     run:()=>{if(e){e.label='可逆';e.rev=1;save()}go()}},
    {nm:'单向 · 条件变窄了',de:'过渡到更狭窄的条件，会丢掉某些解（辅助题目 7）',
     run:()=>{if(e){e.label='单向·更窄';e.rk='narrow';save();diag()}go()}},
    {nm:'单向 · 条件变宽了',de:'过渡到更宽松的条件，会得出多余的、不正确的解（辅助题目 7）',
     run:()=>{if(e){e.label='单向·更宽';e.rk='wide';save();diag()}go()}},
    {nm:'先不管',de:'',run:go}
  ]);
  toast('假设要求的东西已经找到了。从前面的什么情况可以得出它？',
    '帕普斯：从前提过渡到前提，直到最后遇到某些已知的或公认正确的东西');
}
/* makeEdge 的返回版本 */
function makeEdgeR(a,b,k,label){
  if(a===b)return null;
  if(E().some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return null;
  const e={id:P().seq++,a,b,k:k||'bind',label:label||''};
  E().push(e);save();diag();return e;
}
/* 综合：把分析链原路翻回去执行（帕普斯：从我们在分析中最后到达的点开始） */
function synthesize(){
  const backs=E().filter(e=>e.k==='back');
  if(!backs.length)return toast('还没有倒推链','先按 W 从目标往回退几步');
  snap();
  const bad=backs.filter(e=>!e.rev);
  backs.forEach(e=>{const t=e.a;e.a=e.b;e.b=t;e.k='imply';e.label='综合';});
  save();diag();
  toast('分析链已经翻成综合链 —— 现在从已知那一头往回走一遍',
    bad.length?('注意：其中 '+bad.length+' 步没标可逆，翻过来不一定成立（帕普斯评注 7）'):'每一步都标了可逆，翻过来是安全的');
}
/* ⑤ 类比：降维或升维，造一个更简单的平行题 */
function analogy(){
  const ns=selNodes(); if(!ns.length)return toast('选中要类比的部分（可多选整题）');
  snap();
  const dy=-460;
  const map={};
  ns.forEach(n=>{
    const c=addNode(n.t,n.k,n.x,n.y+dy,{w:n.w,dof:n.dof});
    map[n.id]=c.id;
    makeEdge(n.id,c.id,'analog','类比');
  });
  E().slice().forEach(e=>{if(map[e.a]&&map[e.b])makeEdge(map[e.a],map[e.b],e.k,e.label)});
  ensureNoOverlap();save();
  /* 类比 3 的要害：两个题目也许比一个更容易 —— 假如能把它们巧妙地联系起来 */
  const anchor=ns.find(n=>n.k==='unknown')||ns[0];
  const link=addNode('怎么把这两道题联系起来？','aux',anchor.x+280,anchor.y+dy/2,{w:3});
  makeEdge(map[anchor.id],link.id,'reduce','用它的…');
  makeEdge(link.id,anchor.id,'reduce','…来解原题');
  sel=new Set(Object.values(map));
  openList('打算怎么用这道类比题？（类比 7）',[
    {nm:'用它的方法 —— 逐点模仿它的解法',de:'像四面体重心那样，把三角形的解法一步步搬过来',
     run:()=>{link.t='用它的【方法】：逐点模仿它的解法';save()}},
    {nm:'用它的结果 —— 不管它怎么来的',de:'直接把它的结论当成已知拿来用',
     run:()=>{link.t='用它的【结果】：把它的结论当已知用';save()}},
    {nm:'两个都用',de:'有时可以既用方法又用结果',run:()=>{link.t='方法和结果都用';save()}},
  ]);
  toast('降一维试试：四面体→三角形→线段，长方体→长方形。','两个题目也许比一个更容易 —— 假如能把这两个题目巧妙地联系起来的话');
}
/* ⑤ 变化题目：把一个已知量推到极端 */
function limitCase(){
  const ns=selNodes(); const d=ns[0]||N().find(n=>n.k==='data');
  if(!d)return toast('选一个已知量，把它推到极端');
  const a=addNode('它→0 时，题目退化成…','idea',d.x-170,d.y+220),
        b=addNode('它→最大时，题目退化成…','idea',d.x+170,d.y+220);
  makeEdge(d.id,a.id,'part','→ 0 会怎样？');
  makeEdge(d.id,b.id,'part','→ 最大会怎样？');
  a.predict=1;b.predict=1;
  startEdit(a);
  toast('让它连续变到端点：梯形 c→0 变三角形，c→a 变平行四边形。退化后的题目往往你早就会解。（变化题目 5）');
}
/* 特殊化 / 普遍化 */
function specialize(){
  const n=selNodes()[0]; if(!n)return toast('先选一个');
  const s=addNode('特例：…','idea',n.x+260,n.y+170);
  makeEdge(n.id,s.id,'part','特例');
  openList('这个特例拿来干什么？（特殊化 2 / 5）',[
    {nm:'当反例用 —— 一旦不符，整条一般命题就被推翻',
     de:'一个例外就足以无可争辩地驳倒任何自称的规则；极端情况最容易被命题的创造者忽略',
     run:()=>{s.t='反例候选：…';startEdit(s);
       toast('先挑最极端的那个试（顶角→0°、→180°、鲸鱼）','预期中的例外能检验规则')}},
    {nm:'当垫脚石用 —— 先解特例，再回到原题',
     de:'但必须补上一个"补充性说明"，才能从特例过渡回原题',
     run:()=>{
       const add=addNode('补充性说明：靠什么从特例回到原题？','aux',n.x+300,n.y+330,{w:3});
       makeEdge(s.id,add.id,'reduce');makeEdge(add.id,n.id,'reduce','→ 回到原题');
       startEdit(s);

  ]);
}
async function generalize(){
  const n=selNodes()[0]; if(!n)return toast('先选一个');
  const prop=await ask('这次普遍化，剖析出了原题的哪一条性质？\n'+
    '（波利亚：解第一道题的主要成绩，就是创建了第二道题 —— 因为我们剖析出了"它有对称中心"）\n'+
    '答不上来的普遍化，往往只是自负，不是洞察。','');
  if(prop===null)return;
  const s=addNode('更普遍：…','idea',n.x-260,n.y-170,{reason:prop.trim()});
  makeEdge(s.id,n.id,'imply','更普遍');
  startEdit(s);
  toast(prop.trim()?('剖析出的性质：'+prop.trim()):'先留着，但这条性质迟早得说出来',
    '越普遍的题目可能越容易解 —— 前提是这次普遍化基于洞察，而不是自负（创造者悖论）');
}
/* 辅助元素必须有理由 */
async function auxReason(){

    '1 为了用上某道已解过的题\n'+
    '2 回到定义上去\n'+
    '3 说不清楚，只是觉得它会让题目更完整、更有启发性、更眼熟 —— 这也是正当理由',n.reason||'');
  if(r===null)return; n.reason=r.trim(); save();
  toast(n.reason?'理由记下了':'先留着，但记得补一个理由',
    '波利亚：我们可能有这样那样的理由，但总得有理由 —— 不能随心所欲地引入');
}
/* 未知量类型 → 波利亚给的现成方案 */
function unknownType(){

/* ══════════ 页内弹窗：替代被 webview 禁用的 prompt / confirm ══════════ */

/* 检验论证（你能检验这个结果吗 3、4）：避免单纯重复，必须改变次序，且薄弱点优先 */
function checkArgument(){
  const steps=N().filter(n=>!n.cut&&E().some(e=>e.k==='imply'&&(e.a===n.id||e.b===n.id)));
  if(!steps.length)return toast('还没有推导步骤','先用【推出】把步骤连起来');
  const shuffled=steps.slice().sort((a,b)=>(b.weak?1:0)-(a.weak?1:0)||((a.id*7919)%97)-((b.id*7919)%97));
  openList('逐条检验（薄弱优先，次序已打乱 —— 不许按原顺序重放）',
   shuffled.map(n=>({nm:(n.weak?'⚠ ':'')+(n.ok?'✔ ':'')+n.t.slice(0,22),
     de:'点一次 = 标"看出来了"；再点 = 标"能证明"；⇧点 = 标薄弱',
     run:()=>{n.ok=n.ok?2:1;if(n.ok===2)n.weak=false;save();
       toast(n.ok===1?'标记：我能清楚地看出它是对的':'标记：我能证明它',
         '波利亚每次都是两问并列 —— 看出 ≠ 证明')}})));
}
async function writeEq(){
  const n=selNodes()[0]; if(!n)return toast('先选一个条件');
  const v=await ask('把这一条写成式子（写不出来，说明还没拆到位）\n'+
    '波利亚（将条件的不同部分分开）：「你能把它们写出来吗？」', n.eq||'');
  if(v===null)return; n.eq=v.trim(); boxCache.delete(n.id); save(); diag();
  toast(n.eq?('记下了：'+n.eq):'先空着，但迟早要写出来',
    '方程个数和未知量自由度一比，才知道条件是不足、恰好，还是多余');
}
function markWeak(){const ns=selNodes();if(!ns.length)return toast('先选一步');
  ns.forEach(n=>n.weak=!n.weak);save();toast(ns[0].weak?'标成薄弱点了 —— 检验时优先查它':'取消薄弱标记')}

/* 归纳表（归纳与数学归纳 1、2）：把散落的特例排成表，逼出一句精确陈述 */
function inductionTable(){
  const ns=selNodes(); if(ns.length<2)return toast('框选两个以上特例，把它们排成表');
  snap();
  const cx=ns.reduce((a,n)=>a+n.x,0)/ns.length, cy=Math.max(...ns.map(n=>n.y))+220;
  const rows=ns.map((n,i)=>(i+1)+'  '+n.t.slice(0,26)).join('\n');
  const t=addNode('归纳表\n'+rows+'\n────────\n我看到的规律（要精确）：…','result',cx,cy,{w:3});
  ns.forEach(n=>makeEdge(n.id,t.id,'imply'));
  ns.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/ns.length;
    n.x=n.hx=cx+Math.cos(a)*260; n.y=n.hy=cy-220+Math.sin(a)*130;});
  sel.clear();sel.add(t.id);startEdit(t);
  toast('把特例整齐地排列起来，像地质学家排列矿砂标本那样。',
    '排完之后要做的是：从"不太精确"过渡到一句精确的陈述，再检验 n → n+1');
}

/* 回到定义上去（定义 3、4 / 辅助元素 2）：把术语换成它的定义，定义里的元素当场变成新星 */
async function backToDefinition(){
  const n=selNodes()[0]; if(!n)return toast('先选一颗含术语的星');
  const term=await ask('哪个术语要回到定义上去？',n.t.slice(0,12));
  if(term===null)return;
  const def=await ask('它的定义是什么？（用最原始的词说，别再用别的术语）','');
  if(def===null||!def.trim())return;
  const d=addNode(term+' ≝ '+def.trim(),'aux',n.x+260,n.y+150,{w:3,
    reason:'回到定义上去 —— 定义里的每个元素都该画进图里'});
  makeEdge(n.id,d.id,'same','回到定义');
  const parts=def.split(/[，,、；;]/).map(x=>x.trim()).filter(x=>x.length>1).slice(0,4);
  parts.forEach((t,i)=>{
    const c=addNode(t,'cond',d.x-150+i*160,d.y+170,{w:2});
    makeEdge(d.id,c.id,'part','定义里的元素');
  });
  save();diag();
  toast('定义里的每一个元素都已经画进图里了。',
    '波利亚：叙述一个定义而不作图，它只能停留在嘴皮子上');
}

/* 互换角色：把未知量当已知（你能应用这个结果吗 3） */
function swapRoles(){
  const u=selNodes().find(n=>n.k==='unknown')||N().find(n=>n.k==='unknown');
  const d=selNodes().find(n=>n.k==='data')||N().find(n=>n.k==='data');
  if(!u||!d)return toast('需要选一个未知量和一个已知');
  const np=blank(P().name+'（互换：求 '+d.t.slice(0,8)+'）');
  np.stmt='把原题的未知量当已知，把一个已知当未知量 —— 两者之间的关系不变。\n原题：'+(P().stmt||'');
  np.nodes=JSON.parse(JSON.stringify(N())); np.edges=JSON.parse(JSON.stringify(E()));
  np.seq=P().seq+1000;
  const nu=np.nodes.find(x=>x.id===u.id), nd=np.nodes.find(x=>x.id===d.id);
  nu.k='data'; nu.dof=null; nd.k='unknown'; nd.w=5; nd.dof=1;
  DB.probs.push(np); DB.cur=DB.probs.length-1; save(); loadProb(); fitAll();
  toast('新题目已生成：'+nd.t+' 变成了未知量',
    '在新旧两道题里，已知量和未知量之间的关系不变（你能应用这个结果吗 3）');
}

/* 两条轨迹的交点就是我们想求作的点（分解和重组 7 / 观察未知量 3(4)） */
function intersectLoci(){
  const ls=selNodes().filter(n=>n.k==='locus');
  if(ls.length<2)return toast('选中两条轨迹','各由一半条件画出的两条轨迹，它们的交点就是答案');
  const cx=(ls[0].x+ls[1].x)/2, cy=(ls[0].y+ls[1].y)/2-160;
  const r=addNode('交点 = 要求作的对象','result',cx,cy,{w:5});
  ls.forEach(l=>makeEdge(l.id,r.id,'imply','交'));
  const u=N().find(n=>n.k==='unknown'); if(u)makeEdge(r.id,u.id,'same','就是它');
  save();diag();
  toast('两条轨迹的交点，就是我们想求作的点。','这就是把"作三角形"化简为"作一个点"之后的全部收获');
}

/* ══════════ 诊断（条件体检 + 你用到所有已知数据了吗） ══════════ */

function diag(){
  npSync();
  const ns=N().filter(n=>!n.cut);
  const prove=P().mode2==='prove';
  const us=ns.filter(n=>n.k==='unknown');
  const dof=us.reduce((s,n)=>s+(n.dof||1),0);
  const conds=ns.filter(n=>n.k==='cond');
  const eqs=conds.filter(n=>n.eq&&n.eq.trim()).length;      /* 唯一能真数的：方程 */
  const nd=ns.filter(n=>n.k===(prove?'given':'data'));
  const unused=nd.filter(n=>!n.spare&&!E().some(e=>e.a===n.id||e.b===n.id));
  const cut=N().filter(n=>n.cut).length;
  const out=[];
  /* 开局那次猜测（条件有可能满足吗？）—— 是猜测，不是判决 */
  const g=P().guess;
  if(g&&g.suff) out.push(`我当初猜：<b>${g.suff}</b>`+(g.nsol?`，${g.nsol} 个解`:''));
  if(eqs) out.push(`已经写成式子的条件 <b>${eqs}</b> / 共 ${conds.length} 条`
     +(dof?` · 未知量 ${us.length} 个`:'')+' —— <span class="w">够不够，你自己判</span>');
  else if(conds.length) out.push(`${conds.length} 个条件，还没有一条被写成式子 —— <b>你能把它们写出来吗？</b>`);
  /* A10：这一问是检验阶段的事，摆零件的时候不该报警 */
  if(unused.length&&P().phase>=2)
    out.push(`<span class="b">${unused.length} 个${prove?'题设':'已知'}还没连上 —— ${
      P().ptype==='real'?'你是否用到了所有对解答相当有用的数据？':'你用到所有的'+(prove?'题设':'已知数据')+'了吗？'}</span>`);
  /* 辅助题目 6：先过渡到更窄、又过渡到更宽，就可能完全脱离原题的轨道 */
  const risky=N().some(n=>E().some(e=>e.b===n.id&&e.rk==='narrow')&&E().some(e=>e.a===n.id&&e.rk==='wide'));
  if(risky) out.push('<span class="b">约简链里出现了「先变窄、又变宽」—— 当心已经脱离原题的轨道</span>');
  const loci=ns.filter(n=>n.k==='locus').length;
  if(loci>=2&&!ns.some(n=>n.k==='result'))
    out.push('<span class="w">已经有两条轨迹了 —— 它们的交点就是答案（⌘K → 两条轨迹求交）</span>');
  if(GHOST.length) out.push(`<span class="w">${GHOST.length} 处「同一个符号两边都有，却没连线」</span>`);
  if(DEAD.size) out.push(`<span class="b">${DEAD.size} 颗已经和目标断开</span>`);
  if(selE.size) out.push(`<span class="o">选中了 ${selE.size} 条线 —— Delete 删掉</span>`);
  if(cut) out.push(`已砍 ${cut}`);
  out.push(`<b>${N().length}</b> 星体 · <b>${E().length}</b> 关系`+(prove?' · 证明题':''));
  const head=out.slice(0,3), rest=out.length-3;
  document.getElementById('diag').innerHTML=head.join(' &nbsp;·&nbsp; ')
    +(rest>0?` <span style="opacity:.55;cursor:pointer" onclick="this.parentNode.innerHTML='${
      out.join(' &nbsp;·&nbsp; ').replace(/'/g,"\\'")}'">+${rest}</span>`:'');
  inferPhase();
}
/* 题目类型：数学求解题 / 证明题 / 实际题目 / 谜语（现代探索法 3：都属于探索法的范畴） */
/* 题面 → 一排暗淡的候选星，拖进宇宙就落地（不用把名词再打一遍） */
function seedFromStmt(){
  const txt=(P().stmt||'').trim();
  if(!txt)return toast('先在上面写题面');
  const parts=txt.split(/[，,。；;、\n]/).map(x=>x.trim())
    .filter(x=>x.length>1&&x.length<40).slice(0,10);
  if(!parts.length)return toast('题面里没切出东西','用逗号、顿号把它断开再试');
  snap();
  const c=s2w(innerWidth/2,innerHeight/2);
  parts.forEach((t,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/parts.length;
    addNode('（待定）'+t, 'idea', c.x+Math.cos(a)*330, c.y+Math.sin(a)*230, {w:1,cand:1});
  });
  ensureNoOverlap();save();diag();fitAll();
  toast('题面拆成了 '+parts.length+' 颗候选星','挨个选中，按 1..5 定它是未知量 / 已知 / 条件 —— 定完就不再是候选');
}
function setPType(){
  openList('这是哪一类题目？',[
   {nm:'求解题（数学）',de:'主要部分：未知量、已知数据、条件',run:()=>applyPType('math')},
   {nm:'证明题',de:'主要部分换成：题设、结论 —— 整套提问跟着换（求解题、证明题 5、6）',run:()=>applyPType('prove')},
   {nm:'实际题目',de:'数据常常是多余的：问的是"用到所有相当有用的数据了吗"（实际题目 1）',run:()=>applyPType('real')},
   {nm:'谜语',de:'条件往往是故意含糊的 —— 先把它的不同部分分开（分解和重组 8）',run:()=>applyPType('riddle')},
  ]);
}
function applyPType(t){
  P().ptype=t; P().mode2=(t==='prove')?'prove':'solve'; save(); drawPhases(); diag();
  const msg={math:'求解题：未知量是什么？已知数据是什么？条件是什么？',
    prove:'证明题：题设是什么？结论是什么？—— 数字键 1..5 现在是 结论/题设/条件/辅助定理/念头',
    real:'实际题目：数据常常是多余的。问题变成「你是否用到了所有对解答相当有用的数据？」',

/* 已知数据标成"多余"（实际题目 1：有大量的数据常常是多余的） */
function markSpare(){
  const ns=selNodes(); if(!ns.length)return toast('先选一个已知');
  ns.forEach(n=>n.spare=!n.spare); save(); diag();
  toast(ns[0].spare?'标成多余了 —— 不再催你去用它':'取消多余标记');
}

/* 阶段自动推断：结构走到哪儿，阶段就在哪儿（手点仍然可以覆盖） */
function inferPhase(){
  const ns=N().filter(n=>!n.cut), prove=P().mode2==='prove';
  const goalK=prove?'concl':'unknown', dataK=prove?'given':'data';
  const goal=ns.filter(n=>n.k===goalK);
  const conds=ns.filter(n=>n.k==='cond');
  const linked=conds.some(c=>E().some(e=>(e.a===c.id&&goal.some(g=>g.id===e.b))||
                                          (e.b===c.id&&goal.some(g=>g.id===e.a))));
  let ph=0;
  if(P().stmt&&P().stmt.trim())ph=1;
  if(goal.length&&ns.some(n=>n.k===dataK)&&conds.length)ph=2;
  if(linked)ph=3;
  if(conds.some(c=>c.eq&&c.eq.trim()))ph=4;
  if(N().some(n=>n.cut)||ns.some(n=>n.k==='locus'))ph=5;
  const goalIds=new Set(goal.map(g=>g.id));
  if(ns.some(n=>n.k==='aux'&&E().some(e=>(e.a===n.id&&goalIds.has(e.b))||(e.b===n.id&&goalIds.has(e.a)))))ph=6;
  /* ⑧执行：有辅助题目、而且真的开始往下算了（写了式子或画了轨迹，且推导链够长） */
  if(ns.some(n=>n.k==='aux')&&E().filter(e=>e.k==='imply').length>=3
     &&(conds.some(c=>c.eq&&c.eq.trim())||ns.some(n=>n.k==='locus')))ph=7;
  if(ns.some(n=>n.k==='result'))ph=8;
  P().autoPhase=ph;
  /* 波利亚：四阶段只是把问题归类的镜头，可以跳过、可以回头。手点过就完全交给他 */
  if(P().manualPhase==null&&ph!==P().phase){P().phase=ph;drawPhases();save()}
  return ph;
}
/* 卡住检测：150 秒没有任何结构变化，才浮出一句提问 —— 顺利时绝不打扰 */
let lastMut=Date.now(), lastNag=0, lastSignal=Date.now(), STUCK=false;
function mutated(){lastMut=Date.now();ghostDirty=true}
function nagTick(){
  const now=Date.now();
  /* 波利亚要的是"没有进展"，不是"没有动作" —— 机械地连 20 条无用的线不算进展 */
  STUCK = (now-lastSignal>150000) && (now-lastMut>45000);
  if(!STUCK||now-lastNag<150000)return;
  if(editing||document.querySelector('.sheet.on'))return;
  lastNag=now;
  const i=P().phase,p=PHASES[i];
  const acts=CMDS.filter(c=>c.ph&&c.ph.includes(i)).slice(0,3);
  const pool=(P().mode2==='prove'&&ASKP[i])?ASKP[i]:p.ask;
  if(isUse())return;                    /* 使用模式不打扰 */
  toast(pool[Math.floor(Math.random()*pool.length)],
        '卡住了？'+(acts.length?('试试：'+acts.map(a=>a.nm).join(' / ')+'（⌘K）'):''));
}
setInterval(nagTick,20000);

/* 撤销：破坏性动作之前先拍一张 */
const UNDO=[];
function snap(){
  try{UNDO.push(JSON.stringify({n:N(),e:E(),s:P().seq}));if(UNDO.length>30)UNDO.shift()}catch(err){}
}
function undo(){
  if(!UNDO.length)return toast('没有可撤销的了');
  try{
    const v=JSON.parse(UNDO.pop());
    P().nodes=v.n;P().edges=v.e;P().seq=v.s;
    sel.clear();boxCache.clear();ghostDirty=true;
    mode='idle';linkFrom=null;linkTo=null;dragOff=null;marq=null;pendingRel=null;selE.clear();
    save();diag();inferPhase();
    toast('撤销了一步','还剩 '+UNDO.length+' 步可撤');
  }catch(err){toast('撤销失败')}
}

async function reviewGuess(){
  const g=P().guess;
  if(!g||!g.suff)return toast('开局没猜过','下次一开始就按 ⌘K →「条件有可能满足吗」猜一次，回顾时才有得对');
  const real=await ask('实际上是？（充分/不充分/多余/矛盾）',g.suff);
  if(real===null)return;
  const n=await ask('实际有几个解？',g.nsol||'');
  toast(g.suff===real.trim()?'猜对了':'猜错了：当初猜「'+g.suff+'」，实际是「'+real.trim()+'」',
        (g.nsol||n)?('解的个数：猜 '+(g.nsol||'?')+' / 实际 '+(n||'?')):'');
}

let toastT=null;
const isUse=()=>DB.ui&&DB.ui.mode==='use';
/* 引导性的话（不是你自己按出来的）在使用模式下一律不出声 */
function teach(msg,sub){ if(isUse())return; toast(msg,sub) }
function toast(msg,sub){
  if(typeof demoI!=='undefined'&&demoI>=0)return;   /* 演示时只留旁白，不叠字 */
  if(typeof coachI!=='undefined'&&coachI>=0)return; /* 手把手时也只留一块字 */

/* 波利亚提问：按当前阶段随机给一句 */
function askOne(){
  const i=P().phase, p=PHASES[i];
  const pool=(P().mode2==='prove'&&ASKP[i])?ASKP[i]:p.ask;
  const q=pool[Math.floor(Math.random()*pool.length)];

/* 进展的标志（进展的标志 3）：又一个数据接上了未知量 / 条件的另一部分被用上了 / 引入了更简单的类似题 */
let sigDirty=false,sigAt=0;
function checkSignals(){
  const goal=N().find(n=>n.k==='unknown'||n.k==='concl'); if(!goal)return;
  const adj={};E().forEach(e=>{(adj[e.a]=adj[e.a]||[]).push(e.b);(adj[e.b]=adj[e.b]||[]).push(e.a)});
  const seen=new Set([goal.id]),q=[goal.id];
  while(q.length){const x=q.pop();(adj[x]||[]).forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}
  const reached=N().filter(n=>(n.k==='data'||n.k==='given')&&seen.has(n.id)).length;
  const parts=E().filter(e=>e.k==='part').length;          /* 条件的另一部分被分出来 */
  const anas=E().filter(e=>e.k==='analog').length;         /* 引入了更简单的类似题 */
  const eqs=N().filter(n=>n.eq&&n.eq.trim()).length;       /* 条件被写成了式子 */
  const cur={r:reached,p:parts,a:anas,e:eqs};
  const old=P().sig||{r:0,p:0,a:0,e:0};
  const msg=cur.r>old.r?'又一个'+(P().mode2==='prove'?'题设':'数据')+'接上了目标'
      :cur.p>old.p?'条件的另一部分被分出来了'
      :cur.a>old.a?'引入了一道更简单的类似题'
      :cur.e>old.e?'又一条条件被写成了式子':null;
  P().sig=cur;save();
  if(msg&&typeof lastSignal!=='undefined'){lastSignal=Date.now();STUCK=false;
    teach('进展的标志：'+msg,
      '进展的标志 2：最重要的那些标志是探索式的 —— 要遵循，但也要留一点怀疑')}
}

/* ══════════ 阶段条 ══════════ */
function drawPhases(){
  const box=document.getElementById('phases');box.innerHTML='';
  PHASES.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='ph'+(i===P().phase?' on':'');
    d.textContent=p.t;
    d.onclick=()=>{
      if(P().manualPhase===i){P().manualPhase=null;save();drawPhases();
        toast('解锁了 —— 阶段重新跟着图自己走');return}
      P().phase=i;P().manualPhase=i;save();drawPhases();
      openList(p.n+' '+p.t+' · '+p.p+'（已锁定，再点当前这个可解锁）',
        CMDS.filter(c=>c.ph&&c.ph.includes(i)).concat([{nm:'—— 全部动作',de:'',run:()=>openSheet('pal')}]));
      toast(p.g,'波利亚 '+p.src)};
    box.appendChild(d);
  });
}

let listMode=null;
function openSheet(id){
  const el=document.getElementById(id);el.classList.add('on');
  const q=el.querySelector('input');q.value='';q.focus();
  if(id==='pal'){listMode=null;q.placeholder='做点什么…（波利亚的动作全在这里）';palRender('')}
  if(id==='pick')pkRender('');
}
function closeSheets(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));listMode=null}
function openList(title,items){
  listMode=items;
  const el=document.getElementById('pal');el.classList.add('on');
  const q=el.querySelector('input');q.value='';q.placeholder=title;q.focus();
  palRender('');
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function palRender(q){
  q=q.trim().toLowerCase();
  const src=listMode||CMDS;
  let list=src.filter(c=>!q||(c.nm+(c.de||'')+(c.ky||'')).toLowerCase().includes(q));
  if(!listMode){                       /* 此刻该做的排最前 */
    const ph=P().phase;
    list=list.map((c,i)=>({c,i,hot:c.ph&&c.ph.includes(ph)?0:1}))
             .sort((a,b)=>a.hot-b.hot||a.i-b.i).map(x=>x.c);
  }
  const box=document.getElementById('pall');
  box.innerHTML=list.map((c,i)=>
    `<div class="it${i===0?' k':''}" data-i="${src.indexOf(c)}">
       <span class="ky">${esc(c.ky||'')}</span><span class="nm">${esc(c.nm)}</span>
       <span class="de">${esc(c.de||'')}</span>${
         (!listMode&&c.ph&&c.ph.includes(P().phase))?'<span class="tg">此刻</span>':''}</div>`).join('')
   ||'<div class="it"><span class="de">没有匹配</span></div>';
  [...box.children].forEach(el=>{
    el.onclick=()=>{const c=src[+el.dataset.i];closeSheets();if(c&&c.run)c.run()};
  });
}
document.getElementById('palq').addEventListener('input',e=>palRender(e.target.value));
document.getElementById('palq').addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Escape'){closeSheets()}
  if(e.key==='Enter'){const f=document.querySelector('#pall .it');if(f)f.click()}
});

   ||'<div class="it"><span class="de">没有匹配</span></div>';

function showRing(x,y){
  const r=document.getElementById('ring');r.innerHTML='';r.classList.add('on');
  const R=96;
  const s0=selNodes()[0];
  const set = s0 ? (RING_BY[s0.k]||RING)
    : [{i:'✦',u:'新建星',run:()=>CMDS[0].run()},
       {i:'❊',u:'题面拆星',run:seedFromStmt},
       {i:'✎',u:'画笔',run:toggleInk},

       {i:'?',u:'问我一句',run:askOne},
       {i:'⌘',u:'全部',run:()=>openSheet('pal')}];
  set.forEach((b,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/set.length;
    const d=document.createElement('div');d.className='rb';
    const cx=Math.max(R+34,Math.min(innerWidth-R-34,x));
    const cy=Math.max(R+34,Math.min(innerHeight-R-34,y));
    d.style.left=(cx+Math.cos(a)*R)+'px';d.style.top=(cy+Math.sin(a)*R)+'px';
    d.style.animationDelay=(i*14)+'ms';
    d.innerHTML=`<i>${b.i}</i><u>${b.u}</u>`;
    d.onclick=ev=>{ev.stopPropagation();hideRing();b.run()};
    r.appendChild(d);

/* ══════════ 键盘 ══════════ */
addEventListener('keydown',e=>{
  if(document.querySelector('.sheet.on'))return;
  if(editing)return;
  const k=e.key;
  if(k===' '){spaceDown=true;cv.style.cursor='grabbing';e.preventDefault();return}
  if(e.metaKey||e.ctrlKey){
    if(k.toLowerCase()==='z'){e.preventDefault();undo();return}
    if(k.toLowerCase()==='k'){e.preventDefault();openSheet('pal')}
    return;                      /* ⌘S ⌘R ⌘A ⌘F 等一律还给浏览器 */
  }
  if(k==='Escape'){sel.clear();selE.clear();linkFrom=null;linkTo=null;pendingRel=null;mode='idle';SPOT=null;FOCUS=false;
    inkMode=false;hideRing();closeSheets();return}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();delSel();return}
  if(k==='Enter'){const n=selNodes()[0];if(n)startEdit(n);return}
  if(k==='T'&&e.shiftKey){tidy();return}
  if(k==='['){pushZ(-1);return}
  if(k===']'){pushZ(1);return}
  if(k==='\\'){toggleFocus();return}
  if(k===';'){cycleSpot();return}
  if(k.toLowerCase()==='g'&&!RELAX){RELAX=true;returning=0;
    toast('松开 G 就回到你摆的位置','让它自己长开，看看结构本来想长成什么样');return}
  const map={n:()=>CMDS[0].run(),l:()=>startLink('bind'),x:cutSel,t:makeLocus,d:splitSel,
    r:recombine,b:bridge,w:backwards,a:analogy,v:limitCase,s:specialize,p:generalize,
    o:orbit,i:toggleInk,e:writeEq,
    u:unknownType,m:()=>openSheet('pick'),'?':askOne,'/':()=>openSheet('pal')};
  const lk=k.toLowerCase();
  if(lk==='n'&&e.shiftKey){                       /* ⇧N = 从选中的星长出一颗子星 */
    const n0=selNodes()[0];
    if(!n0)return toast('先选一颗星','选中后它右边会浮出一个 ＋，点它也一样');
    e.preventDefault();growChild(n0);return;
  }
  if(lk==='f'){
    if(e.shiftKey){const n=selNodes()[0];if(n)flyTo(n,1.6)}
    else{if(compact()){deoverlap();save();toast('顺手把跑远的星体收回来并排开了')}fitAll()}
    return;
  }
  const dg=/^Digit([1-5])$/.exec(e.code);
  if(dg){
    const v=+dg[1];
    if(e.shiftKey)setW(v); else setKind(kindByDigit(v));
    return;
  }
  if(k==='='||k==='+'){bumpW(1);return}
  if(k==='-'||k==='_'){bumpW(-1);return}
  if(map[lk]){e.preventDefault();map[lk]();}
});

function exportText(){
  const p=P();
  let s='# '+p.name+'\n\n'+(p.stmt||'')+'\n\n'
    +(p.ptype?('题型：'+{math:'求解题',prove:'证明题',real:'实际题目',riddle:'谜语'}[p.ptype]+'\n'):'')
    +(p.guess&&p.guess.suff?('开局猜测：条件'+p.guess.suff+(p.guess.nsol?('，'+p.guess.nsol+' 个解'):'')+'\n\n'):'\n');
  const grp={unknown:'未知量',concl:'要证的结论',data:'已知数据',given:'题设',cond:'条件',
    aux:'辅助 / 踏脚石',lemma:'辅助定理',locus:'轨迹',idea:'念头',result:'结论'};
  Object.keys(grp).forEach(k=>{
    const ns=N().filter(n=>n.k===k); if(!ns.length)return;
    s+='## '+grp[k]+'\n';
    ns.forEach(n=>{s+='- '+(n.cut?'~~':'')+n.t+(n.cut?'~~（已砍）':'')
      +(n.eq?`　式子：${n.eq}`:'')
      +(n.dof?`（自由度 ${n.dof}）`:'')
      +(n.ms&&n.ms.length?'　◈ '+n.ms.map(x=>(MI(x)||{}).zh).filter(Boolean).join('、'):'')
      +(n.reason?'　理由：'+n.reason:'')+'\n'});
    s+='\n';
  });
  if(E().length){s+='## 关系\n';
    E().forEach(e=>{const a=byId(e.a),b=byId(e.b);if(a&&b)
      s+=`- ${a.t} —[${(RELS[e.k]||{}).t}${e.label?'：'+e.label:''}]→ ${b.t}\n`})}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s)
      .then(()=>toast('已复制到剪贴板','整张图变成了文字，可以直接粘进笔记'))
      .catch(()=>fallbackCopy(s));
  }else fallbackCopy(s);
}

function fallbackCopy(s){
  const ta=document.createElement('textarea');ta.value=s;
  ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);
  ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  toast(ok?'已复制到剪贴板':'复制失败，已打印到控制台',ok?'':'按 F12 打开控制台自取');
  if(!ok)console.log(s);
}

function putSkeleton(){
  if(N().length)return false;
  const c=s2w(innerWidth/2,innerHeight/2), ids=[];
  SKELETON.n.forEach(([t,k,x,y,ex])=>ids.push(addNode(t,k,c.x+x,c.y+y,ex||{}).id));
  SKELETON.e.forEach(([a,b,r])=>makeEdge(ids[a],ids[b],r));
  ensureNoOverlap();
  P().sig=null;checkSignals();          /* 骨架自带的连线不算"进展" */
  save();fitAll();diag();return true;
}

  snap();P().nodes=[];P().edges=[];P().ink=[];sel.clear();boxCache.clear();
  ghostDirty=true;save();diag();

/* 从零件盒拖到宇宙里 */
let spawning=null;
function startSpawn(e,pt){
  e.preventDefault();
  spawning=pt;
  const g=document.getElementById('drag');
  const c=(KINDS[pt.k]||KINDS.idea).c;
  g.style.display='block';g.style.color=`rgb(${lighten(c)})`;g.textContent=pt.t;
  const mv=ev=>{g.style.left=(ev.clientX+14)+'px';g.style.top=(ev.clientY-14)+'px'};
  const up=ev=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
    g.style.display='none';
    const el=document.getElementById('panel');
    const r=el.getBoundingClientRect();
    if(!(ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom)){
      const w=s2w(ev.clientX,ev.clientY);
      const n=addNode('',pt.k,w.x,w.y,pt.k==='unknown'?{w:5,dof:1}:{});
      sel.clear();sel.add(n.id);curKind=pt.k;startEdit(n);
    }
    spawning=null;
  };
  mv(e);
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}

function trainPick(){
  const done=new Set(DB.ui.solved||[]);
  const pool=TRAIN.filter(t=>!done.has(t.id));
  const t=(pool.length?pool:TRAIN)[Math.floor(Math.random()*(pool.length||TRAIN.length))];
  const np=blank('训练 '+t.id);
  np.stmt=t.q; np.trainId=t.id; np.ptype='math';
  DB.probs.push(np);DB.cur=DB.probs.length-1;save();loadProb();putSkeleton();drawPanel();
  toast('骨架先给你摆好了 —— 逐个双击改成这道题的话','第一步永远是：未知量是什么？');
}
function trainHint(){
  const t=TRAIN.find(x=>x.id===P().trainId);
  if(!t)return toast('先换一道题');
  toast(t.h,'波利亚给你的提示 —— 只有一句，剩下的靠你');
}
function trainDone(){
  const id=P().trainId; if(!id)return;
  DB.ui.solved=DB.ui.solved||[];
  if(!DB.ui.solved.includes(id))DB.ui.solved.push(id);
  save();drawPanel();closeOut();
  toast('记下了。这题教了我什么？','回顾是波利亚四阶段里最被忽略的一个 —— 别跳过它');
}

function demoHang(id,kw){
  const m=MODELS.find(x=>x.zh.indexOf(kw)>=0); if(!m)return;
  const n=byId(id); if(!n)return;
  n.ms=(n.ms||[]).concat([m.n]).filter((v,i,a)=>a.indexOf(v)===i);
  boxCache.clear();
}

function stamp(t){
  const d=new Date(t||Date.now()), z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

async function renameCanvas(i,ev){
  ev&&ev.stopPropagation();

  DB.probs[i].name=nm||DB.probs[i].name; DB.probs[i].updatedAt=Date.now(); save();

async function delCanvas(i,ev){
  ev&&ev.stopPropagation();
  if(DB.probs.length<2)return toast('至少留一张');
  if(!await ok('删掉「'+DB.probs[i].name+'」？删了就没了。'))return;
  DB.probs.splice(i,1);
  if(DB.cur>=DB.probs.length)DB.cur=DB.probs.length-1;
  else if(DB.cur>i)DB.cur--;

  const rows=DB.probs.map((p,i)=>({p,i}))
    .sort((a,b)=>(b.i===DB.cur)-(a.i===DB.cur)        /* 正在看的那张永远置顶 */
              || (b.p.updatedAt||0)-(a.p.updatedAt||0));

   `<h4>画布</h4>

}

    if(s===null)return;DB.probs.push(blank(s||'未命名'));DB.cur=DB.probs.length-1;save();loadProb();
    if(isUse())putSkeleton()}}]));

setInterval(()=>{P().cam={x:cam.x,y:cam.y,z:cam.z};save()},3000);

document.getElementById('tips').innerHTML=
 `<b>⌘K 全部动作</b>　<span style="opacity:.6">（鼠标移到这里看全部手势）</span><br>
  <kbd>双击空白</kbd> 造一颗星　<kbd>从星体边缘拖出去</kbd> 拉一条线（松在空白 = 直接长出新星）<br>
  <kbd>滚轮</kbd> 在宇宙里漂　<kbd>⌘/Ctrl+滚轮</kbd> 缩放　<kbd>F</kbd> 全景　<kbd>⇧F</kbd> 钻进去<br>
  <kbd>]</kbd> 拉到前面　<kbd>[</kbd> 压到后面　<kbd>\\</kbd> 焦平面　<kbd>;</kbd> 只看一类关系　<kbd>按住G</kbd> 让它自己长开<br>
  <kbd>O</kbd> 收成卫星　<kbd>I</kbd> 画笔　<kbd>⇧T</kbd> 整理布局　<kbd>点线</kbd> 选中它　<kbd>Delete</kbd> 删星或删线　<kbd>X</kbd> 砍　<kbd>?</kbd> 让波利亚问我一句　<kbd>⌘K</kbd> 全部动作`;

resize();loadProb();drawModes();drawPanel();
if(!N().length)putSkeleton();      /* 每次打开：空的就给一个骨架，直接在上面建 */
else{
  let fixed=compact();
  if(ensureNoOverlap())fixed=true;
  if(fixed){save();toast('有星体叠在一起，已经分开','布局大体没动；想彻底重排就按 ⇧T');}
  fitAll();                        /* 已经有图：一打开就框住，别停在看不见的倍数上 */
}
requestAnimationFrame(draw);
/* 从别的页面带着题面跳进来：解题空间.html?q=题面&n=名字 */
(function(){
  try{
    const u=new URLSearchParams(location.search);
    const q=u.get('q'); if(!q)return;
    const nm=u.get('n')||q.slice(0,14);
    let i=DB.probs.findIndex(x=>x.stmt===q);      /* 同一题不重复建 */
    if(i<0){
      const np=blank(nm); np.stmt=q; np.ptype=u.get('t')||'math';
      if(np.ptype==='prove')np.mode2='prove';
      DB.probs.push(np); i=DB.probs.length-1;
    }
    DB.cur=i; DB.ui.mode=u.get('m')||'use'; save();
    loadProb(); drawModes(); drawPanel();
    if(!N().length)putSkeleton();
    history.replaceState(null,'',location.pathname);   /* 刷新不再重复 */
  }catch(e){}
})();

/* ?demo=1 看演示；?demo=1&step=N 定格在第 N 步（导视频用） */
(function(){
  try{
    const u=new URLSearchParams(location.search);
    if(!u.get('demo'))return;
    const dk=+(u.get('d')||0);
    demoK=Math.max(0,Math.min(DEMOS.length-1,dk)); DEMO=DEMOS[demoK].steps;
    const st=u.get('step');
    if(st!==null){demoGoto(+st);}
    else{demoStart(demoK);demoToggle();}   /* 只有带 ?demo=1 才自动播；平时点右上角 ▶ 动画文稿 */
  }catch(e){}
})();

/* 第一次打开：自动开始手把手 */
try{ if(!localStorage.getItem('polya.coached')&&!isUse())
  setTimeout(()=>{if(N().length&&!isUse())coachStart(0)},1200) }catch(e){}

/* ---------- 首次：装入波利亚原书那道题 ---------- */
if(!N().length&&!P().stmt){
  P().stmt='示例（波利亚 分解和重组 7）：已知三角形的一边 a、a 边上的高 h、以及 a 的对角 α，作这个三角形。';
  document.getElementById('stmt').value=P().stmt;
  const u=addNode('第三个顶点 A','unknown',0,-40,{w:5,dof:2});
  const d1=addNode('先作出 BC，长度 = a','data',-420,-190,{w:3});
  const d2=addNode('高 h','data',-460,20,{w:3});
  const d3=addNode('角 α','data',-430,220,{w:3});
  const c1=addNode('A 到 BC 的距离 = h','cond',-70,250,{w:4});
  const c2=addNode('∠BAC = α，两边过 B、C','cond',300,240,{w:4});
  const a1=addNode('把「作三角形」化简为「作一个点」','aux',330,-230,{w:4,reason:'把题目简化为作一个点，再用两条轨迹的交点作出它'});
  makeEdge(c1.id,u.id,'bind');makeEdge(c2.id,u.id,'bind');
  makeEdge(d2.id,c1.id,'imply');makeEdge(d3.id,c2.id,'imply');
  makeEdge(d1.id,c1.id,'imply');makeEdge(d1.id,c2.id,'imply');
  makeEdge(a1.id,u.id,'same','就是求这个点');
  sel.clear();fitAll();diag();save();
}

/* ══════════ iPad / Apple Pencil ══════════
   分工：Pencil = 选 / 拖 / 编辑 / 画；手指 = 只平移缩放（天然防误触）
   单击星体 = 直接编辑；空白双击 = 新建；长按 = 环形菜单            */
const TOUCHDEV = navigator.maxTouchPoints>0 || matchMedia('(pointer:coarse)').matches;
if(TOUCHDEV){
  document.documentElement.classList.add('touch');
  const RING_EL=document.getElementById('ring');
  const FG=new Map();                      /* 按下的手指 */
  let pinch=null, tpan=null, lp=null, penDown=null, lastTap=0, lastTX=0, lastTY=0;
  const clearLP=()=>{ if(lp){clearTimeout(lp);lp=null} };
  const ringOn=()=>RING_EL.classList.contains('on');

  /* ---------- 手指：捕获阶段全部拦下，只驱动相机 ---------- */
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch')return;
    e.stopImmediatePropagation();
    FG.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    if(FG.size===1){
      tpan={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};
      const px=e.clientX, py=e.clientY;
      clearLP();
      lp=setTimeout(()=>{                  /* 单指长按 = 环形菜单 */
        lp=null;tpan=null;
        const w=s2w(px,py), n=hit(w.x,w.y);
        if(n){ if(!sel.has(n.id)){sel.clear();sel.add(n.id)} } else sel.clear();
        diag();showRing(px,py);
      },520);
    }else if(FG.size===2){
      clearLP();tpan=null;
      const f=[...FG.values()];
      pinch={d:Math.hypot(f[0].x-f[1].x,f[0].y-f[1].y),
             mx:(f[0].x+f[1].x)/2,my:(f[0].y+f[1].y)/2};
    }
  },true);

  cv.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'){
      if(lp&&penDown&&Math.hypot(e.clientX-penDown.x,e.clientY-penDown.y)>9)clearLP();
      return;
    }
    const p=FG.get(e.pointerId); if(!p)return;
    e.stopImmediatePropagation();
    p.x=e.clientX;p.y=e.clientY;
    if(FG.size>=2&&pinch){                 /* 双指：捏合缩放 + 跟手平移 */
      const f=[...FG.values()];
      const d=Math.hypot(f[0].x-f[1].x,f[0].y-f[1].y);
      const mx=(f[0].x+f[1].x)/2, my=(f[0].y+f[1].y)/2;
      if(pinch.d>4&&d>4)zoomAt(mx,my,d/pinch.d);
      cam.x-=(mx-pinch.mx)/cam.z; cam.y-=(my-pinch.my)/cam.z;
      camT.x=cam.x; camT.y=cam.y;
      pinch.d=d;pinch.mx=mx;pinch.my=my;
    }else if(tpan){                        /* 单指：漂 */
      if(Math.hypot(e.clientX-tpan.sx,e.clientY-tpan.sy)>9)clearLP();
      cam.x=tpan.cx-(e.clientX-tpan.sx)/cam.z;
      cam.y=tpan.cy-(e.clientY-tpan.sy)/cam.z;
      camT.x=cam.x;camT.y=cam.y;
    }
  },true);

  const fingerUp=e=>{
    if(e.pointerType!=='touch')return;
    e.stopImmediatePropagation();
    FG.delete(e.pointerId);
    clearLP();
    if(FG.size<2)pinch=null;
    if(FG.size===1){                       /* 松掉一根，剩下那根接着平移 */
      const f=[...FG.values()][0];
      tpan={sx:f.x,sy:f.y,cx:cam.x,cy:cam.y};
    }
    if(FG.size===0)tpan=null;
  };
  cv.addEventListener('pointerup',fingerUp,true);
  cv.addEventListener('pointercancel',fingerUp,true);

  /* ---------- Pencil：捕获阶段只起长按计时，不拦逻辑 ---------- */
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch')return;
    penDown={x:e.clientX,y:e.clientY,t:e.timeStamp};
    const px=e.clientX, py=e.clientY;
    clearLP();
    lp=setTimeout(()=>{                    /* 长按 = 环形菜单，并撤掉刚起的拖拽 */
      lp=null;
      mode='idle';dragOff=null;marq=null;linkFrom=null;linkTo=null;pendingRel=null;
      showRing(px,py);
    },520);
  },true);

  /* 冒泡阶段（排在原生 pointerup 之后）：轻点 = 编辑 */
  cv.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch')return;
    const hadRing=!lp&&ringOn();
    clearLP();
    if(!penDown)return;
    const dist=Math.hypot(e.clientX-penDown.x,e.clientY-penDown.y);
    const dur=e.timeStamp-penDown.t;
    penDown=null;
    if(hadRing||inkMode||editing||dist>11||dur>500)return;
    const w=s2w(e.clientX,e.clientY), n=hit(w.x,w.y);
    if(n){                                 /* 点一下星体 → 直接改字（同步调用才弹键盘） */
      if(mode==='link'){linkFrom=null;linkTo=null;pendingRel=null;mode='idle'}
      sel.clear();sel.add(n.id);startEdit(n);
      return;
    }
    if(mode==='link')return;
    const t=e.timeStamp;                   /* 空白双击 = 长一颗新星 */
    if(t-lastTap<360&&Math.hypot(e.clientX-lastTX,e.clientY-lastTY)<34){
      lastTap=0;
      const k=N().length===0?(P().mode2==='prove'?'concl':'unknown'):curKind;
      const m=addNode('',k,w.x,w.y);sel.clear();sel.add(m.id);startEdit(m);
    }else{lastTap=t;lastTX=e.clientX;lastTY=e.clientY}
  });

  /* ---------- 触控条：没键盘也能用 ---------- */
  const TB=[
    {i:'✦',u:'新建', run:()=>CMDS[0].run()},
    {i:'⟋',u:'连线', run:()=>startLink('bind')},
    {i:'✎',u:'画笔', run:toggleInk, ink:true},
    {i:'⌫',u:'删除', run:delSel},
    {i:'↺',u:'撤销', run:undo},
    {i:'⊙',u:'全景', run:()=>{if(compact()){deoverlap();save()}fitAll()}},
    {i:'⌘',u:'全部', run:()=>openSheet('pal')}
  ];
  const tbar=document.getElementById('tbar');
  TB.forEach(b=>{
    const d=document.createElement('b');
    d.innerHTML='<i>'+b.i+'</i><u>'+b.u+'</u>';
    d.addEventListener('pointerdown',ev=>{ev.stopPropagation()});
    d.addEventListener('click',ev=>{
      ev.stopPropagation();hideRing();b.run();
      if(b.ink)d.classList.toggle('on',inkMode);
    });
    tbar.appendChild(d);
  });

  /* 右侧详情面板打开时，触控条整体左移让位 */
  const NP=document.getElementById('np');
  if(NP){
    const sync=()=>tbar.classList.toggle('shift',NP.classList.contains('on'));
    new MutationObserver(sync).observe(NP,{attributes:true,attributeFilter:['class']});
    sync();
  }
  /* 画笔亮灯跟着真实状态走 */
  const inkBtn=tbar.children[2];
  setInterval(()=>inkBtn.classList.toggle('on',inkMode),400);
}
</script>
