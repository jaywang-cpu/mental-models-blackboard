<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>解题宇宙 · 波利亚</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#070a12">
<style>
  :root{
    --ink:#e8edf9; --dim:#93a0bd; --far:#5f6a86;
    --cy:#5fc9e8; --gd:#e8b84a; --pu:#c78ef0; --gr:#7ee8a2; --rd:#f08e8e; --wh:#fff6e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#03050c;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:default}

  /* ---------- HUD：全部无框，浮在宇宙上 ---------- */
  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud *{pointer-events:auto}
  #hTop{left:0;right:0;top:0;padding:18px 22px;display:flex;gap:18px;align-items:flex-start}
  #hTop h1{font-family:"Songti SC","STSong",Georgia,serif;font-size:19px;letter-spacing:.14em;
    font-weight:600;color:rgba(232,237,249,.9);text-shadow:0 0 22px rgba(95,201,232,.4);cursor:pointer;flex:none}
  #stmt{flex:1;max-width:640px;background:none;border:0;outline:none;resize:none;color:rgba(232,237,249,.82);
    font:inherit;font-size:13px;line-height:1.65;height:42px;text-shadow:0 0 18px rgba(3,5,12,.9)}
  #stmt:focus{color:#fff}
  #stmt::placeholder{color:var(--far)}
  .phases{display:flex;gap:5px;align-items:center;flex:none;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
  .ph{font-size:10.5px;color:var(--far);cursor:pointer;padding:2px 6px;border-radius:8px;
    transition:.2s;white-space:nowrap}
  .ph:hover{color:var(--dim)}
  .ph.on{color:var(--cy);text-shadow:0 0 14px rgba(95,201,232,.7)}
  .ph.done{color:rgba(126,232,162,.55)}

  #hBot{left:0;right:0;bottom:0;padding:14px 22px;display:flex;gap:16px;align-items:flex-end}
  #diag{flex:1;font-size:11.5px;color:var(--far);line-height:1.75;max-width:900px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 0 16px rgba(3,5,12,.95)}
  #diag b{color:var(--dim)} #diag .w{color:var(--gd)} #diag .b{color:var(--rd)} #diag .o{color:var(--gr)}
  .zoomui{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--far);flex:none}
  .zoomui b{cursor:pointer;font-weight:400;padding:2px 5px;border-radius:6px}
  .zoomui b:hover{color:var(--cy)}
  .tips{position:fixed;right:22px;bottom:52px;text-align:right;z-index:10;font-size:11px;color:rgba(95,106,134,.85);
    line-height:1.9;text-shadow:0 0 14px rgba(3,5,12,.95);
    max-height:20px;overflow:hidden;opacity:.55;transition:max-height .3s,opacity .3s}
  .tips:hover{max-height:200px;opacity:1}
  .tips b{color:rgba(147,160,189,.95);font-weight:400}
  .tips kbd{font-family:ui-monospace,monospace;color:var(--dim);font-size:10.5px}

  /* ---------- 环形菜单 ---------- */
  #ring{position:fixed;z-index:40;display:none;width:0;height:0}
  #ring.on{display:block}
  #ring .rb{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    background:radial-gradient(circle,rgba(10,16,32,.97),rgba(6,10,22,.92));
    box-shadow:0 0 0 1px rgba(140,160,210,.16),0 10px 30px -14px #000;
    transition:transform .16s cubic-bezier(.2,1.4,.4,1),box-shadow .16s;animation:pop .2s backwards}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
  #ring .rb:hover{box-shadow:0 0 0 1px rgba(95,201,232,.7),0 0 26px -4px rgba(95,201,232,.6);
    transform:translate(-50%,-50%) scale(1.14)}
  #ring .rb i{font-style:normal;font-size:15px;line-height:1}
  #ring .rb u{text-decoration:none;font-size:8.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
  #ring .rb:hover u{color:var(--ink)}

  /* ---------- 就地编辑 ---------- */
  #edit{position:fixed;z-index:50;display:none;background:rgba(6,10,22,.96);border:0;outline:none;
    color:#fff;font:inherit;resize:none;border-radius:10px;padding:9px 12px;line-height:1.5;
    box-shadow:0 0 0 1px rgba(95,201,232,.55),0 0 40px -6px rgba(95,201,232,.45)}
  #edit.on{display:block}
  #edit{-webkit-user-select:text;user-select:text}

  /* ---------- iPad 触控条：无框，只有字 ---------- */
  #tbar{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));z-index:45;display:none;
    gap:18px;align-items:flex-end;transform:translateX(-50%)}
  html.touch #tbar{display:flex}
  #tbar.shift{transform:translateX(-50%) translateX(-168px)}
  #tbar b{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;
    font-weight:400;color:var(--far);cursor:pointer;transition:color .18s,text-shadow .18s;
    -webkit-user-select:none;user-select:none}
  #tbar b i{font-style:normal;font-size:19px;line-height:1;text-shadow:0 0 20px rgba(3,5,12,.95)}
  #tbar b u{text-decoration:none;font-size:8.5px;letter-spacing:.05em;white-space:nowrap}
  #tbar b.on,#tbar b:active{color:var(--cy);text-shadow:0 0 16px rgba(95,201,232,.75)}
  html.touch #hBot{padding-bottom:max(14px,env(safe-area-inset-bottom))}
  html.touch #hTop{padding-top:max(18px,env(safe-area-inset-top))}
  html.touch #ring .rb{width:60px;height:60px}
  html.touch #ring .rb i{font-size:17px}
  html.touch #ring .rb u{font-size:9px}

  /* ---------- 命令面板 / 提问 / 模型 ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
    padding:14vh 20px;background:rgba(2,4,10,.7);backdrop-filter:blur(10px)}
  .sheet.on{display:flex}
  .sheet .in{width:100%;max-width:660px}
  .sheet input{width:100%;background:none;border:0;border-bottom:1px solid rgba(140,160,210,.22);
    outline:none;color:#fff;font:inherit;font-size:19px;padding:6px 2px 12px;
    font-family:"Songti SC",Georgia,serif;letter-spacing:.06em}
  .sheet input::placeholder{color:var(--far)}
  .sheet .li{max-height:56vh;overflow-y:auto;margin-top:6px}
  .sheet .li::-webkit-scrollbar{width:4px}
  .sheet .li::-webkit-scrollbar-thumb{background:rgba(140,160,210,.25);border-radius:9px}
  .sheet .it{padding:9px 4px;cursor:pointer;display:flex;gap:12px;align-items:baseline;border-radius:8px}
  .sheet .it:hover,.sheet .it.k{background:rgba(95,201,232,.09)}
  .sheet .it .nm{font-size:14px;color:var(--ink);flex:none}
  .sheet .it .ky{font-family:ui-monospace,monospace;font-size:10px;color:var(--far);flex:none;min-width:26px}
  .sheet .it .de{font-size:11.5px;color:var(--far);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .it .tg{font-size:9.5px;color:var(--cy);flex:none}
  .sheet .src{font-size:11px;color:var(--far);margin-top:14px;line-height:1.8;border-top:1px solid rgba(140,160,210,.14);padding-top:10px}
  .sheet .src b{color:var(--dim);font-weight:400}

  /* ---------- 提问星弹出 ---------- */

  /* ---------- 模式切换 ---------- */
  .modes{display:flex;gap:3px;flex:none;align-items:center}
  .modes span{font-size:11.5px;color:var(--far);cursor:pointer;padding:3px 11px;border-radius:99px;transition:.2s}
  .modes span:hover{color:var(--dim)}
  .modes span.on{color:var(--cy);background:rgba(95,201,232,.12);
    box-shadow:0 0 18px -6px rgba(95,201,232,.8)}

  /* ---------- 新手面板（左上那个框） ---------- */
  #panel{position:fixed;left:20px;top:74px;z-index:30;width:246px;display:none;
    border-radius:14px;background:rgba(6,10,22,.9);backdrop-filter:blur(12px);
    box-shadow:0 0 0 1px rgba(140,160,210,.14),0 24px 60px -30px #000;
    max-height:calc(100vh - 140px);overflow-y:auto}
  #panel.on{display:block}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:rgba(140,160,210,.25);border-radius:9px}
  #panel h4{font-size:10px;letter-spacing:.22em;color:var(--far);padding:13px 15px 7px;font-weight:400}
  #panel .sec{padding:0 15px 12px}
  #panel .close{position:absolute;right:10px;top:10px;font-size:11px;color:var(--far);cursor:pointer}
  #panel .close:hover{color:var(--ink)}
  .chip2{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;cursor:grab;
    margin-bottom:5px;transition:.15s;background:rgba(255,255,255,.02)}
  .chip2:hover{background:rgba(95,201,232,.10)}
  .chip2:active{cursor:grabbing}
  .chip2 u{width:11px;height:11px;border-radius:99px;flex:none;text-decoration:none}
  .chip2 b{font-size:12.5px;font-weight:400;color:var(--ink)}
  .chip2 i{font-style:normal;font-size:10px;color:var(--far);margin-left:auto;
    font-family:ui-monospace,monospace}
  .lg{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:11px;color:var(--dim);line-height:1.55}
  .lg em{font-style:normal;flex:none;width:26px;text-align:center;color:var(--cy);font-size:12px}
  .lg span{flex:1}
  .kb{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:5px}
  .kb u{text-decoration:none;font-family:ui-monospace,monospace;color:var(--far);font-size:10.5px}
  #drag{position:fixed;z-index:70;pointer-events:none;display:none;font-size:13px;
    padding:6px 12px;border-radius:9px;background:rgba(6,10,22,.95);
    box-shadow:0 0 22px -6px rgba(95,201,232,.7)}


  /* ---------- 动画文稿按钮 ---------- */
  .playbtn{flex:none;font-size:11.5px;color:var(--gd);cursor:pointer;padding:3px 12px;
    border-radius:99px;background:rgba(232,184,74,.12);transition:.2s;white-space:nowrap}
  .playbtn:hover{background:rgba(232,184,74,.24);color:#fff;
    box-shadow:0 0 20px -6px rgba(232,184,74,.9)}

  /* ---------- 右上角 ☰ 与保存列表 ---------- */
  .burger{flex:none;cursor:pointer;width:26px;height:20px;display:flex;flex-direction:column;
    justify-content:center;gap:5px;padding-top:4px}
  .burger u{display:block;height:1.4px;background:rgba(147,160,189,.85);border-radius:9px;
    transition:.2s;text-decoration:none}
  .burger:hover u{background:var(--cy);box-shadow:0 0 10px rgba(95,201,232,.8)}

  /* ── 右侧笔记栏（点一颗星就出来） ── */
  #np{position:fixed;right:0;top:0;bottom:0;z-index:61;width:320px;display:none;
    flex-direction:column;background:rgba(6,10,20,.93);backdrop-filter:blur(16px);
    border-left:1px solid rgba(140,160,210,.14);box-shadow:-30px 0 80px -40px #000}
  #np.on{display:flex}
  #np .hd{padding:16px 18px 12px;border-bottom:1px solid rgba(140,160,210,.12)}
  #np .kd{font-size:10px;letter-spacing:.22em;color:var(--far);margin-bottom:6px}
  #np .tt{font-size:15px;line-height:1.5;color:var(--ink);word-break:break-word;font-weight:600}
  #np .sec{padding:14px 18px 0}
  #np .lb{font-size:10px;letter-spacing:.22em;color:var(--far);margin-bottom:8px}
  #np .fs{display:flex;gap:6px}
  #np .fs b{flex:1;text-align:center;padding:6px 0;border-radius:8px;cursor:pointer;font-weight:400;
    border:1px solid rgba(140,160,210,.16);color:var(--far);transition:.15s}
  #np .fs b:nth-child(1){font-size:10px}#np .fs b:nth-child(2){font-size:12px}
  #np .fs b:nth-child(3){font-size:14px}#np .fs b:nth-child(4){font-size:16px}
  #np .fs b:nth-child(5){font-size:19px}
  #np .fs b:hover{color:var(--ink);border-color:rgba(140,160,210,.4)}
  #np .fs b.on{color:#fff;border-color:var(--cy);background:rgba(95,201,232,.14)}
  #np .cw{display:flex;flex-wrap:wrap;gap:7px}
  #np .cw i{width:24px;height:24px;border-radius:50%;cursor:pointer;font-style:normal;
    border:1px solid rgba(255,255,255,.14);transition:.15s;display:block}
  #np .cw i:hover{transform:scale(1.14)}
  #np .cw i.on{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
  #np .cw i.auto{background:repeating-linear-gradient(45deg,#2a3450 0 5px,#3d4a6b 5px 10px);
    font-size:9px;color:#aab;line-height:24px;text-align:center}
  #np .nt{flex:1;display:flex;flex-direction:column;padding:14px 18px 18px;min-height:0}
  #np textarea{flex:1;width:100%;min-height:140px;resize:none;border-radius:10px;padding:11px 12px;
    border:1px solid rgba(140,160,210,.16);background:rgba(3,6,14,.7);color:var(--ink);
    font:13px/1.8 -apple-system,"PingFang SC",sans-serif;outline:none}
  #np textarea:focus{border-color:rgba(95,201,232,.5)}
  #np .ft{padding:0 18px 14px;font-size:10.5px;color:var(--far)}
  #np .x{position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;
    cursor:pointer;color:var(--far);font-size:15px;line-height:24px;text-align:center}
  #np .x:hover{color:var(--ink);background:rgba(140,160,210,.14)}
  #files{position:fixed;right:18px;top:60px;z-index:62;width:308px;display:none;
    border-radius:14px;background:rgba(6,10,22,.96);backdrop-filter:blur(14px);
    box-shadow:0 0 0 1px rgba(140,160,210,.16),0 26px 70px -30px #000;
    max-height:calc(100vh - 96px);overflow-y:auto;animation:fade .22s}
  #files.on{display:block}
  #files::-webkit-scrollbar{width:4px}
  #files::-webkit-scrollbar-thumb{background:rgba(140,160,210,.25);border-radius:9px}
  #files h4{font-size:10px;letter-spacing:.22em;color:var(--far);padding:14px 16px 8px;font-weight:400}
  #files .act{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;font-size:13px;
    color:var(--ink);transition:.15s}
  #files .act:hover{background:rgba(95,201,232,.1)}
  #files .act em{font-style:normal;color:var(--cy);font-size:14px;width:18px;text-align:center}
  #files .sp{height:1px;background:rgba(140,160,210,.12);margin:6px 0}
  #files .row{display:flex;align-items:flex-start;gap:8px;padding:9px 16px;cursor:pointer;transition:.15s}
  #files .row:hover{background:rgba(95,201,232,.09)}
  #files .row.cur{background:rgba(95,201,232,.13);box-shadow:inset 2px 0 0 var(--cy)}
  #files .row .nm{flex:1;min-width:0;font-size:13px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #files .row .dt{font-size:10.5px;color:var(--far);margin-top:2px;font-family:ui-monospace,monospace}
  #files .row .ops{display:flex;gap:6px;opacity:0;transition:.15s;flex:none;padding-top:2px}
  #files .row:hover .ops{opacity:1}
  #files .row .ops b{font-size:11px;color:var(--far);font-weight:400;padding:1px 5px;border-radius:5px}
  #files .row .ops b:hover{color:#fff;background:rgba(95,201,232,.28)}
  /* ---------- 演示 ---------- */
  #demo{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:59;
    max-width:min(900px,90vw);text-align:center;display:none}
  #demo.on{display:block}
  #demo .say{font-family:"Songti SC",Georgia,serif;font-size:21px;letter-spacing:.05em;color:#fff;
    line-height:1.6;text-shadow:0 0 34px rgba(95,201,232,.65);min-height:34px}
  #demo .say b{color:var(--cy);font-weight:600}
  #demo .say i{font-style:normal;color:var(--gd)}
  #demo .ctl{margin-top:14px;display:flex;gap:14px;justify-content:center;align-items:center;
    font-size:12px;color:var(--far)}
  #demo .ctl b{cursor:pointer;font-weight:400;padding:4px 14px;border-radius:99px;
    background:rgba(95,201,232,.14);color:var(--cy)}
  #demo .ctl b:hover{background:rgba(95,201,232,.26)}
  #demo .ctl u{text-decoration:none;cursor:pointer}
  #demo .ctl u:hover{color:var(--dim)}
  #demo .pg{margin-top:9px;height:2px;background:rgba(140,160,210,.18);border-radius:9px;overflow:hidden}
  #demo .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pu));
    transition:width .4s cubic-bezier(.2,.8,.2,1)}
  /* ---------- 手把手引导（一次一句，做到了自己往下走） ---------- */
  #coach{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:58;
    max-width:min(720px,88vw);text-align:center;display:none}
  #coach.on{display:block;animation:rise .4s cubic-bezier(.2,.9,.3,1)}
  #coach .st{font-family:"Songti SC",Georgia,serif;font-size:20px;letter-spacing:.05em;
    color:#fff;line-height:1.6;text-shadow:0 0 30px rgba(95,201,232,.65)}
  #coach .st b{color:var(--cy);font-weight:600}
  #coach .why{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}
  #coach .bar{margin-top:12px;display:flex;gap:16px;justify-content:center;align-items:center;
    font-size:11.5px;color:var(--far)}
  #coach .bar b{cursor:pointer;font-weight:400;padding:3px 12px;border-radius:99px;
    background:rgba(95,201,232,.12);color:var(--cy)}
  #coach .bar b:hover{background:rgba(95,201,232,.22)}
  #coach .bar i{font-style:normal;cursor:pointer}
  #coach .bar i:hover{color:var(--dim)}
  #coach .dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
  #coach .dots u{width:5px;height:5px;border-radius:99px;background:rgba(140,160,210,.28);text-decoration:none}
  #coach .dots u.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}

  #askbox{position:fixed;z-index:55;left:50%;bottom:16vh;transform:translateX(-50%);
    max-width:640px;text-align:center;display:none;pointer-events:none}
  #askbox.on{display:block;animation:rise .4s cubic-bezier(.2,.9,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(14px)}}
  #askbox .q{font-family:"Songti SC",Georgia,serif;font-size:23px;letter-spacing:.06em;color:#fff;
    line-height:1.5;text-shadow:0 0 34px rgba(95,201,232,.6)}
  #askbox .s{font-size:11px;color:var(--far);margin-top:9px}

  /* ---- iPad / 触屏适配 ---- */
  @media(max-width:1100px){
    #hTop{padding:14px 16px;gap:12px;flex-wrap:wrap}
    #hTop h1{font-size:16px;letter-spacing:.1em}
    #stmt{font-size:14px;height:38px;min-width:180px}
    .phases{max-width:100%;flex:1 1 100%;justify-content:flex-start;gap:4px}
    .ph{font-size:12px;padding:6px 10px}
    #hBot{padding:12px 16px;gap:10px}
    #diag{font-size:12px}
    #panel{left:12px;top:96px;width:min(246px,42vw)}
    #np{width:min(320px,84vw)}
    #files{right:12px;width:min(308px,84vw)}
  }
  @media(pointer:coarse){
    .ph,.zoomui b{min-height:32px;display:inline-flex;align-items:center}
    button,.btn{min-height:36px}
  }
</style>

<canvas id="sky"></canvas>

<div class="hud" id="hTop">
  <h1 id="title" title="点击切换题目 / 新建题目">解题宇宙</h1>
  <div class="modes" id="modes"></div>
  <span class="playbtn" id="playbtn" onclick="demoPick()">▶ 动画文稿</span>
  <a href="models.html" style="color:rgba(95,201,232,.75);text-decoration:none;font-size:11.5px;flex:none;padding-top:6px">◈ 136 个模型</a>
  <textarea id="stmt" placeholder="题面写在这里。第一步只做一件事：一句话说清「给了什么、要什么」。"></textarea>
  <div class="phases" id="phases"></div>
  <div class="burger" id="burger" title="保存的思维导图"><u></u><u></u><u></u></div>
</div>
<div id="files"></div>
<div id="np">
  <div class="x" onclick="npClose()">×</div>
  <div class="hd"><div class="kd" id="npk"></div><div class="tt" id="npt"></div></div>
  <div class="sec"><div class="lb">字号</div>
    <div class="fs" id="npfs"><b data-w="1">小</b><b data-w="2">·</b><b data-w="3">中</b><b data-w="4">·</b><b data-w="5">大</b></div></div>
  <div class="sec"><div class="lb">颜色</div><div class="cw" id="npc"></div></div>

<!--BB-START-->
<script>
/* ══════════════════════════════════════════════════════════════
   黑板 · 每个思维模型一块无限延展的板子
   Pencil 写字画画 · 手指平移缩放 · 拖入图片/视频 · 拖角调大小
   存在 IndexedDB（同一个域名下，两个页面共享同一块板）
   ────────────────────────────────────────────────────────────── */
(function(){
if(window.BB)return;

/* ---------- 存储 ---------- */
const DBN='bb1';
let dbp=null;
function db(){
  if(!dbp)dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('boards'))d.createObjectStore('boards',{keyPath:'id'});
      if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
function req(store,mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), q=fn(t.objectStore(store));
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  }));
}
const dbGet=(s,k)=>req(s,'readonly',o=>o.get(k));
const dbPut=(s,v)=>req(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>req(s,'readwrite',o=>o.delete(k));
const dbAll=(s)=>req(s,'readonly',o=>o.getAll());

const slug=s=>String(s||'').trim().replace(/\s+/g,'').toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,10)+(seq++);
let seq=0;

/* ---------- 状态 ---------- */
let B=null;                       /* 当前板 */
let root=null, world=null, ink=null, stage=null;
let cam={x:0,y:0,z:1};
let tool='pen';
let pen={c:'#e8edf9',w:2.2};
let selId=null;
const els=new Map();              /* itemId -> dom */
const urls=new Map();             /* blobId -> objectURL */
let undoStack=[], saveT=null;

const PENS=[['#e8edf9','白'],['#5fc9e8','青'],['#e8b84a','金'],['#c78ef0','紫'],['#7ee8a2','绿'],['#f08e8e','红']];
const WIDTHS=[1.4,2.2,4,8];

/* ---------- 样式 ---------- */
const CSS=`
.bbroot{position:fixed;inset:0;z-index:9000;background:#070a12;color:#e8edf9;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.bbstage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.bbroot[data-tool="move"] .bbstage{cursor:default}
.bbworld{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.bbink{position:absolute;left:0;top:0;width:1px;height:1px;
  pointer-events:none;overflow:visible;z-index:5000}
.bbroot[data-tool="pen"] .bbitem,.bbroot[data-tool="erase"] .bbitem{pointer-events:none}
.bbgo{cursor:pointer;color:#5f6a86;letter-spacing:.04em}
.bbgo:hover,.bbgo:active{color:#5fc9e8}
.bbitem{position:absolute;border-radius:10px;outline:0;
  box-shadow:0 0 0 0 rgba(95,201,232,0)}
.bbitem>.c{width:100%;height:100%;pointer-events:none;border-radius:10px;overflow:hidden;display:block}
.bbitem.sel{box-shadow:0 0 0 1.5px rgba(95,201,232,.85)}
.bbitem.sel>.c{pointer-events:auto}
.bbitem video,.bbitem img,.bbitem iframe{width:100%;height:100%;display:block;border:0;
  border-radius:10px;background:#0b1020;object-fit:contain}
.bbitem .txt{width:100%;height:100%;padding:8px 10px;font-size:17px;line-height:1.6;
  color:#e8edf9;outline:0;overflow:hidden;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text}
.bbitem .txt:empty:before{content:attr(data-ph);color:#5f6a86}
.bbh{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;
  display:none;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;
  transform-origin:50% 50%}
.bbh:after{content:'';width:11px;height:11px;border-radius:50%;
  background:#5fc9e8;box-shadow:0 0 12px rgba(95,201,232,.7)}
.bbitem.sel .bbh{display:flex}
.bbh.nw{left:0;top:0;cursor:nwse-resize}.bbh.ne{left:100%;top:0;cursor:nesw-resize}
.bbh.sw{left:0;top:100%;cursor:nesw-resize}.bbh.se{left:100%;top:100%;cursor:nwse-resize}
.bbgrip{position:absolute;left:50%;top:0;transform:translate(-50%,-135%);display:none;
  gap:12px;align-items:center;pointer-events:auto;touch-action:none;white-space:nowrap;
  font-size:12px;color:#93a0bd;cursor:grab;transform-origin:50% 100%}
.bbitem.sel .bbgrip{display:flex}
.bbgrip b{font-weight:400;cursor:pointer;padding:0 2px}
.bbgrip b:active{color:#5fc9e8}

.bbui{position:fixed;z-index:9010}
.bbtop{left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 20px 0;
  display:flex;gap:16px;align-items:center;pointer-events:none}
.bbtop *{pointer-events:auto}
.bbtop h2{font-family:"Songti SC","STSong",Georgia,serif;font-size:17px;font-weight:600;
  letter-spacing:.1em;color:rgba(232,237,249,.92);flex:none}
.bbtop .sub{font-size:11px;color:#5f6a86;flex:1}
.bbtop .x{font-size:12px;color:#93a0bd;cursor:pointer;flex:none}
.bbtop .x:active{color:#5fc9e8}
.bbbar{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:16px;align-items:flex-end}
.bbbar b{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;
  font-weight:400;color:#5f6a86;cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:color .16s,text-shadow .16s}
.bbbar b i{font-style:normal;font-size:19px;line-height:1}
.bbbar b u{text-decoration:none;font-size:8.5px;letter-spacing:.05em;white-space:nowrap}
.bbbar b.on,.bbbar b:active{color:#5fc9e8;text-shadow:0 0 16px rgba(95,201,232,.75)}
.bbpal{left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:none;gap:14px;align-items:center}
.bbpal.on{display:flex}
.bbpal s{width:22px;height:22px;border-radius:50%;cursor:pointer;text-decoration:none;
  box-shadow:0 0 0 1px rgba(140,160,210,.25) inset;transition:transform .14s}
.bbpal s.on{transform:scale(1.28);box-shadow:0 0 0 1.5px #fff inset,0 0 14px rgba(255,255,255,.35)}
.bbpal em{width:1px;height:20px;background:rgba(140,160,210,.22)}
.bbpal q{cursor:pointer;quotes:none;display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;opacity:.5;transition:opacity .14s}
.bbpal q.on{opacity:1}
.bbpal q:before{content:'';border-radius:50%;background:#e8edf9;
  width:var(--d);height:var(--d)}
.bbzoom{right:20px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;
  align-items:center;font-size:11px;color:#5f6a86}
.bbzoom b{cursor:pointer;font-weight:400;padding:2px 5px}
.bbzoom b:active{color:#5fc9e8}
.bbask{position:fixed;inset:0;z-index:9020;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,12,.72);backdrop-filter:blur(8px)}
.bbask.on{display:flex}
.bbask .in{width:min(520px,86vw);display:flex;flex-direction:column;gap:14px}
.bbask .q{font-size:13px;color:#93a0bd}
.bbask input{background:none;border:0;border-bottom:1px solid rgba(140,160,210,.3);outline:0;
  color:#fff;font:inherit;font-size:17px;padding:8px 2px}
.bbask .row{display:flex;gap:20px;font-size:12px;color:#93a0bd}
.bbask .row b{font-weight:400;cursor:pointer}
.bbask .row b:active{color:#5fc9e8}
.bbtip{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:9015;
  font-size:12px;color:#93a0bd;opacity:0;transition:opacity .3s;pointer-events:none;
  text-shadow:0 0 14px rgba(3,5,12,.9)}
.bbtip.on{opacity:1}
.bbentry{cursor:pointer;font-size:11px;color:#5f6a86;letter-spacing:.04em}
.bbentry:active,.bbentry:hover{color:#5fc9e8}
`;

function css(){
  if(document.getElementById('bbcss'))return;
  const s=document.createElement('style');s.id='bbcss';s.textContent=CSS;
  document.head.appendChild(s);
}

/* ---------- 坐标 ---------- */
const s2w=(sx,sy)=>({x:(sx-cam.x)/cam.z,y:(sy-cam.y)/cam.z});
function applyCam(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  root.style.setProperty('--iz',1/cam.z);
  els.forEach(el=>{
    el.querySelectorAll('.bbh,.bbgrip').forEach(h=>{h.style.transform=
      h.classList.contains('bbgrip')?`translate(-50%,-135%) scale(${1/cam.z})`:`scale(${1/cam.z})`});
  });
  const z=document.getElementById('bbzl'); if(z)z.textContent=Math.round(cam.z*100)+'%';
}
function zoomAt(sx,sy,k){
  const p=s2w(sx,sy);
  cam.z=Math.max(.12,Math.min(6,cam.z*k));
  cam.x=sx-p.x*cam.z; cam.y=sy-p.y*cam.z;
  applyCam();queue();
}

/* ---------- 存 ---------- */
function queue(){clearTimeout(saveT);saveT=setTimeout(flush,420)}
function flush(){
  if(!B)return;
  if(!B.items.length&&!B.strokes.length&&!B.saved)return;   /* 空板子不留痕 */
  B.saved=1;
  B.cam={x:cam.x,y:cam.y,z:cam.z}; B.updated=Date.now();
  dbPut('boards',B).catch(e=>tip('存档失败：'+e.message));
}
function snap(){
  undoStack.push(JSON.stringify({items:B.items,strokes:B.strokes}));
  if(undoStack.length>40)undoStack.shift();
}
function undo(){
  const s=undoStack.pop(); if(!s)return tip('没有可撤销的了');
  const o=JSON.parse(s); B.items=o.items; B.strokes=o.strokes;
  redrawAll();queue();
}

/* ---------- 墨迹 ---------- */
function d2path(pts){
  if(pts.length<2)return `M${pts[0][0]} ${pts[0][1]} l0 0`;
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    d+=` Q${a[0]} ${a[1]} ${(a[0]+b[0])/2} ${(a[1]+b[1])/2}`;
  }
  const l=pts[pts.length-1]; d+=` L${l[0]} ${l[1]}`;
  return d;
}
function drawStroke(st){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d2path(st.pts));p.setAttribute('fill','none');
  p.setAttribute('stroke',st.c);p.setAttribute('stroke-width',st.w);
  p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
  p.dataset.id=st.id;
  ink.appendChild(p);return p;
}
function redrawAll(){
  ink.innerHTML='';B.strokes.forEach(drawStroke);
  els.forEach(el=>el.remove());els.clear();
  B.items.forEach(makeItem);
  selId=null;
}

/* ---------- 元素 ---------- */
function makeItem(it){
  const el=document.createElement('div');
  el.className='bbitem';el.dataset.id=it.id;
  const c=document.createElement('div');c.className='c';
  el.appendChild(c);
  ['nw','ne','sw','se'].forEach(k=>{
    const h=document.createElement('div');h.className='bbh '+k;h.dataset.h=k;el.appendChild(h)});
  const g=document.createElement('div');g.className='bbgrip';
  g.innerHTML='<span>✥ 拖我</span><b data-a="front">置顶</b><b data-a="del">删掉</b>';
  el.appendChild(g);
  world.appendChild(el);els.set(it.id,el);
  fillItem(it,el);posItem(it,el);
  return el;
}
function fillItem(it,el){
  const c=el.querySelector('.c');c.innerHTML='';
  if(it.type==='text'){
    const t=document.createElement('div');
    t.className='txt';t.setAttribute('data-ph','写点什么…');
    t.contentEditable='true';t.spellcheck=false;t.textContent=it.text||'';
    t.addEventListener('input',()=>{it.text=t.textContent;autoH(it,el);queue()});
    t.addEventListener('keydown',e=>{e.stopPropagation();
      if(e.key==='Escape'){e.preventDefault();t.blur();select(null)}});
    t.addEventListener('pointerdown',e=>e.stopPropagation());
    c.appendChild(t);
  }else if(it.type==='img'){
    const im=document.createElement('img');im.decoding='async';
    srcFor(it).then(u=>{im.src=u;
      im.onload=()=>{ if(!it.h||it.autofit){ it.h=it.w*(im.naturalHeight/im.naturalWidth||.62);
        it.autofit=false;posItem(it,el);queue() } }});
    c.appendChild(im);
  }else if(it.type==='video'){
    const v=document.createElement('video');
    v.controls=true;v.playsInline=true;v.preload='metadata';
    srcFor(it).then(u=>{v.src=u;
      v.onloadedmetadata=()=>{ if(it.autofit&&v.videoWidth){ it.h=it.w*(v.videoHeight/v.videoWidth);
        it.autofit=false;posItem(it,el);queue() } }});
    c.appendChild(v);
  }else if(it.type==='embed'){
    const f=document.createElement('iframe');
    f.src=it.url;f.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';
    f.setAttribute('allowfullscreen','');f.referrerPolicy='no-referrer';
    c.appendChild(f);
  }
}
function autoH(it,el){
  if(it.type!=='text')return;
  const t=el.querySelector('.txt'); if(!t)return;
  el.style.height='auto'; const h=Math.max(44,t.scrollHeight+2);
  it.h=h; el.style.height=h+'px';
}
function posItem(it,el){
  el.style.left=it.x+'px';el.style.top=it.y+'px';
  el.style.width=it.w+'px';
  el.style.height=(it.type==='text'?'auto':it.h+'px');
  el.style.zIndex=it.z||1;
  if(it.type==='text')autoH(it,el);
}
function srcFor(it){
  if(it.url)return Promise.resolve(it.url);
  if(urls.has(it.blobId))return Promise.resolve(urls.get(it.blobId));
  return dbGet('blobs',it.blobId).then(r=>{
    if(!r)return '';
    const u=URL.createObjectURL(r.blob);urls.set(it.blobId,u);return u;
  });
}
function select(id){
  if(selId&&els.get(selId))els.get(selId).classList.remove('sel');
  selId=id;
  if(id&&els.get(id)){els.get(id).classList.add('sel');applyCam()}
}
function addItem(o){
  snap();
  const it=Object.assign({id:uid(),x:0,y:0,w:320,h:200,z:(B.items.length+1)},o);
  const k=B.items.length%7; it.x+=k*22; it.y+=k*22;      /* 别叠成一坨 */
  B.items.push(it);makeItem(it);queue();return it;
}
function delItem(id){
  const i=B.items.findIndex(x=>x.id===id); if(i<0)return;
  snap();
  const it=B.items[i];
  if(it.blobId)dbDel('blobs',it.blobId).catch(()=>{});
  B.items.splice(i,1);
  const el=els.get(id); if(el)el.remove(); els.delete(id);
  if(selId===id)selId=null;
  queue();
}
function centerWorld(){
  const s=s2w(innerWidth/2,innerHeight/2);return s;
}

/* ---------- 交互 ---------- */
const FG=new Map(); let pinch=null,tpan=null;
let drawing=null, dragging=null, resizing=null, lastTap=0,lastTX=0,lastTY=0;

function onDown(e){
  if(e.target.closest('.bbui,.bbask'))return;

  /* 手指：只管平移缩放 */
  if(e.pointerType==='touch'&&!e.target.closest('.bbh,.bbgrip')){
    e.preventDefault();
    FG.set(e.pointerId,{x:e.clientX,y:e.clientY});
    stage.setPointerCapture&&safeCapture(e);
    if(FG.size===1){tpan={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};pinch=null}
    else if(FG.size===2){
      tpan=null;const f=[...FG.values()];
      pinch={d:Math.hypot(f[0].x-f[1].x,f[0].y-f[1].y),
             mx:(f[0].x+f[1].x)/2,my:(f[0].y+f[1].y)/2};
    }
    return;
  }

  const hEl=e.target.closest('.bbh');
  if(hEl){                                     /* 拖角调大小 */
    const it=itemOf(hEl); if(!it)return;
    snap();
    resizing={it,k:hEl.dataset.h,w:it.w,h:it.h,x:it.x,y:it.y,
      start:s2w(e.clientX,e.clientY),ratio:(it.type==='text'?0:it.h/it.w)};
    safeCapture(e);e.preventDefault();return;
  }
  const gEl=e.target.closest('.bbgrip');
  if(gEl){
    const it=itemOf(gEl); if(!it)return;
    const a=e.target.dataset.a;
    if(a==='del'){delItem(it.id);return}
    if(a==='front'){snap();it.z=Math.max(...B.items.map(x=>x.z||1))+1;
      els.get(it.id).style.zIndex=it.z;queue();return}
    startDrag(it,e);e.preventDefault();return;
  }

  const iEl=e.target.closest('.bbitem');
  if(iEl&&tool==='move'){
    const it=itemOf(iEl);
    if(it.id!==selId){select(it.id);startDrag(it,e);e.preventDefault()}
    return;
  }

  /* 空白 */
  if(tool==='pen'){
    const w=s2w(e.clientX,e.clientY);
    snap();
    drawing={id:uid(),c:pen.c,w:pen.w,pts:[[w.x,w.y]]};
    drawing.el=drawStroke(drawing);
    safeCapture(e);e.preventDefault();return;
  }
  if(tool==='erase'){eraseAt(e.clientX,e.clientY);erasing=true;safeCapture(e);e.preventDefault();return}
  /* move 工具：点空白 = 取消选中；双击 = 新建文字 */
  select(null);
  const t=e.timeStamp;
  if(t-lastTap<360&&Math.hypot(e.clientX-lastTX,e.clientY-lastTY)<34){
    lastTap=0;newText(e.clientX,e.clientY);
  }else{lastTap=t;lastTX=e.clientX;lastTY=e.clientY}
}
let erasing=false;

function safeCapture(e){try{stage.setPointerCapture(e.pointerId)}catch(err){}}
function itemOf(el){const p=el.closest('.bbitem');return p?B.items.find(x=>x.id===p.dataset.id):null}

function startDrag(it,e){
  const w=s2w(e.clientX,e.clientY);
  snap();
  dragging={it,dx:it.x-w.x,dy:it.y-w.y};
  safeCapture(e);
}

function onMove(e){
  if(e.pointerType==='touch'&&FG.has(e.pointerId)){
    e.preventDefault();
    const p=FG.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
    if(FG.size>=2&&pinch){
      const f=[...FG.values()];
      const d=Math.hypot(f[0].x-f[1].x,f[0].y-f[1].y);
      const mx=(f[0].x+f[1].x)/2,my=(f[0].y+f[1].y)/2;
      if(pinch.d>4&&d>4)zoomAt(mx,my,d/pinch.d);
      cam.x+=mx-pinch.mx; cam.y+=my-pinch.my;
      pinch.d=d;pinch.mx=mx;pinch.my=my;applyCam();queue();
    }else if(tpan){
      cam.x=tpan.cx+(e.clientX-tpan.sx); cam.y=tpan.cy+(e.clientY-tpan.sy);
      applyCam();queue();
    }
    return;
  }
  if(drawing){
    const w=s2w(e.clientX,e.clientY);
    const l=drawing.pts[drawing.pts.length-1];
    if(Math.hypot(w.x-l[0],w.y-l[1])*cam.z<1.1)return;
    drawing.pts.push([w.x,w.y]);
    drawing.el.setAttribute('d',d2path(drawing.pts));
    return;
  }
  if(erasing){eraseAt(e.clientX,e.clientY);return}
  if(resizing){
    const w=s2w(e.clientX,e.clientY), r=resizing;
    const dx=w.x-r.start.x, dy=w.y-r.start.y, k=r.k;
    let nw=r.w+(k==='ne'||k==='se'?dx:-dx);
    let nh=r.h+(k==='sw'||k==='se'?dy:-dy);
    nw=Math.max(60,nw);
    if(r.ratio){nh=nw*r.ratio}else{nh=Math.max(44,nh)}
    r.it.w=nw;r.it.h=nh;
    r.it.x=(k==='nw'||k==='sw')?r.x+r.w-nw:r.x;
    r.it.y=(k==='nw'||k==='ne')?r.y+r.h-nh:r.y;
    posItem(r.it,els.get(r.it.id));
    return;
  }
  if(dragging){
    const w=s2w(e.clientX,e.clientY);
    dragging.it.x=w.x+dragging.dx; dragging.it.y=w.y+dragging.dy;
    posItem(dragging.it,els.get(dragging.it.id));
    return;
  }
}
function onUp(e){
  if(e.pointerType==='touch'&&FG.has(e.pointerId)){
    FG.delete(e.pointerId);
    if(FG.size<2)pinch=null;
    if(FG.size===1){const f=[...FG.values()][0];tpan={sx:f.x,sy:f.y,cx:cam.x,cy:cam.y}}
    if(FG.size===0)tpan=null;
    return;
  }
  if(drawing){
    if(drawing.pts.length>1){B.strokes.push({id:drawing.id,c:drawing.c,w:drawing.w,pts:drawing.pts})}
    else drawing.el.remove();
    drawing=null;queue();return;
  }
  if(erasing){erasing=false;queue();return}
  if(resizing){resizing=null;queue();return}
  if(dragging){dragging=null;queue();return}
}
function eraseAt(sx,sy){
  const w=s2w(sx,sy), r=14/cam.z;
  let hit=false;
  for(let i=B.strokes.length-1;i>=0;i--){
    const st=B.strokes[i];
    if(st.pts.some(p=>Math.abs(p[0]-w.x)<r&&Math.abs(p[1]-w.y)<r)){
      if(!hit)snap();
      const p=ink.querySelector(`path[data-id="${st.id}"]`); if(p)p.remove();
      B.strokes.splice(i,1);hit=true;
    }
  }
}

/* ---------- 新建 ---------- */
function newText(sx,sy){
  const w=s2w(sx===undefined?innerWidth/2:sx, sy===undefined?innerHeight/2:sy);
  const it=addItem({type:'text',text:'',x:w.x-140,y:w.y-24,w:280,h:44});
  const el=els.get(it.id);select(it.id);
  const t=el.querySelector('.txt');
  t.focus();
  const r=document.createRange();r.selectNodeContents(t);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
  return it;
}
function addFiles(files){
  const c=centerWorld();
  let n=0;
  [...files].forEach(f=>{
    const isV=/^video\//.test(f.type), isI=/^image\//.test(f.type);
    if(!isV&&!isI)return;
    const bid=uid();
    dbPut('blobs',{id:bid,blob:f,name:f.name}).then(()=>{
      const w=isV?420:320;
      addItem({type:isV?'video':'img',blobId:bid,autofit:true,
        x:c.x-w/2+n*26,y:c.y-120+n*26,w:w,h:isV?236:200});
      n++;
    }).catch(err=>tip('存不下：'+err.message));
  });
}
function embedURL(u){
  u=u.trim();let m;
  if(m=u.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/i))
    return 'https://player.bilibili.com/player.html?bvid='+m[1]+'&high_quality=1&danmaku=0&autoplay=0';
  if(m=u.match(/(?:youtube\.com\/watch\?[^ ]*v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/i))
    return 'https://www.youtube.com/embed/'+m[1];
  if(!/^https?:/i.test(u))u='https://'+u;
  return u;
}
function addEmbed(u){
  const c=centerWorld();
  addItem({type:'embed',url:embedURL(u),x:c.x-260,y:c.y-160,w:520,h:300});
}

/* ---------- 小提问框 ---------- */
function ask(q,ph){
  return new Promise(res=>{
    const box=document.getElementById('bbask');
    box.querySelector('.q').textContent=q;
    const inp=box.querySelector('input');inp.value='';inp.placeholder=ph||'';
    box.classList.add('on');setTimeout(()=>inp.focus(),40);
    const done=v=>{box.classList.remove('on');inp.onkeydown=null;res(v)};
    box.querySelector('[data-ok]').onclick=()=>done(inp.value.trim()||null);
    box.querySelector('[data-no]').onclick=()=>done(null);
    inp.onkeydown=e=>{e.stopPropagation();
      if(e.key==='Enter')done(inp.value.trim()||null);
      if(e.key==='Escape')done(null)};
  });
}
let tipT=null;
function tip(s){
  const t=document.getElementById('bbtip');if(!t)return;
  t.textContent=s;t.classList.add('on');
  clearTimeout(tipT);tipT=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ---------- 工具条 ---------- */
function setTool(t){
  tool=t;root.dataset.tool=t;
  [...document.querySelectorAll('.bbbar b[data-t]')].forEach(b=>
    b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('bbpal').classList.toggle('on',t==='pen');
  if(t!=='move')select(null);
}
function buildUI(name){
  root=document.createElement('div');root.className='bbroot';root.dataset.tool=tool;
  root.innerHTML=`
    <div class="bbstage"><div class="bbworld">
      <svg class="bbink"></svg>
    </div></div>
    <div class="bbui bbtop">
      <h2>${esc(name)}</h2>
      <div class="sub">Pencil 写 · 手指两指缩放 · 双击空白打字</div>
      <div class="x" id="bbclose">收起 ✕</div>
    </div>
    <div class="bbui bbpal" id="bbpal">
      ${PENS.map((p,i)=>`<s data-c="${p[0]}" style="background:${p[0]}" class="${i===0?'on':''}"></s>`).join('')}
      <em></em>
      ${WIDTHS.map((w,i)=>`<q data-w="${w}" style="--d:${Math.min(16,4+w*1.4)}px" class="${i===1?'on':''}"></q>`).join('')}
    </div>
    <div class="bbui bbbar">
      <b data-t="pen" class="on"><i>✎</i><u>写</u></b>
      <b data-t="erase"><i>⌫</i><u>擦</u></b>
      <b data-t="move"><i>✥</i><u>摆</u></b>
      <b data-a="text"><i>T</i><u>文字</u></b>
      <b data-a="file"><i>▣</i><u>图/片</u></b>
      <b data-a="link"><i>⛓</i><u>链接</u></b>
      <b data-a="undo"><i>↺</i><u>撤销</u></b>
      <b data-a="home"><i>⊙</i><u>回原点</u></b>
    </div>
    <div class="bbui bbzoom"><b data-a="zo">－</b><span id="bbzl">100%</span><b data-a="zi">＋</b></div>
    <div class="bbtip" id="bbtip"></div>
    <div class="bbask" id="bbask"><div class="in">
      <div class="q"></div><input spellcheck="false">
      <div class="row"><b data-ok>好</b><b data-no>算了</b></div>
    </div></div>
    <input type="file" id="bbfile" accept="image/*,video/*" multiple style="display:none">`;
  document.body.appendChild(root);
  stage=root.querySelector('.bbstage');
  world=root.querySelector('.bbworld');
  ink=root.querySelector('.bbink');

  stage.addEventListener('pointerdown',onDown);
  stage.addEventListener('pointermove',onMove,{passive:false});
  stage.addEventListener('pointerup',onUp);
  stage.addEventListener('pointercancel',onUp);
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    const unit=e.deltaMode===1?16:(e.deltaMode===2?innerHeight:1);
    if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*unit*0.0022));
    else{cam.x-=(e.shiftKey?e.deltaY:e.deltaX)*unit;cam.y-=(e.shiftKey?0:e.deltaY)*unit;applyCam();queue()}
  },{passive:false});

  root.querySelectorAll('.bbbar b[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
  root.querySelectorAll('.bbbar b[data-a]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='text'){setTool('move');newText()}
    if(a==='file')document.getElementById('bbfile').click();
    if(a==='link'){const u=await ask('贴一个视频链接（B站 / YouTube 都行）','https://www.bilibili.com/video/BV...');
      if(u){setTool('move');addEmbed(u)}}
    if(a==='undo')undo();
    if(a==='home'){cam={x:innerWidth/2,y:innerHeight/2,z:1};applyCam();queue()}
  });
  root.querySelectorAll('.bbzoom b').forEach(b=>b.onclick=()=>
    zoomAt(innerWidth/2,innerHeight/2,b.dataset.a==='zi'?1.3:1/1.3));
  root.querySelectorAll('.bbpal s').forEach(s=>s.onclick=()=>{
    pen.c=s.dataset.c;root.querySelectorAll('.bbpal s').forEach(o=>o.classList.remove('on'));
    s.classList.add('on')});
  root.querySelectorAll('.bbpal q').forEach(q=>q.onclick=()=>{
    pen.w=+q.dataset.w;root.querySelectorAll('.bbpal q').forEach(o=>o.classList.remove('on'));
    q.classList.add('on')});
  document.getElementById('bbclose').onclick=close;
  document.getElementById('bbfile').onchange=e=>{addFiles(e.target.files);e.target.value=''};

  root.addEventListener('paste',e=>{
    const f=[...(e.clipboardData&&e.clipboardData.files||[])];
    if(f.length){e.preventDefault();addFiles(f)}
  });
  ['dragover','drop'].forEach(t=>root.addEventListener(t,e=>{
    e.preventDefault();
    if(t==='drop'&&e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);
  }));
  root.addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.classList.contains('txt'))return;
    e.stopPropagation();
    if(e.key==='Escape'){selId?select(null):close();return}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
    if(e.key==='Backspace'||e.key==='Delete'){if(selId){e.preventDefault();delItem(selId)}return}
    if(e.key==='p')setTool('pen'); if(e.key==='e')setTool('erase'); if(e.key==='v')setTool('move');
    if(e.key==='t'){setTool('move');newText()}
  });
  root.tabIndex=-1;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 开 / 关 ---------- */
async function open(name,subtitle){
  if(root)close();
  css();
  const id=slug(name);
  let b=null;
  try{b=await dbGet('boards',id)}catch(e){tip('读不出存档：'+e.message)}
  B=b||{id,name,items:[],strokes:[],cam:{x:innerWidth/2,y:innerHeight/2,z:1},updated:Date.now()};
  B.name=name;
  B.items=B.items||[];B.strokes=B.strokes||[];
  undoStack=[];selId=null;els.clear();
  tool='pen';
  buildUI(subtitle?name+' · '+subtitle:name);
  setTool('pen');
  cam=Object.assign({x:innerWidth/2,y:innerHeight/2,z:1},B.cam||{});
  applyCam();
  B.strokes.forEach(drawStroke);
  B.items.forEach(makeItem);
  void root.offsetWidth;root.classList.add('on');root.focus();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(!B.items.length&&!B.strokes.length)
    tip('Pencil 直接写 · 双指缩放 · 底下「图/片」拖视频进来');
  return B;
}
function close(){
  flush();
  urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();
  if(root)root.remove();
  root=null;world=null;ink=null;stage=null;B=null;els.clear();
  FG.clear();pinch=null;tpan=null;drawing=null;dragging=null;resizing=null;erasing=false;
}

/* ---------- 入口小按钮 ---------- */
function entry(name,label){
  const s=document.createElement('span');
  s.className='bbentry';s.textContent=label||'▦ 黑板';
  s.onclick=e=>{e.stopPropagation();open(name)};
  return s;
}

window.BB={open,close,entry,list:()=>dbAll('boards'),slug};
})();

</script>

<script>
/* ══════════ 状态 ══════════ */
const KEY='polya.universe.v2';
function blank(name){return {name,stmt:'',phase:0,nodes:[],edges:[],seq:1,cam:{x:0,y:0,z:1},learn:''}}
let DB=null; try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(err){console.warn('存档读不出来，已重置',err)}
if(!DB||!DB.probs){DB={cur:0,probs:[blank('未命名')]}}
const P=()=>DB.probs[DB.cur];
let saveT=null;
function save(){
  try{const p=DB.probs[DB.cur];if(p){p.updatedAt=Date.now();if(!p.createdAt)p.createdAt=p.updatedAt}}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(DB)),260);
}

const N=()=>P().nodes, E=()=>P().edges;
const byId=id=>N().find(n=>n.id===id);
let sel=new Set(), hov=null, linkFrom=null, linkTo=null;

/* ══════════ 相机 ══════════ */
let cam={x:0,y:0,z:1}, camT={x:0,y:0,z:1};
function s2w(sx,sy){return{x:(sx-innerWidth/2)/cam.z+cam.x, y:(sy-innerHeight/2)/cam.z+cam.y}}
function w2s(wx,wy){return{x:(wx-cam.x)*cam.z+innerWidth/2, y:(wy-cam.y)*cam.z+innerHeight/2}}
function zoomAt(sx,sy,k){
  const p=s2w(sx,sy);
  const nz=Math.max(.04,Math.min(4,cam.z*k));
  cam.z=nz; camT.z=nz;
  const q=s2w(sx,sy);          /* 用新的 z 重算，光标下那一点才钉得住 */
  cam.x+=p.x-q.x; cam.y+=p.y-q.y;
  camT.x=cam.x; camT.y=cam.y;
}
function zoomBy(k){zoomAt(innerWidth/2,innerHeight/2,k)}
/* 星体被甩到极远时，把整张图等比收回来 —— 保持相对位置，只改尺度 */
function bbox(){
  const ns=N(); if(!ns.length)return null;
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  ns.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
function compact(force){
  const b=bbox(); if(!b)return false;
  const span=Math.max(b.w,b.h);
  if(!force&&span<=5200)return false;          /* 没跑飞就不动 */
  const k=2600/Math.max(span,1);
  N().forEach(n=>{
    n.x=(n.x-b.cx)*k; n.y=(n.y-b.cy)*k;
    n.hx=n.x; n.hy=n.y;
  });
  boxCache.clear();ghostDirty=true;save();
  return true;
}
/* 有没有两颗星叠在一起 */
function hasOverlap(){
  const ns=N();
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const A=nodeBox(ns[i]),B=nodeBox(ns[j]);
    if(Math.abs(A.x-B.x)<(A.w+B.w)/2+8&&Math.abs(A.y-B.y)<(A.h+B.h)/2+8)return true;
  }
  return false;
}
/* 新星落地时自动避让：沿螺旋往外找一个空位 */
function nudge(n){
  const pad=30, others=N().filter(m=>m!==n);
  const hit=()=>{
    const A=nodeBox(n);
    return others.some(m=>{const B=nodeBox(m);
      return Math.abs(A.x-B.x)<(A.w+B.w)/2+pad&&Math.abs(A.y-B.y)<(A.h+B.h)/2+pad});
  };
  if(!hit())return;
  const x0=n.x,y0=n.y;
  const step=Math.max(34,(nodeBox(n).w+nodeBox(n).h)/4);
  for(let k=1;k<=400;k++){
    const a=k*2.399963, r=step*Math.sqrt(k);    /* 黄金角螺旋，铺得均匀 */
    n.x=x0+Math.cos(a)*r; n.y=y0+Math.sin(a)*r;
    boxCache.delete(n.id);
    if(!hit())break;
  }
  n.hx=n.x;n.hy=n.y;
}

/* 逐对推开，直到任意两颗星的框都不重叠 */
function deoverlap(iters){
  const pad=30, ns=N();
  for(let it=0;it<(iters||400);it++){
    let moved=false;
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
      const a=ns[i],b=ns[j],A=nodeBox(a),B=nodeBox(b);
      const dx=b.x-a.x, dy=b.y-a.y;
      const ox=(A.w+B.w)/2+pad-Math.abs(dx);
      const oy=(A.h+B.h)/2+pad-Math.abs(dy);
      if(ox>0&&oy>0){
        moved=true;
        if(ox<oy){const t=(dx>=0?1:-1)*ox/2||ox/2; a.x-=t; b.x+=t}
        else     {const t=(dy>=0?1:-1)*oy/2||oy/2; a.y-=t; b.y+=t}
      }
    }
    if(!moved)break;
  }
  N().forEach(n=>{n.hx=n.x;n.hy=n.y});
  boxCache.clear();
  return !hasOverlap();      /* 真推开了才算成功 */
}
/* 保证不重叠：先温和推开，推不开就整个重排 */
function ensureNoOverlap(){
  if(!hasOverlap())return false;
  if(deoverlap(400))return true;
  ringLayout(); deoverlap(400);
  return true;
}
/* 一键整理：目标在中心，条件一圈，已知一圈，其余在外圈；再推开到互不重叠 */
function ringLayout(){        /* 横向分栏：从左往右读 —— 已知 → 条件 → 目标 → 辅助 → 结论 */
  const ns=N(); if(!ns.length)return;
  const cols=[
    ns.filter(n=>n.k==='data'||n.k==='given'),
    ns.filter(n=>n.k==='cond'),
    ns.filter(n=>n.k==='unknown'||n.k==='concl'),
    ns.filter(n=>n.k==='aux'||n.k==='lemma'||n.k==='locus'),
    ns.filter(n=>n.k==='result'||n.k==='idea'),
  ].filter(c=>c.length);
  const GAPX=150, GAPY=48, MAXH=760;
  /* 一栏太高就拆成并排的子栏 —— 保证整张图始终是横的 */
  const packs=[];
  cols.forEach(arr=>{
    const hs=arr.map(n=>nodeBox(n).h+GAPY);
    const th=hs.reduce((a,b)=>a+b,0);
    const k=Math.max(1,Math.ceil(th/MAXH));
    const per=Math.ceil(arr.length/k);
    for(let i=0;i<arr.length;i+=per)packs.push(arr.slice(i,i+per));
  });
  const W=packs.map(c=>Math.max(...c.map(n=>nodeBox(n).w)));
  let x=0;
  const xs=W.map(w=>{const cx=x+w/2; x+=w+GAPX; return cx});
  const totalW=x-GAPX;
  packs.forEach((arr,ci)=>{
    const hs=arr.map(n=>nodeBox(n).h+GAPY);
    const th=hs.reduce((a,b)=>a+b,0);
    let y=-th/2;
    arr.forEach((n,i)=>{
      n.x=xs[ci]-totalW/2;            /* 整体水平居中 */
      n.y=y+hs[i]/2;
      y+=hs[i];
      if(arr.length>3)n.x+=(i%2?1:-1)*18;   /* 轻微错开，线不挤成一束 */
    });
  });
  N().forEach(n=>{n.hx=n.x;n.hy=n.y});
  boxCache.clear();
}
function tidy(){
  if(!N().length)return;
  snap(); ringLayout(); deoverlap(400);
  save();fitAll();
  toast('整理好了','从左往右：已知 → 条件 → 目标 → 辅助/轨迹 → 结论；你摆的位置随时可以再改');
}
function viewRect(){          /* 真正能看见的那块：避开左面板、顶栏、底栏 */
  const pn=document.getElementById('panel');
  const L=(pn&&pn.classList.contains('on'))?(pn.getBoundingClientRect().right+26):24;
  const T=62, R=innerWidth-24, B=innerHeight-92;
  return {L,T,R,B,w:Math.max(200,R-L),h:Math.max(200,B-T),cx:(L+R)/2,cy:(T+B)/2};
}
function fitAll(){
  const ns=N(); if(!ns.length){camT={x:0,y:0,z:1};return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ns.forEach(n=>{const r=nodeBox(n);
    x0=Math.min(x0,r.x-r.w/2);x1=Math.max(x1,r.x+r.w/2);
    y0=Math.min(y0,r.y-r.h/2);y1=Math.max(y1,r.y+r.h/2)});
  const pad=90,w=x1-x0+pad*2,h=y1-y0+pad*2;
  const v=viewRect();
  camT.z=Math.max(.04,Math.min(2,Math.min(v.w/w,v.h/h)));
  const bcx=(x0+x1)/2, bcy=(y0+y1)/2;
  camT.x=bcx+(innerWidth/2 - v.cx)/camT.z;    /* 把图心对到可见区的中心 */
  camT.y=bcy+(innerHeight/2 - v.cy)/camT.z;
}

/* 星空：三层视差 */
let STAR=[];
function makeStars(){

/* ══════════ 节点几何 ══════════ */
const FS=[0,12,13.5,15.5,18,21.5];      /* 重要度 → 字号 */
const MAXW=[0,150,180,215,255,300];
function wrapText(t,fs,maxw){
  ctx.font=`${fs}px -apple-system,"PingFang SC",sans-serif`;
  const lines=[];let cur='';
  for(const ch of t){
    if(ch==='\n'){lines.push(cur);cur='';continue}
    if(ctx.measureText(cur+ch).width>maxw&&cur){lines.push(cur);cur=ch}
    else cur+=ch;
  }
  if(cur||!lines.length)lines.push(cur);
  return lines;
}
const boxCache=new Map();
function nodeBox(n){
  const key=n.w+'|'+(n.ms?n.ms.length:0)+'|'+(n.dof||0)+'|'+(n.eq||'')+'|'+n.t;
  const c=boxCache.get(n.id);
  if(c&&c.key===key){c.box.x=n.x;c.box.y=n.y;return c.box}
  const fs=FS[n.w], maxw=MAXW[n.w];
  const lines=wrapText(n.t||' ',fs,maxw);
  let w=0;ctx.font=`${fs}px -apple-system,"PingFang SC",sans-serif`;
  lines.forEach(l=>w=Math.max(w,ctx.measureText(l).width));
  const lh=fs*1.45;
  const extra=(n.ms&&n.ms.length?fs*1.1:0)+(n.dof?fs*.9:0)+(n.eq?fs*1.0:0);
  const box={x:n.x,y:n.y,w:Math.max(w,26)+30,h:lines.length*lh+22+extra,lines,fs,lh};
  boxCache.set(n.id,{key,box});
  return box;
}
function hit(wx,wy){
  const o=zOrder();
  for(let i=o.length-1;i>=0;i--){
    const n=o[i],b=nodeBox(n),zf=1+.09*(n.z||0);
    const r=rimW();
    if(cam.z<.34){                       /* 远景只剩光点：按屏幕上 20px 的圆来点 */
      if(Math.hypot(wx-b.x,wy-b.y)<20/cam.z)return n;
      continue;
    }
    if(Math.abs(wx-b.x)<b.w*zf/2+r&&Math.abs(wy-b.y)<b.h*zf/2+r)return n;
  }
  return null;
}

let T=0;
function draw(t){

  ctx.clearRect(0,0,Wd,Hd);

  /* —— 星云 —— */
  const neb=(x,y,r,col)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col);g.addColorStop(1,'rgba(3,5,12,0)');ctx.fillStyle=g;ctx.fillRect(0,0,Wd,Hd)};

  neb(Wd*.18-cam.x*.07*cam.z, Hd*.78-cam.y*.07*cam.z, dr*.62,'rgba(199,142,240,.05)');
  neb(Wd*.52-cam.x*.02*cam.z, Hd*1.1-cam.y*.02*cam.z, dr*.5, 'rgba(232,184,74,.022)');

  /* —— 星 —— */
  for(const s of STAR){
    const sx=(s.x-cam.x*s.d)*cam.z+Wd/2, sy=(s.y-cam.y*s.d)*cam.z+Hd/2;
    if(sx<-40||sx>Wd+40||sy<-40||sy>Hd+40)continue;

    ctx.fillStyle=s.h?`hsla(${s.h} 80% 82% / ${a})`:`rgba(232,237,249,${a})`;
    ctx.beginPath();ctx.arc(sx,sy,s.r*Math.max(.5,Math.min(1.6,cam.z)),0,6.2832);ctx.fill();
  }

  /* —— 连线 —— */
  DEG={}; E().forEach(e=>{DEG[e.a]=(DEG[e.a]||0)+1;DEG[e.b]=(DEG[e.b]||0)+1});
  E().forEach(e=>drawEdge(e));
  /* 正在连的线 */
  if(linkFrom){
    const a=w2s(linkFrom.x,linkFrom.y);

    const rc=(RELS[pendingRel]||RELS.bind).c;
    ctx.strokeStyle=`rgba(${rc},.9)`;ctx.lineWidth=1.8;ctx.setLineDash([3,5]);

    /* 手上那一端的光点 */
    ctx.fillStyle=`rgba(${rc},.9)`;ctx.beginPath();ctx.arc(b.x,b.y,3.4,0,6.2832);ctx.fill();

  }

  /* —— 该连却没连：共享同一个符号或词，画一条极淡的呼吸虚线，点一下就成真 —— */

  /* —— 卫星星云（同一个 host 的一撮，用一团雾表示"是一伙的"，没有任何框线） —— */
  drawHostNebula();
  /* —— 手绘墨迹 —— */
  drawInk();
  /* —— 节点：按深度排序，后面的先画 —— */
  if(ghostDirty||T-deadAt>400){deadAt=T;DEAD=deadSet()}
  HOSTS=new Set(); N().forEach(n=>{if(n.host)HOSTS.add(n.host)});
  LINKED=new Set(); E().forEach(e=>{LINKED.add(e.a);LINKED.add(e.b)});
  FSET=null;
  if(FOCUS){FSET=new Set([...sel]);
    E().forEach(e=>{if(sel.has(e.a))FSET.add(e.b);if(sel.has(e.b))FSET.add(e.a)})}
  SSET=null;
  if(SPOT){SSET=new Set();E().forEach(e=>{if(e.k===SPOT){SSET.add(e.a);SSET.add(e.b)}})}
  const order=zOrder();
  if(cam.z<.34){drawFarClusters(order);}

function edgePts(e){
  const a=byId(e.a),b=byId(e.b); if(!a||!b)return null;
  const A=w2s(a.x,a.y),B=w2s(b.x,b.y);
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  const cx=mx-dy/len*len*.13, cy=my+dx/len*len*.13;   /* 轻微弧线 */
  return {A,B,cx,cy,a,b};
}
function drawEdge(e){
  const p=edgePts(e); if(!p)return;
  const r=RELS[e.k]||RELS.bind;
  let dim=(p.a.cut||p.b.cut)?.28:1;
  if(SPOT&&e.k!==SPOT)dim*=.14;                       /* 关系聚光灯 */
  const picked=selE.has(e.id);
  const on=picked||sel.has(e.a)||sel.has(e.b)||hov===p.a||hov===p.b;
  ctx.strokeStyle=`rgba(${picked?lighten(r.c):r.c},${(picked?1:on?.85:.42)*dim})`;
  /* 远看时按度数加粗：枢纽自动浮出来 */
  const boost=cam.z<.6?(1+.4*Math.min(3,((DEG[e.a]||1)+(DEG[e.b]||1))-2)):1;
  ctx.lineWidth=(picked?3:on?2:1.25)*boost;
  ctx.setLineDash(r.dash&&r.dash.length?r.dash.map(v=>v*Math.max(.6,cam.z)):[]);
  ctx.beginPath();ctx.moveTo(p.A.x,p.A.y);ctx.quadraticCurveTo(p.cx,p.cy,p.B.x,p.B.y);ctx.stroke();
  ctx.setLineDash([]);
  /* 流动的光点 —— 方向感 */
  if(r.arrow&&!p.a.cut&&!p.b.cut){
    const u=((T/1400)+(e.id*.17))%1;
    const q=qpt(p.A,{x:p.cx,y:p.cy},p.B,u);
    ctx.fillStyle=`rgba(${r.c},.95)`;
    ctx.beginPath();ctx.arc(q.x,q.y,2.4*Math.max(.7,Math.min(1.4,cam.z)),0,6.2832);ctx.fill();
  }
  if(picked&&!e.label){        /* 选中但没标签：把关系名显出来，好知道选的是哪一条 */
    const q=qpt(p.A,{x:p.cx,y:p.cy},p.B,.5);
    ctx.font='11px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=`rgba(${lighten(r.c)},.95)`;
    ctx.shadowColor='rgba(3,5,12,.95)';ctx.shadowBlur=6;
    ctx.fillText(r.t,q.x,q.y);ctx.shadowBlur=0;
  }
  if(e.label&&cam.z>.5){
    const q=qpt(p.A,{x:p.cx,y:p.cy},p.B,.5);
    ctx.font=`${10.5*Math.min(1.3,Math.max(.8,cam.z))}px -apple-system,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=`rgba(${lighten(r.c)},${.92*dim})`;
    ctx.shadowColor='rgba(3,5,12,.95)';ctx.shadowBlur=6;
    ctx.fillText(e.label,q.x,q.y);ctx.shadowBlur=0;
  }
}
function qpt(A,C,B,u){const m=1-u;return{
  x:m*m*A.x+2*m*u*C.x+u*u*B.x, y:m*m*A.y+2*m*u*C.y+u*u*B.y}}


/* ══════════ ＋ 长出一颗子星 ══════════ */
/* 选中（或悬停）一颗星时，右边浮出一个 ＋。点它 = 长出一根线 + 一颗小星，直接打字 */
function plusOf(n){
  if(!n||editing||inkMode||mode==='link'||mode==='marq')return null;
  if(cam.z<.34)return null;
  const b=nodeBox(n), zf=1+.09*(n.z||0), S=w2s(b.x,b.y);

function plusTarget(){

}
function hitPlus(sx,sy){

let plusHot=false;

const PALETTE=[null,[95,201,232],[126,232,162],[232,184,74],[199,142,240],
