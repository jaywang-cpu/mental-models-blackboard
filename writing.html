<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>雅思写作</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000308">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--fg:#e8eef4;--dim:#6b7590;--line:rgba(255,255,255,.14);--ok:#7fd99a;--bad:#ff7b7b;--gold:#e9c46a;--blue:#8fb8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%;color:var(--fg);font-family:-apple-system,"PingFang SC",sans-serif;background:#000308}
body{background:radial-gradient(ellipse at 50% 0%,#0b1430 0%,#000308 60%) fixed}
#bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 10px;background:rgba(0,3,8,.92);backdrop-filter:blur(8px);z-index:5}
#bar b{font-size:14px;font-weight:600;letter-spacing:2px;margin-right:auto;white-space:nowrap}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap}
.btn:active{background:rgba(255,255,255,.18)}
.btn.on{border-color:var(--gold);color:var(--gold)}
#tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;position:sticky;top:calc(max(12px,env(safe-area-inset-top)) + 46px);background:rgba(0,3,8,.92);z-index:4}
main{max-width:640px;width:100%;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
h2{font-size:15px;color:var(--gold);margin:22px 0 8px;font-weight:600}
h2:first-child{margin-top:6px}
.note{font-size:12px;color:var(--dim);line-height:1.7;margin:4px 0 10px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.03);margin-bottom:8px;font-size:14px;line-height:1.65}
.box .k{color:var(--gold);font-weight:600;margin-right:6px}
.sk{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px;line-height:1.6}
.sk span:nth-child(odd){color:var(--gold)}
.s{border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;background:rgba(255,255,255,.03);cursor:pointer}
.s .id{font-size:11px;color:var(--dim)}
.s .en{font-size:15px;line-height:1.6;margin-top:2px}
.slot{color:var(--blue)}
.s .cn{font-size:12px;color:var(--dim);margin-top:3px}
.s .ex{display:none;font-size:13px;color:#c9d2e3;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}
.s.open .ex{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:#d6deeb}
.map{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.6}
.map b{font-weight:600}.map .t{display:inline-block;min-width:22px;text-align:center;border-radius:6px;background:rgba(233,196,106,.15);color:var(--gold);font-size:12px;margin-right:6px}
.map .r{color:#c9d2e3;font-size:12.5px}
.model p{font-size:14.5px;line-height:1.75;margin:0 0 10px}
.model code{font-size:10px;color:var(--gold);margin-left:2px}
/* 打字 */
.drill{border:1px solid var(--line);border-radius:18px;padding:18px 16px;background:rgba(255,255,255,.03)}
.drill .cue{font-size:16px;text-align:center}
.drill .fr{font-size:13px;color:var(--dim);text-align:center;margin-top:6px;line-height:1.6}
.big{width:64px;height:64px;border-radius:50%;font-size:24px;border:1px solid var(--line);background:rgba(233,196,106,.12);color:var(--gold);cursor:pointer}
textarea{width:100%;margin-top:14px;font-size:17px;line-height:1.5;padding:12px;border-radius:12px;border:1px solid var(--line);background:#050a18;color:var(--fg);font-family:inherit;resize:none;outline:none;min-height:110px}
textarea:focus{border-color:rgba(233,196,106,.6)}
.res{margin-top:12px;font-size:15px;line-height:1.7;min-height:40px}
.res .w{color:var(--bad);text-decoration:underline}
.res .m{color:var(--bad);opacity:.8}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--dim);margin:2px 0 12px}.stat em{font-style:normal;color:var(--fg)}
</style></head><body>
<div id="bar"><a class="btn" href="english.html">←</a><b>雅 思 写 作</b><a class="btn" href="spell.html">拼写</a></div>
<div id="tabs">
 <button class="btn on" data-t="drill">打字</button><button class="btn" data-t="t2">大作文模板</button><button class="btn" data-t="t1">小作文模板</button>
 <button class="btn" data-t="map">65 题</button><button class="btn" data-t="plan">6 天</button>
</div>
<main id="main"></main>
<script src="writing-data.js"></script>
<script>
const W=window.W,$=id=>document.getElementById(id),M=$('main');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const slot=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="slot">[$1]</span>');
const KEY='write-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.p=S.p||{};S.tab=S.tab||'t2';S.set=S.set||'all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const SALL=()=>Object.fromEntries([...W.T2_SENT,...W.T1_SENT].map(x=>[x[0],x]));
const RIDS=rows=>[...new Set(rows.flatMap(r=>r[1].match(/\b(?:I\d[a-f]?|B\d+|C\d|T\d+)\b/g)||[]))];
function goBtn(v){return `<button class="btn" data-go="${v}" style="padding:4px 10px;font-size:12px">⌨ 打字练这块</button>`}
function recipeBox(title,rows){const A=SALL();return `<div class="box"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span class="k">${esc(title)}</span>${goBtn('ids:'+RIDS(rows).join(','))}</div>${rows.map(r=>{const ids=(r[1].match(/\b(?:I\d[a-f]?|B\d+|C\d|T\d+)\b/g)||[]).filter(i=>A[i]);const lines=ids.map(i=>`<div style="margin:3px 0 0 0;font-size:13px;line-height:1.6;color:#c9d2e3"><span style="color:var(--dim);font-size:11px;margin-right:6px">${i}</span>${slot(A[i][2])}</div>`).join('');return `<div style="padding:6px 0;border-top:1px dashed var(--line)"><div style="display:flex;gap:10px"><span style="color:var(--dim);min-width:92px">${esc(r[0])}</span><span>${esc(r[1])}</span></div>${lines}</div>`}).join('')}</div>`}
function groups(G,S){return G.map(g=>`<div style="margin:14px 0 6px;font-size:13px"><b>${esc(g[0])}</b> <span style="color:var(--dim)">${esc(g[1])}</span></div>`+sentList(g[2].map(i=>S[i]))).join('')}
function sentList(arr){return arr.map(s=>`<div class="s" onclick="this.classList.toggle('open')"><div class="id">${s[0]} · ${esc(s[1])}</div><div class="en">${slot(s[2])}</div><div class="cn">${esc(s[3])}</div><div class="ex">例:${esc(s[4])}</div></div>`).join('')}
function skel(rows){return '<div class="box"><div class="sk">'+rows.map(r=>`<span>${esc(r[0])}<br><small style="color:var(--dim)">${esc(r[1])}</small></span><span>${esc(r[2])}</span>`).join('')+'</div></div>'}
function model(q,rows){let h=`<div class="note">${esc(q)}</div><div class="box model">`,cur=null,buf=[];
 rows.forEach(r=>{if(r[0]!==cur){if(buf.length)h+='<p>'+buf.join(' ')+'</p>';buf=[];cur=r[0]}buf.push(esc(r[2])+`<code>${esc(r[1])}</code>`)});
 return h+'<p>'+buf.join(' ')+'</p></div>'}

const views={
 t2(){const S=Object.fromEntries(W.T2_SENT.map(x=>[x[0],x]));return `
  <div class="note">考场上只做三件事:<b style="color:var(--fg)">认题型 → 照配方写 → 方括号里填题目的词</b></div>
  <h2>第 1 步 · 认题型</h2>${W.T2_TYPES.map(t=>`<div class="box"><span class="k">${t[0]} ${esc(t[1])}</span><span style="color:var(--dim);font-size:12.5px">${esc(t[2])}</span></div>`).join('')}
  <h2>第 2 步 · 照配方写</h2><div class="note">每种题型都是 4 段,编号对应第 3 步的句子</div>
  ${W.T2_TYPES.map(t=>recipeBox(t[0]+' '+t[1],W.T2_RECIPE[t[0]])).join('')}
  <h2>第 3 步 · 25 句</h2><div class="note">按段落位置分组 · 方括号换成题目里的词 · 点开看例句</div>${groups(W.T2_GROUPS,S)}
  <h2>想不出理由时</h2><div class="note">扫 6 个维度,挑最好举例的 2 个 · 每个维度挑 1 句,只填方括号,难词都已写好</div>
  ${W.T2_CHUNKS.map(d=>`<div class="box"><div style="display:flex;align-items:center;justify-content:space-between"><span class="k">${esc(d[0])}</span>${goBtn('dim:'+d[2])}</div>${d[1].map((p,i)=>`<div style="margin-top:8px;line-height:1.65">${i+1}. ${slot(p)}</div>`).join('')}</div>`).join('')}
  <div class="note" style="margin-top:12px">例子用自己的真实经历:</div>${W.T2_EXAMPLES.map(e=>`<div class="box"><span class="k">${esc(e[0])}</span>${esc(e[1])}</div>`).join('')}
  <h2>示范(只用上面的句子拼成)</h2><div style="margin:0 0 8px">${goBtn('model2')}</div>${model(W.T2_MODEL_Q,W.T2_MODEL)}
  <h2>5 条规则</h2><div class="box">${W.RULES_75.map((r,i)=>`${i+1}. ${esc(r)}`).join('<br>')}</div>`},
 t1(){const S=Object.fromEntries(W.T1_SENT.map(x=>[x[0],x]));return `
  <div class="note">三步:<b style="color:var(--fg)">认图 → 照配方写 → 换数字和名词</b> · 4 段:开头 1 句、概述 2 句(不写数字)、细节两段</div>
  <h2>第 1+2 步 · 认图,照配方写</h2>${W.T1_RECIPE.map(r=>recipeBox(r[0],r[1])).join('')}
  <h2>第 3 步 · 23 句</h2><div class="note">按图的种类分组 · 点开看例句</div>${groups(W.T1_GROUPS,S)}
  <h2>只背这些词</h2>${W.T1_WORDS.map(w=>`<div class="box"><span class="k">${esc(w[0])}</span>${esc(w[1])}</div>`).join('')}
  <h2>示范</h2><div style="margin:0 0 8px">${goBtn('model1')}</div>${model(W.T1_MODEL_Q,W.T1_MODEL)}`},
 map(){const T=Object.fromEntries(W.T2_TYPES.map(t=>[t[0],t[1]]));let cat='',h='<div class="note">每题:题型和立场 / 正文 1 / 正文 2 · 配方见「大作文模板」第 2 步</div>';
  W.T2_MAP.forEach(m=>{if(m[0]!==cat){cat=m[0];h+=`<h2>${esc(cat)}</h2>`}
   h+=`<div class="map"><b>${m[1]} · ${esc(m[2])}</b><br><span class="t">${m[3]}</span><span style="color:var(--gold);font-size:12.5px">${esc(T[m[3]])} · ${esc(m[4])}</span><div class="r">正文 1:${esc(m[5])}<br>正文 2:${esc(m[6])}</div></div>`});return h},
 plan(){return `<h2>6 天</h2>${W.PLAN.map(p=>`<div class="box"><span class="k">${esc(p[0])}</span>${esc(p[1])}</div>`).join('')}`},
 drill(){return `<div class="row" style="margin:4px 0 8px;justify-content:flex-start;flex-wrap:wrap;gap:6px">
   ${sb('all','全部 '+ALL.length)}${sb('t2','大作文')}${sb('t1','小作文')}${sb('chunk','理由句')}${sb('model2','示范·大作文')}${sb('model1','示范·小作文')}${sb('wrong','错句')}</div><div class="row" style="margin:0 0 8px;justify-content:flex-start;flex-wrap:wrap;gap:6px"><span style="color:var(--dim);font-size:12px;align-self:center">题型</span>${W.T2_TYPES.map(t=>sb('ids:'+RIDS(W.T2_RECIPE[t[0]]).join(','),t[0]+' '+t[1])).join('')}</div><div class="row" style="margin:0 0 10px;justify-content:flex-start;flex-wrap:wrap;gap:6px"><span style="color:var(--dim);font-size:12px;align-self:center">理由</span>${W.T2_CHUNKS.map(d=>sb('dim:'+d[2],d[0].split(' ')[0])).join('')}</div>
  <div class="stat" id="dstat"></div>
  <div class="drill"><div class="row" style="margin:0 0 12px"><button class="big" id="dPlay">▶</button><button class="btn" id="dSlow" style="align-self:center">慢速</button></div><div class="cue" id="cue"></div><div class="fr" id="fr"></div>
   <textarea id="ta" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="照句架整句打出来,[ ] 里填什么都行;示范作文要一字不差,回车检查"></textarea>
   <div class="res" id="dres"></div>
   <div class="row"><button class="btn" id="dChk">检查</button><button class="btn" id="dHint">偷看</button><button class="btn" id="dNext">跳过</button></div></div>
  <div class="note" style="text-align:center;margin-top:12px">打错的词标红,必须照着再打一遍才过;连续对 3 次算熟</div>`}
};

/* ---------- 打字背句 ---------- */
const _S2=Object.fromEntries(W.T2_SENT.map(x=>[x[0],x])),_S1=Object.fromEntries(W.T1_SENT.map(x=>[x[0],x]));
const mod=(rows,tag,S)=>rows.map((r,i)=>({id:tag+'-'+(i+1),use:r[0]+' · '+r[1],fr:r[2],cn:(S[r[1]]?S[r[1]][3]:'回扣句')+'  ('+r[0]+' · '+r[1]+')',ex:r[2],set:tag,idx:i}));
const ALL=[...W.T2_SENT.map(s=>({...arr(s),set:'t2'})),...W.T1_SENT.map(s=>({...arr(s),set:'t1'})),...W.T2_CHUNKS.flatMap(d=>d[3].map(s=>({...arr(s),set:'chunk',dim:d[2]}))),...mod(W.T2_MODEL,'model2',_S2),...mod(W.T1_MODEL,'model1',_S1)];
function inSet(x){const v=S.set;if(v==='all'||v==='wrong')return true;if(v==='t2'||v==='t1'||v==='chunk'||v==='model2'||v==='model1')return x.set===v;if(v==='model')return x.set==='model2'||x.set==='model1';if(v.startsWith('ids:'))return v.slice(4).split(',').includes(x.id);if(v.startsWith('dim:'))return x.dim===v.slice(4);return true}
const sb=(v,l)=>`<button class="btn ${S.set===v?'on':''}" data-set="${v}">${esc(l)}</button>`;
function arr(s){return {id:s[0],use:s[1],fr:s[2],cn:s[3],ex:s[4]}}
const P=id=>S.p[id]||(S.p[id]={c:0,w:0,st:0});
let cur=null,retype=false,first=true;
const words=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'%.\- ]/g,' ').replace(/\.(?=\s|$)/g,' ').split(/\s+/).filter(Boolean);
function pool(){let L=ALL.filter(inSet);if(S.set==='wrong')L=ALL.filter(x=>(S.p[x.id]||{}).bad);
 const notDone=L.filter(x=>(S.p[x.id]||{st:0}).st<3);return notDone.length?notDone:L}
function dnext(){retype=false;first=true;const L=pool().filter(x=>!cur||x.id!==cur.id||pool().length===1);
 if(!L.length){$('cue').textContent='错句本空了';$('fr').textContent='';return}
 const seq=String(S.set).startsWith('model');L.sort((a,b)=>seq?((P(a.id).st>=3)-(P(b.id).st>=3))||(a.idx-b.idx):(P(a.id).st-P(b.id).st)||(Math.random()-.5));cur=L[0];
 $('cue').textContent=cur.cn;$('fr').innerHTML=cur.id+' · '+slot(cur.fr);$('ta').value='';$('dres').innerHTML='';dstat();
 if(matchMedia('(pointer:fine)').matches)$('ta').focus()}
let voice=null;function pickV(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV}
function say(r){if(!cur||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.ex);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=r||.95;speechSynthesis.speak(u)}
function dstat(){const L=ALL.filter(inSet),done=L.filter(x=>P(x.id).st>=3).length,bad=ALL.filter(x=>(S.p[x.id]||{}).bad).length;
 $('dstat').innerHTML=`已熟 <em>${done}</em> / ${L.length} · 错句 <em>${bad}</em>`}
function lcsDiff(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 const out=[];let i=0,j=0;while(j<n){if(i<m&&a[i]===b[j]){out.push(esc(b[j]));i++;j++}else if(i<m&&d[i+1][j]>=d[i][j+1])i++;else{out.push(`<span class="w">${esc(b[j])}</span>`);j++}}return out.join(' ')}
function frameTokens(fr){return words(fr.replace(/\[[^\]]*\]/g,' slotx '))}
function frameOK(got,fr){const t=frameTokens(fr);const re=new RegExp('^'+t.map(x=>x==='slotx'?'(?:\\S+ )*?\\S+':x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join(' ')+'$');return re.test(got.join(' '))}
function frameDiff(got,fr){const fixed=frameTokens(fr).filter(x=>x!=='slotx'),g=new Set();
 const a=got,b=fixed,m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){g.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
 let k=0;return frameTokens(fr).map(x=>x==='slotx'?'<span style="color:var(--blue)">[…]</span>':(g.has(k++)?esc(x):`<span class="w">${esc(x)}</span>`)).join(' ')}
function dcheck(){if(!cur)return;const got=words($('ta').value);if(!got.length)return;
 const ok=got.join(' ')===words(cur.ex).join(' ')||frameOK(got,cur.fr);const p=P(cur.id);
 if(retype){if(ok){$('dres').innerHTML='<span style="color:var(--ok)">好,下一句</span>';setTimeout(dnext,700)}else $('dres').innerHTML=frameDiff(got,cur.fr);return}
 if(ok){if(first){p.c++;p.st++;if(p.st>=3)p.bad=false}$('dres').innerHTML='<span style="color:var(--ok)">全对</span><div style="font-size:13px;color:var(--dim);margin-top:4px">例句:'+esc(cur.ex)+'</div>';save();setTimeout(dnext,1400)}
 else{p.w++;p.st=0;p.bad=true;first=false;retype=true;$('dres').innerHTML=frameDiff(got,cur.fr)+'<div style="font-size:12px;color:var(--dim);margin-top:6px">红色 = 句架里拼错或漏掉的词;[…] 里填什么都行。再打一遍</div><div style="font-size:13px;color:#c9d2e3;margin-top:6px">例句:'+esc(cur.ex)+'</div>';$('ta').value='';$('ta').focus();save();dstat()}}

function show(t){S.tab=t;save();M.innerHTML=views[t]();document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0);
 if(t==='drill'){$('dChk').onclick=dcheck;$('dPlay').onclick=()=>say();$('dSlow').onclick=()=>say(.7);$('dNext').onclick=dnext;$('dHint').onclick=()=>{if(cur){$('dres').innerHTML='<span style="color:var(--gold)">'+esc(cur.ex)+'</span>';P(cur.id).bad=true;P(cur.id).st=0;first=false;save()}};
  $('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();dcheck()}});
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{S.set=b.dataset.set;save();cur=null;show('drill')});dnext()}}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));
